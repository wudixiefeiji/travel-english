<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图标预览 - 无框版</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#07090F;color:#E8EDF5;font-family:-apple-system,"PingFang SC",sans-serif;padding:40px 20px;min-height:100vh}
h1{text-align:center;font-size:22px;margin-bottom:8px;background:linear-gradient(135deg,#A78BFA,#22D3EE);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sub{text-align:center;color:#64748B;font-size:14px;margin-bottom:30px}
.preview-row{display:flex;justify-content:center;gap:30px;flex-wrap:wrap;margin-bottom:40px}
.icon-card{text-align:center}
.icon-card img{width:120px;height:120px;border-radius:28px;object-fit:cover;box-shadow:0 8px 32px rgba(0,0,0,0.4)}
.icon-card .name{color:#94A3B8;font-size:12px;margin-top:10px}
/* iPhone home screen simulation */
.phone{width:320px;margin:0 auto;background:linear-gradient(135deg,#1a3a2a 0%,#2d5a3d 50%,#1a3a2a 100%);border-radius:40px;padding:20px 16px 16px;box-shadow:0 20px 60px rgba(0,0,0,0.5)}
.status-bar{display:flex;justify-content:space-between;color:#fff;font-size:13px;font-weight:600;margin-bottom:20px;padding:0 8px}
.app-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px 16px;padding:0 8px}
.app{text-align:center}
.app img{width:60px;height:60px;border-radius:14px;object-fit:cover}
.app .label{color:#fff;font-size:10px;margin-top:4px;text-align:center}
</style>
</head>
<body>
<h1>无框全出血 · 水晶纸飞机</h1>
<p class="sub">去掉了白框 · 去掉了水印 · 跟其他App一样</p>

<div class="preview-row">
  <div class="icon-card">
    <img src="icon-preview-clean.png" alt="新图标">
    <div class="name">旅行英语 (180×180)</div>
  </div>
</div>

<div class="phone">
  <div class="status-bar"><span>18:12</span><span>5G 🔋</span></div>
  <div class="app-grid">
    <div class="app"><img src="icon-preview-clean.png"><div class="label">旅行英语</div></div>
    <div class="app"><div style="width:60px;height:60px;border-radius:14px;background:#000;display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto">🎵</div><div class="label">TikTok</div></div>
    <div class="app"><div style="width:60px;height:60px;border-radius:14px;background:linear-gradient(135deg,#667eea,#764ba2);margin:0 auto"></div><div class="label">1.1.1.1</div></div>
    <div class="app"><div style="width:60px;height:60px;border-radius:14px;background:#FF6B6B;margin:0 auto"></div><div class="label">追剧</div></div>
  </div>
</div>

</body>
</html>
