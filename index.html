function lookupBasicWord(word) {
  if (!word) return null;
  var w = word.toLowerCase().replace(/[^a-z']/g, '');
  if (BASIC_DICT[w]) return BASIC_DICT[w];
  var singular = w.replace(/s$/, '');
  if (BASIC_DICT[singular]) return BASIC_DICT[singular];
  var past = w.replace(/ed$/, '');
  if (BASIC_DICT[past]) return BASIC_DICT[past];
  var ing = w.replace(/ing$/, '');
  if (BASIC_DICT[ing]) return BASIC_DICT[ing];
  return null;
}

function speak(text) {
  if (!text || !window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  const tts = Store.get('ttsSettings', { rate: 0.85, voice: '' });
  u.lang = 'en-US'; u.rate = tts.rate || 0.85; u.pitch = 1;
  if (tts.voice) {
    const voices = window.speechSynthesis.getVoices();
    const v = voices.find(vv => vv.name === tts.voice);
    if (v) u.voice = v;
  }
  window.speechSynthesis.speak(u);
}

function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}


// ===== V17: Improved example sentence generation =====
function generateWordExamples(word, translation) {
  if (!word) return [];
  var w = word.toLowerCase().trim();
  var trans = (translation || '').trim();
  var examples = [];

  // V17: Skip generation for full sentences/expressions (question words, etc.)
  if (/^(how|what|where|when|why|who|which|is|are|do|does|can|could|would|will|i|you|he|she|they|we|it)\s/.test(w)) {
    return [];
  }

  // Detect word type from translation and word structure
  var isPhrase = w.indexOf(' ') > -1 || w.indexOf('-') > -1;
  var isVerb = false;
  var isAdj = false;
  var isNoun = false;

  // Heuristic: check translation for common patterns
  // V17: Phrases (multi-word) are almost always nouns, skip verb/adj detection
  if (trans && !isPhrase) {
    // Verbs often end with action characters
    if (/[说问告诉解释记得忘记需要想要喜欢知道认为觉得希望开始停止继续帮助买卖给拿带放看听听写读学教吃喝住走跑飞来去坐站睡醒穿脱].$/.test(trans) || 
        /^(说|问|告诉|解释|记得|忘记|需要|想要|喜欢|知道|认为|觉得|希望|开始|停止|继续|帮助|问候|打招呼|值机|登机|入住|退房|换乘|转机|申报)/.test(trans)) {
      isVerb = true;
    }
    // Adjectives often end with 的
    if (trans.indexOf('的') === trans.length - 1 || /(迟的|准点的|延误的|兴奋的|感激的|重的|美丽的|便宜的|昂贵的)/.test(trans)) {
      isAdj = true;
    }
  }
  // Default to noun
  if (!isVerb && !isAdj) isNoun = true;

  // Determine article: use "the" for specific nouns, "a/an" for countable
  var article = 'the';
  var firstLetter = w.charAt(0);
  if ('aeiou'.indexOf(firstLetter) >= 0) article = 'an';
  else article = 'a';

  // For phrases, use "the" or no article
  var nounPhrase = isPhrase ? w : (article + ' ' + w);
  var cnRef = trans || w;

  var patterns = [];

  if (isVerb) {
    patterns = [
      { en: "I usually " + w + " every day.", cn: "我每天通常" + cnRef + "。" },
      { en: "Can you " + w + " for me?", cn: "你能帮我" + cnRef + "吗？" },
      { en: "She wants to " + w + " tomorrow.", cn: "她明天想" + cnRef + "。" },
      { en: "It is important to " + w + " correctly.", cn: "正确地" + cnRef + "很重要。" },
      { en: "They will " + w + " together.", cn: "他们将一起" + cnRef + "。" },
      { en: "Do you know how to " + w + "?", cn: "你知道怎么" + cnRef + "吗？" }
    ];
  } else if (isAdj) {
    patterns = [
      { en: "This is very " + w + ".", cn: "这非常" + cnRef + "。" },
      { en: "The weather is " + w + " today.", cn: "今天天气" + cnRef + "。" },
      { en: "She looks " + w + ".", cn: "她看起来" + cnRef + "。" },
      { en: "I think it is too " + w + ".", cn: "我觉得太" + cnRef + "了。" },
      { en: "Everything seems " + w + " here.", cn: "这里一切看起来" + cnRef + "。" }
    ];
  } else {
    // Noun patterns
    patterns = [
      { en: "I need " + nounPhrase + " right now.", cn: "我现在需要" + cnRef + "。" },
      { en: "Where can I find " + nounPhrase + "?", cn: "我在哪里能找到" + cnRef + "？" },
      { en: "This " + w + " is very useful.", cn: "这个" + cnRef + "非常有用。" },
      { en: "Could you show me " + nounPhrase + "?", cn: "你能给我看看" + cnRef + "吗？" },
      { en: "I lost my " + w + ".", cn: "我丢了我的" + cnRef + "。" },
      { en: "How much does " + nounPhrase + " cost?", cn: cnRef + "多少钱？" }
    ];
  }

  // Pick 3 patterns deterministically based on word hash
  var hash = 0;
  for (var i = 0; i < w.length; i++) {
    hash = ((hash << 5) - hash) + w.charCodeAt(i);
    hash = hash & hash;
  }
  var selected = [];
  var used = {};
  for (var j = 0; j < 4; j++) {
    var idx = Math.abs(hash + j * 7) % patterns.length;
    if (!used[idx]) {
      used[idx] = true;
      selected.push(patterns[idx]);
      if (selected.length >= 3) break;
    }
  }

  return selected;
}

// ===== V11: Pronunciation scoring =====
var recognition = null;
var currentPronTarget = null;

function startPronunciation(targetText, resultEl, btnEl) {
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { showToast('浏览器不支持语音识别'); return; }
  // If already recording, stop it
  if (recognition) {
    try { recognition.stop(); } catch(e){}
    recognition = null;
    if (window._currentPronBtn) { window._currentPronBtn.classList.remove('recording'); window._currentPronBtn.textContent = '🎤 跟读'; }
    return;
  }
  if (btnEl) { btnEl.classList.add('recording'); btnEl.textContent = '⏹ 停止'; window._currentPronBtn = btnEl; }
  currentPronTarget = targetText;
  recognition = new SR();
  recognition.lang = 'en-US';
  recognition.interimResults = false;
  recognition.maxAlternatives = 3;
  recognition.continuous = false;
  // Show recording UI with stop button
  resultEl.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap"><div class="pron-recording">\uD83C\uDFA4 正在聆听...</div><button class="pron-stop-btn" onclick="stopPronunciation()">\u23F9 停止</button></div>';
  recognition.onresult = function(event) {
    var bestScore = 0;
    var bestText = '';
    for (var i = 0; i < event.results[0].length; i++) {
      var transcript = event.results[0][i].transcript.trim().toLowerCase();
      var confidence = event.results[0][i].confidence || 0.5;
      var score = calculatePronScore(targetText.toLowerCase(), transcript, confidence);
      if (score > bestScore) { bestScore = score; bestText = transcript; }
    }
    showPronResult(resultEl, bestScore, bestText, targetText);
    savePronScore(targetText, bestScore);
  };
  if (window._currentPronBtn) { window._currentPronBtn.classList.remove('recording'); window._currentPronBtn.textContent = '🎤 跟读'; window._currentPronBtn = null; }
  recognition.onerror = function(event) {
    if (event.error === 'not-allowed') {
      resultEl.innerHTML = '<div class="pron-error">\u26A0\uFE0F 请允许麦克风权限</div>';
    } else if (event.error === 'no-speech') {
      resultEl.innerHTML = '<div class="pron-error">\u672A\u68C0\u6D4B\u5230\u8BED\u97F3\uFF0C\u8BF7\u91CD\u8BD5</div>';
    } else if (event.error === 'aborted') {
      // User stopped, don't show error
    } else {
      resultEl.innerHTML = '<div class="pron-error">\u8BC6\u522B\u5931\u8D25: ' + event.error + '</div>';
    }
  };
  recognition.onend = function() {
    recognition = null;
    if (window._currentPronBtn) { window._currentPronBtn.classList.remove('recording'); window._currentPronBtn.textContent = '🎤 跟读'; window._currentPronBtn = null; }
  };
  recognition.start();
}

function stopPronunciation() {
  if (recognition) {
    try { recognition.stop(); } catch(e){}
    recognition = null;
  }
  if (window._currentPronBtn) { window._currentPronBtn.classList.remove('recording'); window._currentPronBtn.textContent = '🎤 跟读'; window._currentPronBtn = null; }
}

// Levenshtein distance for text comparison
function levenshtein(a, b) {
  var m = a.length, n = b.length;
  var d = [];
  for (var i = 0; i <= m; i++) d[i] = [i];
  for (var j = 0; j <= n; j++) d[0][j] = j;
  for (var i = 1; i <= m; i++) {
    for (var j = 1; j <= n; j++) {
      var cost = a[i-1] === b[j-1] ? 0 : 1;
      d[i][j] = Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1]+cost);
    }
  }
  return d[m][n];
}

function calculatePronScore(target, recognized, confidence) {
  // Normalize: remove punctuation, extra spaces
  target = target.replace(/[^a-z\s']/g, '').replace(/\s+/g, ' ').trim();
  recognized = recognized.replace(/[^a-z\s']/g, '').replace(/\s+/g, ' ').trim();
  if (!target || !recognized) return 0;
  var targetWords = target.split(' ');
  var recWords = recognized.split(' ');
  // Word-level accuracy
  var dist = levenshtein(target, recognized);
  var accuracy = Math.max(0, 1 - dist / Math.max(target.length, recognized.length));
  // Word match ratio
  var matched = 0;
  var recSet = {};
  recWords.forEach(function(w) { recSet[w] = (recSet[w]||0)+1; });
  targetWords.forEach(function(w) { if (recSet[w] > 0) { matched++; recSet[w]--; } });
  var wordMatch = matched / targetWords.length;
  // Combined score: 60% word match + 30% accuracy + 10% confidence
  var score = Math.round((wordMatch * 0.6 + accuracy * 0.3 + confidence * 0.1) * 100);
  return Math.min(100, Math.max(0, score));
}

function showPronResult(el, score, recognized, target) {
  var grade, color, emoji;
  if (score >= 90) { grade='优秀'; color='#34D399'; emoji='🌟'; }
  else if (score >= 75) { grade='良好'; color='#22D3EE'; emoji='👍'; }
  else if (score >= 60) { grade='及格'; color='#FBBF24'; emoji='💪'; }
  else { grade='需练习'; color='#FB923C'; emoji='🔄'; }
  var html = '<div class="pron-result">';
  html += '<div class="pron-score" style="color:' + color + '">' + emoji + ' ' + score + '分</div>';
  html += '<div class="pron-grade">' + grade + '</div>';
  html += '<div class="pron-detail">';
  html += '<div class="pron-target">目标: ' + esc(target) + '</div>';
  html += '<div class="pron-recognized">你说: ' + esc(recognized) + '</div>';
  html += '</div></div>';
  el.innerHTML = html;
}

var EB_INTERVALS = [1, 2, 4, 7, 15, 30]; // days

function markWordKnown(word) {
  if (!word) return;
  removeFromErrorPool(word);
  var reviews = Store.get('reviews', {});
  var key = word.toLowerCase();
  var now = Date.now();
  var existing = reviews[key];
  var intervalIdx = 0;
  if (existing && typeof existing.intervalIdx === 'number') {
    intervalIdx = Math.min(existing.intervalIdx + 1, EB_INTERVALS.length - 1);
  }
  var intervalDays = EB_INTERVALS[intervalIdx];
  reviews[key] = {
    word: word,
    intervalIdx: intervalIdx,
    lastReview: now,
    nextReview: now + intervalDays * 24 * 60 * 60 * 1000
  };
  Store.set('reviews', reviews);
}

function getTodayReviewCount() {
  var reviews = Store.get('reviews', {});
  var now = Date.now();
  return Object.keys(reviews).filter(function(k) {
    return reviews[k] && reviews[k].nextReview && reviews[k].nextReview <= now;
  }).length;
}

function getReviewWordList() {
  var reviews = Store.get('reviews', {});
  var now = Date.now();
  var result = [];
  Object.keys(reviews).forEach(function(k) {
    var r = reviews[k];
    if (r && r.nextReview && r.nextReview <= now) {
      var info = findWordInData(r.word);
      if (info) result.push(info);
    }
  });
  return result;
}

function findWordInData(word) {
  if (!word) return null;
  var w = word.toLowerCase();
  for (var i = 0; i < DATA.length; i++) {
    var d = DATA[i];
    if (!d) continue;
    var nw = d.newWords || [];
    for (var j = 0; j < nw.length; j++) {
      if (nw[j] && nw[j].word && nw[j].word.toLowerCase() === w) {
        return { word: nw[j].word, translation: nw[j].translation, day: d.day };
      }
    }
    var rw = d.reviewWords || [];
    for (var j = 0; j < rw.length; j++) {
      if (rw[j] && rw[j].word && rw[j].word.toLowerCase() === w) {
        return { word: rw[j].word, translation: rw[j].translation, day: d.day };
      }
    }
  }
  return null;
}

function getWordEbbinghausStatus(word) {
  if (!word) return 'new';
  var reviews = Store.get('reviews', {});
  var r = reviews[word.toLowerCase()];
  if (!r) return 'new';
  var now = Date.now();
  if (r.nextReview && r.nextReview <= now) return 'due';
  return 'known';
}

function startReview() {
  var reviewWords = getReviewWordList();
  if (!reviewWords.length) {
    showToast('今日复习已完成，继续保持！');
    return;
  }
  var byDay = {};
  reviewWords.forEach(function(w) {
    if (!byDay[w.day]) byDay[w.day] = [];
    byDay[w.day].push(w);

  var days = Object.keys(byDay).sort(function(a, b) { return parseInt(a) - parseInt(b); });

  var html = '<div style="font-size:13px;color:var(--t2);margin-bottom:4px">基于艾宾浩斯记忆曲线，以下词汇需要复习：</div>';
  html += '<div style="font-size:24px;font-weight:900;color:#60A5FA;margin-bottom:12px">' + reviewWords.length + ' 个词汇</div>';
  html += '<div class="review-modal-list">';
  days.forEach(function(d) {
    var words = byDay[d];
    var dayData = DATA.find(function(dd){return dd && dd.day == parseInt(d);});
    html += '<div class="review-modal-day-group">';
    html += '<div class="review-modal-day-label">Day ' + esc(d) + (dayData ? ' · ' + esc(dayData.dayTitle||'') : '') + ' (' + words.length + '词)</div>';
    html += '<div class="review-modal-words">';
    words.forEach(function(w) {
      html += '<span class="review-modal-word">' + esc(w.word) + '</span>';

  html += '</div>';
  html += '<div class="btn-row"><button class="btn primary" onclick="closeReviewModal();startReviewFromDay(' + parseInt(days[0]) + ')">开始复习</button></div>';

  document.getElementById('review-modal-content').innerHTML = html;

  }, 500);
}

// ===== V13: Error Pool (priority review) =====
function addToErrorPool(word, translation, day) {
  if (!word) return;
  var pool = Store.get("errorPool", []);
  var key = word.toLowerCase();
  for (var i = 0; i < pool.length; i++) {
    if (pool[i] && pool[i].word && pool[i].word.toLowerCase() === key) {
      pool[i].errorCount = (pool[i].errorCount || 1) + 1;
      pool[i].lastError = Date.now();
      Store.set("errorPool", pool);
      return;
    }
  }
  pool.push({ word: word, translation: translation || "", day: day || (curDay ? curDay.day : 0), errorCount: 1, addedAt: Date.now(), lastError: Date.now() });
  Store.set("errorPool", pool);
}

function removeFromErrorPool(word) {
  if (!word) return;
  var pool = Store.get("errorPool", []);
  var key = word.toLowerCase();
  var filtered = pool.filter(function(p) { return !(p && p.word && p.word.toLowerCase() === key); });
  Store.set("errorPool", filtered);
}

function getErrorPoolWords() {
  var pool = Store.get("errorPool", []);
  var result = [];
  pool.forEach(function(p) {
    if (!p || !p.word) return;
    var info = findWordInData(p.word);
    if (info) result.push(info);
    else result.push({ word: p.word, translation: p.translation, day: p.day || 0 });
  });
  return result;
}

function clearErrorPool() {
  Store.set("errorPool", []);
  showToast("错词池已清空");
  renderNotebook();
}

function startErrorPoolReview() {
  var errorWords = getErrorPoolWords();
  if (!errorWords.length) { showToast("错词池为空"); return; }
  errorWords.sort(function(){return Math.random()-0.5;});
  curWords = errorWords;
  curDay = null;
  wIdx = 0;
  wMode = "card";
  document.getElementById("w-title").textContent = "错词复习";
  showPage("pg-words");
  renderWords();
  setupSwipe();
}

// ===== V10: Word Notebook =====
function addToNotebook(word, translation, day) {
  if (!word) return;
  var notebook = Store.get('notebook', []);
  var key = word.toLowerCase();
  for (var i = 0; i < notebook.length; i++) {
    if (notebook[i] && notebook[i].word && notebook[i].word.toLowerCase() === key) return;
  }
  notebook.push({
    word: word,
    translation: translation || '',
    day: day || (curDay ? curDay.day : 0),
    addedAt: Date.now()
  });
  Store.set('notebook', notebook);
}

function removeFromNotebook(word) {
  if (!word) return;
  var notebook = Store.get('notebook', []);
  var key = word.toLowerCase();
  var filtered = notebook.filter(function(n) {
    return !(n && n.word && n.word.toLowerCase() === key);
  });
  Store.set('notebook', filtered);
}

function isInNotebook(word) {
  if (!word) return false;
  var notebook = Store.get('notebook', []);
  var key = word.toLowerCase();
  for (var i = 0; i < notebook.length; i++) {
    if (notebook[i] && notebook[i].word && notebook[i].word.toLowerCase() === key) return true;
  }
  return false;
}

function toggleNotebook(word, translation, day) {
  if (isInNotebook(word)) {
    removeFromNotebook(word);
    showToast('已移出生词本');
  } else {
    addToNotebook(word, translation, day);
    showToast('已加入生词本');
  }
}

function onBookmarkClick() {
  var w = curWords[wIdx];
  if (!w) return;
  toggleNotebook(w.word, w.translation, curDay ? curDay.day : 0);
  renderCard();
}

function renderNotebook() {
  var notebook = Store.get('notebook', []);
  var errorPool = Store.get('errorPool', []);
  var container = document.getElementById('nb-content');
  var countEl = document.getElementById('nb-count');
  if (countEl) countEl.textContent = (notebook.length + errorPool.length) + ' 词';
  if (!container) return;
  if (!notebook.length && !errorPool.length) {
    container.innerHTML = '<div class="empty-state"><div class="es-icon">📝</div><div class="es-title">生词本为空</div><div class="es-desc">在卡片、听写或选择题中答错的单词会自动加入</div></div>';
    return;
  }
  var html = '';
  // Error pool section
  if (errorPool.length) {
    html += '<div class="nb-error-section">';
    html += '<div class="nb-error-header"><div class="nb-error-title">⚠️ 易错词池 (' + errorPool.length + ')</div>';
    html += '<div class="nb-error-actions">';
    html += '<button class="btn primary sm" onclick="startErrorPoolReview()">复习错词</button>';
    html += '<button class="btn sec sm" onclick="clearErrorPool()">清空</button>';
    html += '</div></div>';
    errorPool.forEach(function(p, i) {
      if (!p) return;
      html += '<div class="nb-error-card">';
      html += '<div class="nbw-day">D' + (p.day || '?') + '</div>';
      html += '<div class="nbw-info"><div class="nbw-en">' + esc(p.word || '') + '</div>';
      html += '<div class="nbw-cn">' + esc(p.translation || '') + '</div></div>';
      html += '<div style="font-size:11px;color:var(--org);font-weight:700">×' + (p.errorCount||1) + '</div>';
      html += '<div class="nbw-btn" onclick="speakErrorWord(this)" data-word="' + escAttr(p.word||'') + '"><svg viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 010 7"/></svg></div>';
      html += '</div>';
    });
    html += '</div>';
  }
  if (notebook.length) {
    html += '<div style="font-size:13px;font-weight:800;color:var(--purp2);margin-bottom:8px;padding:0 4px">📚 生词本 (' + notebook.length + ')</div>';
  }
  notebook.forEach(function(n, i) {
    if (!n) return;
    html += '<div class="nb-word-card">';
    html += '<div class="nbw-day">D' + (n.day || '?') + '</div>';
    html += '<div class="nbw-info"><div class="nbw-en">' + esc(n.word || '') + '</div>';
    html += '<div class="nbw-cn">' + esc(n.translation || '') + '</div></div>';
    html += '<div class="nbw-actions">';
    html += '<div class="nbw-btn" onclick="speakNotebookWord(' + i + ')"><svg viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 010 7"/></svg></div>';
    html += '<div class="nbw-btn del" onclick="deleteNotebookWord(' + i + ')"><svg viewBox="0 0 24 24"><path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg></div>';
    html += '</div></div>';
  });
  container.innerHTML = html;
}

function speakErrorWord(el) {
  var w = el.getAttribute("data-word");
  if (w) speak(w);
}

function speakNotebookWord(idx) {
  var notebook = Store.get('notebook', []);
  var n = notebook[idx];
  if (n) speak(n.word);
}

function deleteNotebookWord(idx) {
  var notebook = Store.get('notebook', []);
  notebook.splice(idx, 1);
  Store.set('notebook', notebook);
  renderNotebook();
}

// ===== V10: Global Word Search =====
function searchWords(query) {
  if (!query || !query.trim()) return [];
  var q = query.trim().toLowerCase();
  var results = [];
  DATA.forEach(function(d) {
    if (!d) return;
    (d.newWords || []).forEach(function(w) {
      if (!w) return;
      if ((w.word && w.word.toLowerCase().indexOf(q) !== -1) ||
          (w.translation && w.translation.toLowerCase().indexOf(q) !== -1)) {
        results.push({ word: w.word, translation: w.translation, day: d.day });
      }
    });
    (d.reviewWords || []).forEach(function(w) {
      if (!w) return;
      if ((w.word && w.word.toLowerCase().indexOf(q) !== -1) ||
          (w.translation && w.translation.toLowerCase().indexOf(q) !== -1)) {
        results.push({ word: w.word, translation: w.translation, day: d.day });
      }
    });
  });
  return results.slice(0, 50);
}

function renderSearchResults(results) {
  var container = document.getElementById('search-results');
  if (!container) return;
  if (!results.length) {
    container.innerHTML = '<div class="empty-state" style="padding:30px 20px"><div class="es-desc">未找到匹配的单词</div></div>';
    return;
  }
  var html = '';
  results.forEach(function(r) {
    html += '<div class="search-result-item" onclick="openDayDetail(' + r.day + ')">';
    html += '<div class="sr-day">D' + r.day + '</div>';
    html += '<div class="sr-word"><div class="sr-en">' + esc(r.word) + '</div><div class="sr-cn">' + esc(r.translation || '') + '</div></div>';
    html += '</div>';
  });
  container.innerHTML = html;
}

function onSearchInput(val) {
  var results = document.getElementById('search-results');
  var clear = document.getElementById('search-clear');
  var cards = document.getElementById('home-cards');
  var header = document.querySelector('#pg-home .section-header');
  if (!val || !val.trim()) {
    if (results) { results.innerHTML = ''; results.style.display = 'none'; }
    if (clear) clear.style.display = 'none';
    if (cards) cards.style.display = '';
    if (header) header.style.display = '';
    return;
  }
  if (results) results.style.display = '';
  if (clear) clear.style.display = '';
  if (cards) cards.style.display = 'none';
  if (header) header.style.display = 'none';
  renderSearchResults(searchWords(val));
}

function clearSearch() {
  var input = document.getElementById('global-search');
  if (input) input.value = '';
  onSearchInput('');
}

// ===== V10: Study Log + Heatmap =====
function logStudy(day, cat) {
  var log = Store.get('studyLog', {});
  var today = new Date().toDateString();
  if (!log[today]) log[today] = [];
  // V17: Use category_day key to avoid conflicts between travel and daily
  var key = (cat || 'travel') + '_' + day;
  if (log[today].indexOf(key) === -1) log[today].push(key);
  Store.set('studyLog', log);
}

function getStudyLog() {
  return Store.get('studyLog', {});
}

function renderHeatmap() {
  var log = getStudyLog();
  var weeks = 12;
  var today = new Date();
  var todayDay = today.getDay();
  var startDate = new Date(today);
  startDate.setDate(today.getDate() - (weeks - 1) * 7 - todayDay);

  var totalDays = 0;
  var totalSessions = 0;

  var html = '<div class="heatmap-container"><div class="heatmap-grid">';
  for (var w = 0; w < weeks; w++) {
    html += '<div class="heatmap-col">';
    for (var d = 0; d < 7; d++) {
      var date = new Date(startDate);
      date.setDate(startDate.getDate() + w * 7 + d);
      if (date > today) {
        html += '<div class="heatmap-cell" style="opacity:0"></div>';
        continue;
      }
      var dateStr = date.toDateString();
      var sessions = log[dateStr] ? log[dateStr].length : 0;
      var level = '';
      if (sessions > 0) totalDays++;
      totalSessions += sessions;
      if (sessions >= 4) level = 'l4';
      else if (sessions >= 3) level = 'l3';
      else if (sessions >= 2) level = 'l2';
      else if (sessions >= 1) level = 'l1';
      html += '<div class="heatmap-cell ' + level + '" title="' + (date.getMonth()+1) + '/' + date.getDate() + ': ' + sessions + '天"></div>';
    }
    html += '</div>';
  }
  html += '</div></div>';

  html += '<div class="heatmap-stats">';
  html += '<div class="heatmap-stat"><div class="hs-num">' + totalDays + '</div><div class="hs-label">学习天数</div></div>';
  html += '<div class="heatmap-stat"><div class="hs-num">' + totalSessions + '</div><div class="hs-label">学习次数</div></div>';
  html += '</div>';

  html += '<div class="heatmap-legend">少';
  html += '<div class="heatmap-cell"></div>';
  html += '<div class="heatmap-cell l1"></div>';
  html += '<div class="heatmap-cell l2"></div>';
  html += '<div class="heatmap-cell l3"></div>';
  html += '<div class="heatmap-cell l4"></div>';
  html += '多</div>';

  return html;
}

// ===== V10: TTS Settings =====
function loadVoices() {
  if (!window.speechSynthesis) return;
  var voices = window.speechSynthesis.getVoices();
  var select = document.getElementById('tts-voice');
  if (!select) return;
  var current = Store.get('ttsSettings', { rate: 0.85, voice: '' });

  // Filter English voices and categorize by gender
  var enVoices = voices.filter(function(v) { return v.lang && v.lang.indexOf('en') === 0; });

  // Identify male/female voices by common name patterns
  var maleVoices = enVoices.filter(function(v) {
    var n = v.name.toLowerCase();
    return n.indexOf('male') > -1 || n.indexOf('daniel') > -1 || n.indexOf('alex') > -1 ||
           n.indexOf('fred') > -1 || n.indexOf('rishi') > -1 || n.indexOf('diego') > -1 ||
           n.indexOf('jorge') > -1 || n.indexOf('oliver') > -1 || n.indexOf('arthur') > -1 ||
           n.indexOf('thomas') > -1 || n.indexOf('james') > -1 || n.indexOf('aaron') > -1 ||
           n.indexOf('tom') > -1 || n.indexOf('guy') > -1;
  });
  var femaleVoices = enVoices.filter(function(v) {
    var n = v.name.toLowerCase();
    return n.indexOf('female') > -1 || n.indexOf('samantha') > -1 || n.indexOf('victoria') > -1 ||
           n.indexOf('karen') > -1 || n.indexOf('moira') > -1 || n.indexOf('tessa') > -1 ||
           n.indexOf('serena') > -1 || n.indexOf('fiona') > -1 || n.indexOf('veena') > -1 ||
           n.indexOf('zira') > -1 || n.indexOf('susan') > -1 || n.indexOf('allison') > -1 ||
           n.indexOf('ava') > -1 || n.indexOf('joanna') > -1 || n.indexOf('kendra') > -1 ||
           n.indexOf('kimberly') > -1 || n.indexOf('salli') > -1 || n.indexOf('nicole') > -1;
  });

  // Remove duplicates (voices that matched both lists)
  var maleNames = maleVoices.map(function(v){return v.name;});
  femaleVoices = femaleVoices.filter(function(v){return maleNames.indexOf(v.name) === -1;});

  // If we couldn't identify by name, just take first few from each locale
  if (!maleVoices.length && !femaleVoices.length) {
    // Fallback: use different voices and label them generically
    var seen = {};
    var unique = enVoices.filter(function(v) {
      if (seen[v.name]) return false;
      seen[v.name] = true;
      return true;
    });
    // Pick up to 3 female and 2 male alternates
    femaleVoices = unique.filter(function(v, i) { return i % 2 === 0; }).slice(0, 3);
    maleVoices = unique.filter(function(v, i) { return i % 2 === 1; }).slice(0, 2);
  }

  var opts = '<option value="">默认语音</option>';

  if (femaleVoices.length) {
    opts += '<optgroup label="女声">';
    // Deduplicate
    var seenF = {};
    femaleVoices.forEach(function(v) {
      if (!seenF[v.name]) {
        seenF[v.name] = true;
        var label = v.name.replace(/\s*\(.*\)\s*/g, '').replace(/Microsoft |Google |Apple /g, '');
        opts += '<option value="' + escAttr(v.name) + '"' + (v.name === current.voice ? ' selected' : '') + '>\uD83D\uDC69 ' + esc(label) + '</option>';
      }
    });
    opts += '</optgroup>';
  }

  if (maleVoices.length) {
    opts += '<optgroup label="男声">';
    var seenM = {};
    maleVoices.forEach(function(v) {
      if (!seenM[v.name]) {
        seenM[v.name] = true;
        var label = v.name.replace(/\s*\(.*\)\s*/g, '').replace(/Microsoft |Google |Apple /g, '');
        opts += '<option value="' + escAttr(v.name) + '"' + (v.name === current.voice ? ' selected' : '') + '>\uD83D\uDC68 ' + esc(label) + '</option>';
      }
    });
    opts += '</optgroup>';
  }

  // Limit to max 6 options total (3 female + 3 male)
  select.innerHTML = opts;
}

if (window.speechSynthesis) {
  window.speechSynthesis.onvoiceschanged = loadVoices;
}

function openSettings() {
  var modal = document.getElementById('settings-modal');

// ===== V10: Export / Import =====
function exportData() {
  var data = {
    version: 'te_v14',
    exportDate: new Date().toISOString(),
    done: Store.get('done', {}),
    lastStudy: Store.get('lastStudy', 0),
    studyLog: Store.get('studyLog', {}),
    notebook: Store.get('notebook', []),
    reviews: Store.get('reviews', {}),
    errorPool: Store.get('errorPool', []),
    ttsSettings: Store.get('ttsSettings', { rate: 0.85, voice: '' })
  };
  var json = JSON.stringify(data, null, 2);
  var blob = new Blob([json], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'travel-english-backup-' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('数据已导出');
}

function importData(file) {
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var data = JSON.parse(e.target.result);
      if (data.done) Store.set('done', data.done);
      if (data.lastStudy) Store.set('lastStudy', data.lastStudy);
      if (data.studyLog) Store.set('studyLog', data.studyLog);
      if (data.notebook) Store.set('notebook', data.notebook);
      if (data.reviews) Store.set('reviews', data.reviews);
      if (data.errorPool) Store.set('errorPool', data.errorPool);
      if (data.ttsSettings) Store.set('ttsSettings', data.ttsSettings);
      showToast('数据导入成功');
      renderHome();
      if (document.getElementById('pg-stats').classList.contains('active')) renderStats();
    } catch(err) {
      showToast('导入失败：文件格式错误');
    }
  };
  reader.readAsText(file);
}

function handleImportFile(input) {
  if (input.files && input.files[0]) {
    importData(input.files[0]);
    input.value = '';
  }
}
