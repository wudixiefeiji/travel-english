xampleCn":""},{"word":"gesture","translation":"手势 示意动作","exampleEn":"","exampleCn":""},{"word":"custom","translation":"习俗 风俗","exampleEn":"","exampleCn":""},{"word":"tradition","translation":"传统 惯例","exampleEn":"","exampleCn":""},{"word":"taboo","translation":"禁忌 忌讳","exampleEn":"","exampleCn":""},{"word":"appropriate","translation":"合适的 适当的","exampleEn":"","exampleCn":""},{"word":"offensive","translation":"冒犯的 无礼的","exampleEn":"","exampleCn":""},{"word":"respectful","translation":"尊重的 恭敬的","exampleEn":"","exampleCn":""},{"word":"courtesy","translation":"礼貌 谦恭","exampleEn":"","exampleCn":""},{"word":"tip","translation":"小费 给小费","exampleEn":"","exampleCn":""},{"word":"dress code","translation":"着装要求","exampleEn":"","exampleCn":""},{"word":"punctual","translation":"准时的 守时的","exampleEn":"","exampleCn":""}],"dialog":[{"role":"YOU","textEn":"I noticed people here don't make eye contact when talking. Is that part of the culture?","textCn":""},{"role":"LOCAL","textEn":"Yes, in our culture, too much eye contact can be seen as rude or aggressive.","textCn":""},{"role":"YOU","textEn":"That's so interesting! In my country, eye contact shows respect and honesty.","textCn":""},{"role":"LOCAL","textEn":"Cultural differences can be surprising. That's why travel is so eye-opening.","textCn":""},{"role":"YOU","textEn":"I want to avoid misunderstandings. Are there other norms I should know?","textCn":""},{"role":"LOCAL","textEn":"When someone gives you a gift, don't open it right away. It's considered polite to wait.","textCn":""},{"role":"YOU","textEn":"Oh, I almost made that mistake yesterday! I need to adapt quickly.","textCn":""},{"role":"LOCAL","textEn":"Don't worry too much. People appreciate it when visitors try to understand our customs.","textCn":""},{"role":"YOU","textEn":"What about body language? Are there gestures I should avoid?","textCn":""},{"role":"LOCAL","textEn":"Avoid pointing with one finger. Use your whole hand if you need to gesture toward something.","textCn":""},{"role":"YOU","textEn":"I'll keep that in mind. I want to be polite and respectful during my trip.","textCn":""},{"role":"LOCAL","textEn":"That attitude is exactly what makes a good traveler. Embrace the differences!","textCn":""},{"role":"YOU","textEn":"Have you met other travelers who struggled with cultural adjustment?","textCn":""},{"role":"LOCAL","textEn":"Many do at first. But those who communicate openly and ask questions usually adapt well.","textCn":""}],"essay":{"title":"Embracing Cultural Differences","titleCn":"拥抱文化差异","sentences":[{"en":"Traveling to a new country means entering a world with different norms and expectations.","cn":"去一个新国家旅行意味着进入一个有不同规范和期望的世界。"},{"en":"Every culture has its own way of communicating and showing respect.","cn":"每种文化都有自己的交流方式和表达尊重的方式。"},{"en":"What is polite in one place can be rude in another.","cn":"在一个地方礼貌的事在另一个地方可能很粗鲁。"},{"en":"Body language varies greatly across cultures.","cn":"肢体语言在不同文化中差异很大。"},{"en":"Eye contact, hand gestures, and personal space all have different meanings around the world.","cn":"目光接触、手势、个人空间在世界各地都有不同的含义。"},{"en":"Stereotypes can lead to misunderstandings when we judge too quickly.","cn":"刻板印象如果太早下判断会导致误解。"},{"en":"Instead of expecting others to adapt, we should adjust our own behavior.","cn":"与其期待别人适应我们不如我们自己调整行为。"},{"en":"Asking questions and listening carefully helps us avoid mistakes.","cn":"提问和认真倾听可以帮助我们避免犯错。"},{"en":"When we embrace cultural diversity, traveling becomes a truly enriching experience.","cn":"当我们拥抱文化多样性旅行就变成了真正丰富的体验。"},{"en":"Every difference is a chance to learn something new about the world and ourselves.","cn":"每一个差异都是一次了解世界和了解自己的新机会。"}]}},{"day":34,"dayTitle":"旅行安全与防范","daySubtitle":"Travel Safety & Precautions","phase":"Phase 2","newWordsCount":15,"reviewWordsCount":75,"dialogCount":14,"totalWords":510,"newWords":[{"word":"safe","translation":"安全的","exampleEn":"","exampleCn":""},{"word":"dangerous","translation":"危险的","exampleEn":"","exampleCn":""},{"word":"risk","tran ranslation":"期望","exampleEn":"","exampleCn":""},{"word":"embrace","translation":"接纳","exampleEn":"","exampleCn":""}],"dialog":[{"role":"YOU","textEn":"Hi, I'm staying in this area for a few days. Is it safe here?","textCn":""},{"role":"STAFF","textEn":"Generally yes, but please be careful at night. Stay alert in crowded places.","textCn":""},{"role":"YOU","textEn":"What should I avoid?","textCn":""},{"role":"STAFF","textEn":"Avoid showing expensive items. Keep your belongings close to you.","textCn":""},{"role":"YOU","textEn":"Are there any scams I should know about?","textCn":""},{"role":"STAFF","textEn":"Sometimes people pretend to be police and ask for your passport. Be suspicious of strangers.","textCn":""},{"role":"YOU","textEn":"How can I prevent theft?","textCn":""},{"role":"STAFF","textEn":"Use a money belt and don't keep all your cash in one place. Watch out for pickpockets.","textCn":""},{"role":"YOU","textEn":"What if I lose my passport?","textCn":""},{"role":"STAFF","textEn":"Contact your embassy immediately. They can help you with a replacement.","textCn":""},{"role":"YOU","textEn":"Is there anything else I should do to protect myself?","textCn":""},{"role":"STAFF","textEn":"Save emergency contacts and the local police number. It's better to be safe than sorry.","textCn":""},{"role":"YOU","textEn":"Thank you. I'll be aware of my surroundings.","textCn":""},{"role":"STAFF","textEn":"You're welcome. Have a safe and enjoyable trip.","textCn":""}],"essay":{"title":"Staying Safe While Traveling","titleCn":"旅行时保持安全","sentences":[{"en":"Traveling is exciting, but safety is always important.","cn":"旅行很令人兴奋但安全永远重要。"},{"en":"Before I go out, I check if the area is safe.","cn":"出门前我会确认区域是否安全。"},{"en":"I try to avoid dangerous places, especially at night.","cn":"我尽量避免危险的地方尤其是晚上。"},{"en":"I keep my belongings close and stay alert in crowds.","cn":"我把随身物品放在身边在人群中保持警惕。"},{"en":"If someone looks suspicious, I walk away.","cn":"如果有人看起来可疑我就走开。"},{"en":"I never share pers textEn":"Many visitors buy a journal here as a souvenir. It's a wonderful way to capture memories.","textCn":""},{"role":"YOU","textEn":"I agree. Recording my experiences helps me remember every detail.","textCn":""},{"role":"STAFF","textEn":"Is there a spot where I can set up a tripod for a better angle?","textCn":""},{"role":"YOU","textEn":"The rooftop terrace is perfect for that. You'll get a scenic panoramic view.","textCn":""}],"essay":{"title":"Capturing Travel Memories","titleCn":"旅行记忆的捕捉","sentences":[{"en":"When I travel, I always bring my camera to photograph the beautiful places I visit.","cn":"旅行时我总是带上相机去拍照记录美丽的风景。"},{"en":"A scenic landscape deserves more than just a quick glance.","cn":"一处风景优美的景观值得不止匆匆一瞥。"},{"en":"I try to find the right angle to capture the best view.","cn":"我试着找到合适的角度捕捉最佳视野。"},{"en":"Sometimes I take a selfie to remember that I was there.","cn":"有时我会自拍来记住自己曾来过这里。"},{"en":"But I also write in my travel journal every evening.","cn":"但每晚我也会在旅行日记里写下感想。"},{"en":"Recording my thoughts helps me keep the memories alive.","cn":"记录想法帮我保持记忆鲜活。"},{"en":"Buying a souvenir from each place is another way to remember.","cn":"从每个地方买一件纪念品也是一种纪念方式。"},{"en":"I always ask for permission before photographing people.","cn":"拍照前我总会先征求许可。"},{"en":"Some museums do not allow flash or selfie sticks.","cn":"一些博物馆不允许使用闪光灯或自拍杆。"},{"en":"Whether through a photograph or a journal, capturing memories makes travel more meaningful.","cn":"无论是通过照片还是日记捕捉记忆让旅行更有意义。"}]}},{"day":36,"dayTitle":"旅行健康与运动","daySubtitle":"Staying Healthy & Active While Traveling","phase":"Phase 2","newWordsCount":15,"reviewWordsCount":45,"dialogCount":12,"totalWords":540,"newWords":[{"word":"fitness","translation":"健身","exampleEn":"","exampleCn":""},{"word":"exercise","translation":"运动 锻炼","exampleEn":"","exampleCn":""},{"word":"jogging","translation":"慢跑","exampleEn":"","exampleCn":""},{"word":"swimming","translation":"游泳","exampleEn":"","exampleCn":""},{"word":"hiking","translation":"徒步","exam tness center is on the third floor. It is open from six a.m. to ten p.m.","textCn":""},{"role":"YOU","textEn":"Great. Do you have a swimming pool as well?","textCn":""},{"role":"STAFF","textEn":"Yes, the pool is on the same floor. We also offer yoga classes every morning.","textCn":""},{"role":"YOU","textEn":"That sounds perfect. I try to exercise every day when I travel.","textCn":""},{"role":"STAFF","textEn":"That is a healthy habit. After your workout, you can visit our restaurant.","textCn":""},{"role":"YOU","textEn":"Is there a vegetarian menu? I do not eat meat.","textCn":""},{"role":"STAFF","textEn":"Absolutely. We have several vegetarian and vegan options.","textCn":""},{"role":"YOU","textEn":"Good to know. I also have a nut allergy. Should I tell the kitchen?","textCn":""},{"role":"STAFF","textEn":"Yes, please mention it when you order. Our chef takes allergies very seriously.","textCn":""},{"role":"YOU","textEn":"Thanks. One more thing — do you sell sunscreen at the front desk?","textCn":""},{"role":"STAFF","textEn":"Yes, we do. It is important to hydrate and protect your skin when you are out hiking.","textCn":""}],"essay":{"title":"Staying Healthy While Traveling","titleCn":"旅行中保持健康","sentences":[{"en":"When I travel, I always try to stay active.","cn":"旅行时我总是尽量保持活力。"},{"en":"I start my day with some stretching and a light workout.","cn":"我以拉伸和轻度锻炼开始新的一天。"},{"en":"Many hotels have a fitness center or a swimming pool.","cn":"许多酒店都有健身房或游泳池。"},{"en":"Jogging in a new city is a great way to explore.","cn":"在新城市慢跑是探索的好方式。"},{"en":"I also pay attention to my diet and choose healthy food.","cn":"我也注意饮食，选择健康的食物。"},{"en":"If I have an allergy, I always tell the waiter before ordering.","cn":"如果我有过敏，点餐前一定会告诉服务员。"},{"en":"Drinking enough water helps me stay hydrated and full of energy.","cn":"喝足够的水帮我保持水分和精力充沛。"},{"en":"Applying sunscreen is important, especially on sunny days.","cn":"涂抹防晒霜很重要，尤其是在晴天。"},{"en":"Travel can be tiring, but a little exercise keeps me ref // ===== Storage Layer =====
const Store = (function() {
  function init() {
    return new Promise(resolve => {
      try { localStorage.setItem('test', '1'); localStorage.removeItem('test'); resolve(); return; } catch(e) {}
      resolve();
    });
  }
  function get(k, d) {
    try {
      const v = localStorage.getItem(SK+'_'+k);
      return v ? JSON.parse(v) : d;
    } catch(e) { return d; }
  }
  function set(k, v) {
    try { localStorage.setItem(SK+'_'+k, JSON.stringify(v)); } catch(e) {}
  }
  return { init, get, set };
})();

const S = Store;

let curDay = null;
let curWords = [];
let wMode = 'card';
let wIdx = 0;
let quizState = null;
let swipeStartX = 0;
let swipeStartY = 0;

// ===== Toast =====
let toastTimer = null;
function showToast(msg, duration) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), duration || 1800);
}

function checkReminder() {
  const last = Store.get('lastStudy', 0);
  const now = Date.now();
  const oneDay = 24 * 60 * 60 * 1000;
  if (last && now - last > oneDay) {
    const days = Math.floor((now - last) / oneDay);
    setTimeout(() => showToast('你已经 ' + days + ' 天没学习了，今天继续加油！', 2500), 800);
  }
}

function markStudyToday() {
  Store.set('lastStudy', Date.now());
}

// ===== NAV =====
function switchNav(tab) {
  const id = tab === 'home' ? 'pg-home' : 'pg-stats';
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  const page = document.getElementById(id);
  if (page) page.classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  const btn = document.getElementById('nav-'+tab);
  if (btn) btn.classList.add('active');
  document.getElementById('pg-home').scrollTop = 0;
  document.getElementById('pg-stats').scrollTop = 0;
  if (tab === 'home') renderHome();
  if (tab === 'stats') renderStats();
}

function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  const page = document.getElementById(id);
  if (page) { page.classList.add('active'); page.scrollTop = 0; }
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
}

function goHome() { showPage('pg-home'); renderHome(); }
function goDay() { showPage('pg-day'); renderDay(); }

// ===== HOME =====
function renderHome() {
  const done = Store.get('done', {});
  const doneCount = Object.keys(done).filter(k => done[k]).length;
  const total = DATA.length;
  const pct = total > 0 ? Math.round(doneCount/total*100) : 0;
  document.getElementById('hm-done').textContent = doneCount;
  document.getElementById('hm-pct').textContent = pct;
  document.getElementById('hm-pbar').style.width = pct + '%';
  renderPhaseCards();
}

function renderPhaseCards() {
  const container = document.getElementById('home-cards');
  if (!container) return;
  const done = Store.get('done', {});

  // Group by phase
  const phases = {};
  DATA.forEach(d => {
    if (!d) return;
    const p = d.phase || 'Phase 1';
    if (!phases[p]) phases[p] = [];
    phases[p].push(d);
  });

  let html = '';
  const phaseNames = {
    'Phase 1': '生存基础',
    'Phase 2': '进阶沟通'
  };

  const phaseOrder = Object.keys(phases);
  phaseOrder.forEach(p => {
    const days = phases[p];
    if (!days.length) return;
    const label = phaseNames[p] || p;

    html += '<div class="phase-group">';
    html += '<div class="phase-label">' + esc(p) + ' · ' + esc(label) + '</div>';
    html += '<div class="phase-card-grid">';

    days.forEach(d => {
      if (!d) return;
      const isDone = done[d.day];
      const nw = (d.newWords || []).length;
      const rw = (d.reviewWords || []).length;

      html += '<div class="day-card" onclick="openDayDetail(' + d.day + ')">';
      html += '<div class="dc-num">' + d.day + '</div>';
      html += '<div class="dc-info">';
      html += '<div class="dc-title">' + esc(d.dayTitle || '') + '</div>';
      html += '<div class="dc-sub">' + esc(d.daySubtitle || '') + '</div>';
      html += '<div class="dc-tags">';
      if (nw) html += '<span class="dc-tag purp">' + nw + '词</span>';
      if (rw) html += '<span class="dc-tag cyan">' + rw + '复习</span>';
      html += '</div></div>';

      if (isDone) {
        html += '<div class="dc-done-mark"><svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg></div>';
      }
      html += '</div>';
    });

    html += '</div></div>';
  });

  container.innerHTML = html;
}

// ===== DAY DETAIL =====
function openDayDetail(n) {
  curDay = DATA.find(d => d && d.day === n);
  if (!curDay) { showToast('该天数据加载失败'); return; }
  wIdx = 0;
  quizState = null;
  markStudyToday();
  showPage('pg-day');
  renderDay();
}

function renderDay() {
  const d = curDay;
  if (!d) return;
  const done = Store.get('done', {});
  const isDone = done[d.day];

  document.getElementById('dd-title').textContent = 'Day ' + d.day;
  document.getElementById('dd-badge').textContent = isDone ? '已完成' : '进行中';
  document.getElementById('dd-badge').className = 'pbadge ' + (isDone ? 'done' : 'pending');

  const nw = d.newWords || [];
  const rw = d.reviewWords || [];
  const dlg = d.dialog || [];
  const essay = d.essay || {};
  const sentences = essay.sentences || [];

  let html = '<div class="dd-hero">';
  html += '<div class="dd-day">Day ' + d.day + ' · ' + (d.phase||'') + '</div>';
  html += '<div class="dd-title">' + esc(d.dayTitle) + '</div>';
  if (d.daySubtitle) html += '<div class="dd-sub">' + esc(d.daySubtitle) + '</div>';
  html += '<div class="dd-tags">';
  if (nw.length) html += '<span class="dd-tag purp">新词 ' + nw.length + '</span>';
  if (rw.length) html += '<span class="dd-tag cyan">复习 ' + rw.length + '</span>';
  if (dlg.length) {
    const youLines = dlg.filter(l => l && l.role && l.role.toUpperCase() === 'YOU');
    html += '<span class="dd-tag org">对话 ' + youLines.length + '句</span>';
  }
  if (sentences.length) html += '<span class="dd-tag ylw">阅读 ' + sentences.length + '句</span>';
  if (d.totalWords) html += '<span class="dd-tag">累计 ' + d.totalWords + '词</span>';
  html += '</div></div>';

  if (nw.length) {
    html += '<div class="mc" onclick="openWords(false)"><div class="mc-icon words">📝</div><div class="mc-body"><div class="mc-title">今日新词</div><div class="mc-desc">' + nw.length + ' 个新单词</div></div><div class="mc-arrow">→</div></div>';
  }
  if (rw.length) {
    html += '<div class="mc" onclick="openWords(true)"><div class="mc-icon review">🔄</div><div class="mc-body"><div class="mc-title">艾宾浩斯复习</div><div class="mc-desc">' + rw.length + ' 个词汇巩固</div></div><div class="mc-arrow">→</div></div>';
  }
  if (dlg.length) {
    const youLines = dlg.filter(l => l && l.role && l.role.toUpperCase() === 'YOU');
    html += '<div class="mc" onclick="openDlg()"><div class="mc-icon dialog">🗣</div><div class="mc-body"><div class="mc-title">口语练习</div><div class="mc-desc">' + youLines.length + ' 句台词</div></div><div class="mc-arrow">→</div></div>';
  }
  if (sentences.length) {
    html += '<div class="mc" onclick="openEssay()"><div class="mc-icon essay">📖</div><div class="mc-body"><div class="mc-title">阅读理解</div><div class="mc-desc">' + esc(essay.title||'') + '</div></div><div class="mc-arrow">→</div></div>';
  }

  html += '<div class="btn-row">';
  if (isDone) {
    html += '<button class="btn green" onclick="unmarkDayDone()">✓ 已完成</button>';
  } else {
    html += '<button class="btn primary" onclick="markDayDone()">标记完成</button>';
  }
  html += '</div>';

  document.getElementById('dd-content').innerHTML = html;
}

function markDayDone() {
  if (!curDay) return;
  const done = Store.get('done', {});
  done[curDay.day] = true;
  Store.set('done', done);
  showToast('Day ' + curDay.day + ' 已完成 ✓');
  renderDay();
}

function unmarkDayDone() {
  if (!curDay) return;
  const done = Store.get('done', {});
  delete done[curDay.day];
  Store.set('done', done);
  showToast('已取消完成');
  renderDay();
}

// ===== WORDS =====
function openWords(isReview) {
  curWords = isReview ? (curDay.reviewWords||[]) : (curDay.newWords||[]);
  if (!curWords.length) { showToast('没有可学习的词汇'); return; }
  wIdx = 0;
  wMode = 'card';
  quizState = null;
  document.getElementById('w-title').textContent = isReview ? '复习词汇' : '今日新词';
  showPage('pg-words');
  renderWords();
  setupSwipe();
}

function setupSwipe() {
  const c = document.getElementById('w-content');
  if (!c) return;
  c.addEventListener('touchstart', e => {
    swipeStartX = e.touches[0].clientX;
    swipeStartY = e.touches[0].clientY;
  }, {passive: true});
  c.addEventListener('touchend', e => {
    if (wMode !== 'card') return;
    const dx = e.changedTouches[0].clientX - swipeStartX;
    const dy = e.changedTouches[0].clientY - swipeStartY;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
      if (dx < 0 && wIdx < curWords.length - 1) { wIdx++; renderWords(); }
      else if (dx > 0 && wIdx > 0) { wIdx--; renderWords(); }
    }
  }, {passive: true});
}

function setWordMode(m) {
  wMode = m;
  wIdx = 0;
  quizState = null;
  renderWords();
}

function prevWord() {
  if (wIdx > 0) { wIdx--; renderWords(); }
}
function nextWord() {
  if (wIdx < curWords.length - 1) { wIdx++; renderWords(); }
}

function renderWords() {
  const words = curWords;
  const bar = document.getElementById('w-mode-bar');
  bar.innerHTML = '<button class="' + (wMode==='card'?'active':'') + '" data-mode="card" onclick="setWordMode(this.dataset.mode)">卡片</button><button class="' + (wMode==='dict'?'active':'') + '" data-mode="dict" onclick="setWordMode(this.dataset.mode)">听写</button><button class="' + (wMode==='quiz'?'active':'') + '" data-mode="quiz" onclick="setWordMode(this.dataset.mode)">选择</button>';
  document.getElementById('w-counter').textContent = (wIdx+1) + '/' + words.length;

  if (wMode === 'card') renderCard();
  else if (wMode === 'dict') renderDict();
  else renderQuiz();
}

function renderCard() {
  const words = curWords;
  const c = document.getElementById('w-content');
  if (wIdx >= words.length) {
    c.innerHTML = '<div class="empty-state"><div class="es-icon">🎉</div><div class="es-title">全部学完了！</div><div class="es-desc">已掌握 ' + words.length + ' 个词汇</div></div>';
    return;
  }
  const w = words[wIdx];
  if (!w) { wIdx++; renderWords(); return; }
  const prevDisabled = wIdx <= 0;
  const nextDisabled = wIdx >= words.length - 1;

  let html = '<div class="word-nav"><button class="btn sec sm" onclick="prevWord()" ' + (prevDisabled?'disabled':'') + '>上一个</button>';
  html += '<span class="wn-progress">' + (wIdx+1) + ' / ' + words.length + '</span>';
  html += '<button class="btn primary sm" onclick="nextWord()" ' + (nextDisabled?'disabled':'') + '>下一个</button></div>';

  html += '<div class="swipe-hint"><svg viewBox="0 0 24 24"><path d="M7 16l-4-4 4-4M17 8l4 4-4 4M3 12h18"/></svg>左右滑动切换单词</div>';

  var parts = getWordParts(w.word);
  html += '<div class="flip-c" onclick="toggleFlip(this)">';
  html += '<div class="flip-i">';
  html += '<div class="flip-f">';
  html += '<div class="ff-word">' + esc(w.word) + '</div>';
  html += '<div class="ff-phonetic">点击卡片查看释义</div>';
  html += '<div class="ff-speak" onclick="event.stopPropagation();speakWord(this)" data-word="' + escAttr(w.word) + '">';
  html += '<svg viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4V5zM15.5 8.5a5 5 0 010 7M19 5a9 9 0 010 14"/></svg>';
  html += '</div>';
  if (parts.length > 1) {
    html += '<div class="ff-breakdown" onclick="event.stopPropagation()">';
    html += '<div class="ff-bd-label">单词拆解</div>';
    html += '<div class="ff-bd-parts">';
    parts.forEach(function(p, i) {
      html += '<span class="ff-bd-part" onclick="event.stopPropagation();speakTextStr(\'' + p.replace(/'/g,"\\'") + '\')">' + esc(p) + '</span>';
      if (i < parts.length - 1) html += '<span class="ff-bd-sep">+</span>';
    });
    html += '</div>';
    html += '<button class="ff-bd-speak" onclick="event.stopPropagation();speakParts(\'' + parts.join('|').replace(/'/g,"\\'") + '\')">拆解朗读</button>';
    html += '</div>';
  }
  html += '</div>';
  html += '<div class="flip-b">';
  html += '<div class="fb-trans">' + esc(w.translation||'') + '</div>';
  html += '<div class="fb-word">' + esc(w.word) + '</div>';
  html += '</div>';
  html += '</div></div>';

  if (w.exampleEn || w.exampleCn) {
    html += '<div class="wi"><div class="wi-ex" onclick="speakText(this)" data-text="' + escAttr(w.exampleEn||'') + '">';
    html += '<div class="en">' + makeClickableWords(w.exampleEn||'') + '</div><div class="cn">' + esc(w.exampleCn||'') + '</div>';
    html += '<div class="wi-ex-hint">点击句子朗读</div>';
    html += '</div></div>';
  }

  c.innerHTML = html;
}

function renderDict() {
  const words = curWords;
  const c = document.getElementById('w-content');
  if (wIdx >= words.length) {
    c.innerHTML = '<div class="empty-state"><div class="es-icon">✍️</div><div class="es-title">听写完成！</div></div>';
    return;
  }
  const w = words[wIdx];
  if (!w) { wIdx++; renderWords(); return; }
  let html = '<div class="word-nav"><span class="wn-progress">' + (wIdx+1) + ' / ' + words.length + '</span></div>';
  html += '<div class="listen-card"><div class="lc-big">🔊</div><div class="lc-hint">听发音后拼写单词</div></div>';
  html += '<button class="btn cyan" onclick="speakWord(this)" data-word="' + escAttr(w.word) + '">播放发音</button>';
  html += '<input type="text" class="dict-in" id="dict-in" placeholder="输入单词..." autocomplete="off" autocapitalize="off" spellcheck="false">';
  html += '<div class="dict-hint" id="dict-hint"></div>';
  html += '<div class="btn-row"><button class="btn sec" onclick="checkDict()">检查</button><button class="btn primary" onclick="dictNext()">下一个</button></div>';
  html += '<div style="text-align:center;margin-top:12px"><button class="btn sec sm" onclick="showDictAnswer()">显示答案</button></div>';
  c.innerHTML = html;
  const inp = document.getElementById('dict-in');
  if (inp) {
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') checkDict(); });
    inp.addEventListener('input', () => inp.classList.remove('correct','wrong'));
    setTimeout(() => inp.focus(), 100);
  }
}

function showDictAnswer() {
  const w = curWords[wIdx];
  if (!w) return;
  document.getElementById('dict-hint').innerHTML = '答案: <span style="color:var(--t1);font-weight:700;font-size:16px">' + esc(w.word) + '</span>';

    if (hint.textContent === '') hint.innerHTML = '再试试，注意拼写';

function renderQuiz() {
  const words = curWords;
  const c = document.getElementById('w-content');
  if (!quizState || quizState.round >= 10) {
    const pool = [...words].sort(() => Math.random()-.5);
    const qLen = Math.min(10, pool.length);
    if (qLen === 0) {
      c.innerHTML = '<div class="empty-state">没有足够词汇出题</div>';
      return;
    }
    quizState = { round: 0, score: 0, total: qLen, questions: [] };
    for (let i = 0; i < qLen; i++) {
      const correct = pool[i];
      if (!correct) continue;
      const others = words.filter(w => w && w.word !== correct.word).sort(() => Math.random()-.5).slice(0,3);
      const opts = [...others, correct].sort(() => Math.random()-.5);
      const correctIdx = opts.indexOf(correct);
      quizState.questions.push({ word: correct.word, translation: correct.translation, options: opts.map(o => o.translation), correctIdx });
    }
  }
  if (quizState.round >= quizState.questions.length) {
    const pct = Math.round(quizState.score/quizState.total*100);
    let html = '<div class="empty-state"><div style="font-size:52px;font-weight:900;';
    html += 'background:var(--ga);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text">';
    html += quizState.score + '/' + quizState.total + '</div>';
    html += '<div style="color:var(--t2);margin:8px 0 4px;font-size:14px">答对 ' + quizState.score + ' 题 · 正确率 ' + pct + '%</div>';
    if (pct >= 80) html += '<div style="color:#34D399;font-size:13px;margin-bottom:16px">优秀！继续加油</div>';
    else if (pct >= 60) html += '<div style="color:#FBBF24;font-size:13px;margin-bottom:16px">不错，还可以更好</div>';
    else html += '<div style="color:#FB923C;font-size:13px;margin-bottom:16px">需要多加练习</div>';
    html += '<button class="btn primary" onclick="quizState=null;renderWords()">再来一轮</button></div>';
    c.innerHTML = html;
    return;
  }
  const q = quizState.questions[quizState.round];
  if (!q) { quizState.round++; renderWords(); return; }
  let html = '<div class="word-nav"><span class="wn-progress">第 ' + (quizState.round+1) + ' / ' + quizState.total + ' 题 · 得分 ' + quizState.score + '</span></div>';
  html += '<div class="pbar" style="margin-bottom:14px"><div class="pbar-fill" style="width:' + (quizState.round/quizState.total*100) + '%"></div></div>';
  html += '<div style="text-align:center;padding:24px 20px;';
  html += 'background:linear-gradient(135deg,rgba(139,92,246,.06) 0%,rgba(6,182,212,.03) 100%);';
  html += 'border:1px solid rgba(139,92,246,.1);border-radius:var(--r);margin-bottom:14px">';
  html += '<div style="font-size:26px;font-weight:800;color:var(--t1)">' + esc(q.word) + '</div>';
  html += '<div style="font-size:13px;color:var(--t3);margin-top:4px">选择正确的中文释义</div></div>';
  q.options.forEach((opt, i) => {
    html += '<div class="qo" data-idx="' + i + '" onclick="answerQuiz(this,' + i + ',' + q.correctIdx + ')">' + esc(opt||'') + '</div>';
  });
  c.innerHTML = html;
}

function answerQuiz(el, picked, correct) {
  document.querySelectorAll('.qo').forEach(o => o.disabled = true);
  if (picked === correct) { el.classList.add('correct'); quizState.score++; }
  else { el.classList.add('wrong'); document.querySelectorAll('.qo')[correct].classList.add('correct'); }
  setTimeout(() => { quizState.round++; renderWords(); }, 800);
}

// ===== V8: Clickable words + lookup =====
function makeClickableWords(text) {
  if (!text) return '';
  // Split into words and punctuation, wrap each English word in a clickable span
  return text.replace(/([a-zA-Z'\-]+)/g, function(match) {
    return '<span class="wl-word" onclick="event.stopPropagation();lookupWord(\'' + match.replace(/'/g, "\\'") + '\',this)">' + match + '</span>';
  });
}

function lookupWord(word, el) {
  // Remove previous highlight
  document.querySelectorAll('.wl-word.lookuped').forEach(w => w.classList.remove('lookuped'));
  el.classList.add('lookuped');

  // Search in today's vocabulary
  const allWords = [];
  if (curDay) {
    (curDay.newWords || []).forEach(w => { if (w) allWords.push(w); });
    (curDay.reviewWords || []).forEach(w => { if (w) allWords.push(w); });
  }

  // Also search all days for comprehensive lookup
  if (!allWords.length) {
    DATA.forEach(d => {
      if (!d) return;
      (d.newWords || []).forEach(w => { if (w) allWords.push(w); });
      (d.reviewWords || []).forEach(w => { if (w) allWords.push(w); });
    });
  }

  const found = allWords.find(w => w.word && w.word.toLowerCase() === word.toLowerCase());

  const tip = document.getElementById('wl-tip');
  let html = '<div class="wl-tip-word">' + esc(word) + '</div>';

  if (found) {
    html += '<div class="wl-tip-trans">' + esc(found.translation || '') + '</div>';
    if (found.exampleEn) {
      html += '<div class="wl-tip-example"><div class="en">' + esc(found.exampleEn) + '</div>';
      if (found.exampleCn) html += '<div class="cn">' + esc(found.exampleCn) + '</div>';
      html += '</div>';
    }
    html += '<div class="wl-tip-actions"><button class="wl-tip-btn" onclick="speakSingleWord(\'' + word.replace(/'/g, "\\'") + '\')">🔊 朗读</button></div>';
  } else {
    var basicTrans = lookupBasicWord(word);
    if (basicTrans) {
      html += '<div class="wl-tip-trans">' + esc(basicTrans) + '</div>';
    } else {
      html += '<div class="wl-tip-notfound">暂无释义</div>';
    }
    html += '<div class="wl-tip-actions"><button class="wl-tip-btn" onclick="speakSingleWord(\'' + word.replace(/'/g, "\\'") + '\')">🔊 朗读</button></div>';
  }

  tip.innerHTML = html;

  // Position near the clicked word
  const rect = el.getBoundingClientRect();
  let left = rect.left;
  let top = rect.bottom + 8;

  // Keep within viewport
  const tipW = 240;
  if (left + tipW > window.innerWidth) left = window.innerWidth - tipW - 16;
  if (left < 8) left = 8;
  if (top + 200 > window.innerHeight) top = rect.top - 8;

  tip.style.left = left + 'px';
  tip.style.top = top + 'px';
  tip.style.display = 'block';
}

function speakSingleWord(word) {
  speak(word);
}

});

// ===== UTILS =====
function toggleFlip(el) { el.classList.toggle('flipped'); }
function speakWord(el) { speak(el.dataset.word); }
function escAttr(s) { if (!s) return ''; return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function getWordParts(word) {
  if (!word) return [];
  var w = word.trim();
  if (w.indexOf(' ') > -1) return w.split(/\s+/).filter(function(p){return p.length>0;});
  if (w.indexOf('-') > -1) return w.split('-').filter(function(p){return p.length>0;});
  if (w.indexOf('/') > -1) return w.split('/').filter(function(p){return p.length>0;});
  return [w];
}

function speakParts(partsStr) {
  var parts = partsStr.split('|').filter(function(p){return p.length>0;});
  if (!parts.length || !window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  var i = 0;
  function next() {
    if (i >= parts.length) return;
    var u = new SpeechSynthesisUtterance(parts[i]);
    u.lang = 'en-US'; u.rate = 0.8; u.pitch = 1;
    u.onend = function() { i++; setTimeout(next, 300); };
    window.speechSynthesis.speak(u);
  }
  next();
}

function speakTextStr(text) { speak(text); }
function speakText(el) {
  if (!window.speechSynthesis) return;
  var e = window.event || {};
  if (e.target && e.target.classList && e.target.classList.contains('wl-word')) return;
  speak(el.dataset.text);
}

function lookupBasicWord(word) {
  if (!word) return null;
  var w = word.toLowerCase().replace(/[^a-z']/g, '');
  if (BASIC_DICT[w]) return BASIC_DICT[w];
  var singular = w.replace(/s$/, '');
  if (BASIC_DICT[singular]) return BASIC_DICT[singular];
  var past = w.replace(/ed$/, '');
  if (BASIC_DICT[past]) return BASIC_DICT[past];
  var ing = w.replace(/ing$/, '');
  if (BASIC_DICT[ing]) return BASIC_DICT[ing];
  return null;
}

function speak(text) {
  if (!text || !window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US'; u.rate = 0.85; u.pitch = 1;
  window.speechSynthesis.speak(u);
}

function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ===== PWA / Service Worker =====
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    const swCode = [
      "const CACHE = 'te-v8';",
      "const ASSETS = ['./'];",
      "self.addEventListener('install', e => {",
      "  e.waitUntil(caches.open(CACHE).then(c => c.addAll(ASSETS)).then(() => self.skipWaiting()));",
      "});",
      "self.addEventListener('activate', e => {",
      "  e.waitUntil(caches.keys().then(keys => Promise.all(keys.filter(k => k !== CACHE).map(k => caches.delete(k)))).then(() => self.clients.claim()));",
      "});",
      "self.addEventListener('fetch', e => {",
      "  e.respondWith(",
      "    caches.match(e.request).then(r => r || fetch(e.request).then(response => {",
      "      if (response && response.status === 200 && e.request.method === 'GET') {",
      "        const rc = response.clone();",
      "        caches.open(CACHE).then(c => c.put(e.request, rc));",
      "      }",
      "      return response;",
      "    }).catch(() => caches.match('./')))",
      "  );",
      "});"
    ].join('\n');
    try {
      const blob = new Blob([swCode], { type: 'application/javascript' });
      const swUrl = URL.createObjectURL(blob);
    } catch(e) {}
  });
}
