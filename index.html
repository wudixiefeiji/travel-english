<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#07090F">
<meta name="apple-mobile-web-app-title" content="谢飞机">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v8">
<link rel="apple-touch-icon" sizes="120x120" href="apple-touch-icon.png?v8">
<link rel="apple-touch-icon" sizes="152x152" href="apple-touch-icon.png?v8">
<link rel="apple-touch-icon" sizes="167x167" href="apple-touch-icon.png?v8">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v8">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png?v8">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v8">
<link rel="manifest" href="manifest.json">
<meta name="version" content="te_v16">
<title>谢飞机</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior-y:contain}
html,body{height:100dvh}
@supports not (height:100dvh){html,body{height:100vh}}
body{background:#07090F;color:#E8EDF5;font-family:'Plus Jakarta Sans','Inter',-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;letter-spacing:-.1px}
button{font-family:inherit;cursor:pointer;border:none;outline:none;color:inherit;font-weight:700}
input,textarea{font-family:inherit}
:root{
  --nav-h:68px;--sb:env(safe-area-inset-bottom,8px);--st:max(env(safe-area-inset-top,0px),44px);
  --r:20px;--rs:14px;--rp:999px;
  --purp:#8B5CF6;--purp2:#A78BFA;--cyan:#06B6D4;--cyan2:#22D3EE;--blue:#3B82F6;
  --grn:#10B981;--red:#EF4444;--org:#F97316;--ylw:#FBBF24;
  --t1:#F1F5F9;--t2:#94A3B8;--t3:#64748B;--t4:#475569;
  --bg:#07090F;--bg2:#0C1018;
  --glow-p:0 0 30px rgba(139,92,246,.3);
  --glow-c:0 0 30px rgba(6,182,212,.3);
  --ga:linear-gradient(135deg,#A78BFA 0%,#60A5FA 50%,#22D3EE 100%);
  --gb:linear-gradient(135deg,#6366F1 0%,#3B82F6 100%);
  --gc:linear-gradient(135deg,#22D3EE 0%,#06B6D4 100%);
  --gd:linear-gradient(135deg,#10B981 0%,#059669 100%);
  --go:linear-gradient(135deg,#F97316 0%,#EA580C 100%);
  --gy:linear-gradient(135deg,#FBBF24 0%,#F59E0B 100%);
}

#app{width:100%;height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;position:fixed;top:0;left:50%;transform:translateX(-50%);overflow:hidden;
  background:
    radial-gradient(ellipse 90% 45% at 50% -5%,rgba(139,92,246,.12) 0%,transparent 60%),
    radial-gradient(ellipse 60% 35% at 90% 20%,rgba(6,182,212,.06) 0%,transparent 50%),
    radial-gradient(ellipse 50% 30% at 10% 60%,rgba(59,130,246,.05) 0%,transparent 50%),
    #07090F;
}
@supports (height:100dvh){#app{height:100dvh}}
#app::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(139,92,246,.2),rgba(6,182,212,.2),transparent);
  pointer-events:none}

/* V15: Fixed scroll - nav is flex child, not position:fixed overlay */
.page{display:none;flex:1;overflow-y:auto;overflow-x:hidden;
  padding:calc(var(--st)+12px) 20px calc(var(--sb)+20px);
  overscroll-behavior-y:contain;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.page.active{display:block;animation:fadeIn .3s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes scaleIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
@keyframes slideRight{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:translateX(0)}}
@keyframes slideLeft{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:translateX(0)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
@keyframes wordPop{0%{opacity:0;transform:translateY(4px)}100%{opacity:1;transform:none}}

.page::-webkit-scrollbar{width:0}

/* Nav - Glassmorphism - V15: flex child instead of position:fixed */
.nav{flex-shrink:0;width:100%;max-width:480px;
  height:calc(var(--nav-h)+var(--sb));
  background:rgba(7,9,15,.92);
  backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);
  border-top:1px solid rgba(255,255,255,.06);
  display:flex;align-items:flex-start;justify-content:space-around;
  padding:10px 0 var(--sb);z-index:100;position:relative}
.nav::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:60%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(139,92,246,.3),rgba(6,182,212,.3),transparent)}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 28px;border-radius:14px;
  background:none;transition:all .2s;position:relative;min-width:72px}
.nav-btn:active{transform:scale(.92)}
.nav-btn svg{width:24px;height:24px;stroke:var(--t3);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
  transition:all .2s}
.nav-btn.active svg{stroke:url(#navGrad);filter:drop-shadow(0 0 8px rgba(96,165,250,.5))}
.nav-btn span{font-size:11px;font-weight:600;color:var(--t3);transition:all .2s}
.nav-btn.active span{color:#60A5FA;font-weight:700}

/* ===== HOME ===== */
/* V9: removed top title text, adjusted spacing */
.home-top{padding:calc(var(--st)+8px) 0 4px;display:flex;align-items:center;justify-content:space-between;margin-bottom:0}
.home-title .ht-main{font-size:26px;font-weight:800;
  background:linear-gradient(135deg,#E8EDF5 0%,#94A3B8 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-.5px}
.home-title .ht-sub{font-size:14px;color:#94A3B8;margin-top:2px;font-weight:500}



/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.show{display:flex}
.modal{background:#0F1219;border:1px solid rgba(255,255,255,.08);border-radius:var(--r);
  width:100%;max-width:420px;padding:24px;animation:scaleIn .25s ease}
.modal-title{font-size:18px;font-weight:800;color:var(--t1);margin-bottom:16px}
.modal-close{position:absolute;top:16px;right:16px;width:32px;height:32px;border-radius:10px;
  background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center;cursor:pointer}
.modal-close svg{width:16px;height:16px;stroke:var(--t3);fill:none;stroke-width:2.5}
.modal-label{font-size:13px;font-weight:600;color:var(--t2);margin-bottom:8px}
.modal-input{width:100%;background:rgba(0,0,0,.25);border:1.5px solid rgba(255,255,255,.08);
  border-radius:var(--rs);padding:14px 16px;color:var(--t1);font-size:14px;margin-bottom:12px;
  transition:border-color .2s}
.modal-input:focus{border-color:#60A5FA;outline:none}
.modal-textarea{width:100%;min-height:120px;background:rgba(0,0,0,.25);border:1.5px solid rgba(255,255,255,.08);
  border-radius:var(--rs);padding:14px 16px;color:var(--t1);font-size:13px;margin-bottom:12px;resize:vertical;
  font-family:'Plus Jakarta Sans',monospace;line-height:1.5;transition:border-color .2s}
.modal-textarea:focus{border-color:#60A5FA;outline:none}
.modal-hint{font-size:12px;color:var(--t3);margin-bottom:12px;line-height:1.5}
.modal-divider{text-align:center;color:var(--t4);font-size:12px;margin:16px 0;position:relative}
.modal-divider::before,.modal-divider::after{content:'';position:absolute;top:50%;width:calc(50% - 30px);height:1px;background:rgba(255,255,255,.06)}
.modal-divider::before{left:0}
.modal-divider::after{right:0}
.modal-actions{display:flex;gap:10px;margin-top:8px}
.modal-actions .btn{flex:1}

/* Hero Card */
.hero-card{background:linear-gradient(135deg,rgba(139,92,246,.12) 0%,rgba(6,182,212,.06) 100%);
  border:1px solid rgba(139,92,246,.15);border-radius:var(--r);padding:16px;margin-bottom:14px;position:relative;overflow:hidden}
.hero-card::before{content:'';position:absolute;top:-50%;right:-20%;width:180px;height:180px;border-radius:50%;
  background:radial-gradient(circle,rgba(139,92,246,.15) 0%,transparent 70%);pointer-events:none}
.hero-card::after{content:'';position:absolute;bottom:-30%;left:-10%;width:140px;height:140px;border-radius:50%;
  background:radial-gradient(circle,rgba(6,182,212,.1) 0%,transparent 70%);pointer-events:none}
.hero-top{display:flex;align-items:flex-end;justify-content:space-between;position:relative;z-index:1}
.hero-num{font-size:32px;font-weight:900;line-height:1;
  background:var(--ga);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  letter-spacing:-2px}
.hero-num small{font-size:14px;-webkit-text-fill-color:var(--t2);font-weight:600;letter-spacing:0}
.hero-label{font-size:12px;color:var(--t2);margin-top:2px;font-weight:500}
.hero-pct{font-size:24px;font-weight:800;color:#60A5FA}
.hero-pct span{font-size:14px;color:var(--t3);font-weight:600}
.hero-bar{margin-top:12px;height:6px;background:rgba(255,255,255,.05);border-radius:var(--rp);overflow:hidden;
  border:1px solid rgba(255,255,255,.05);position:relative;z-index:1}
.hero-bar-fill{height:100%;background:var(--ga);border-radius:var(--rp);
  box-shadow:0 0 20px rgba(96,165,250,.4);transition:width .8s cubic-bezier(.4,0,.2,1);position:relative}
.hero-bar-fill::after{content:'';position:absolute;top:0;left:0;right:0;bottom:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);
  background-size:50% 100%;animation:shimmer 2s infinite}

/* V8: Stats quick - label from 11px to 12px, gap 12px */
.stats-quick{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:18px}
.sq-item{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.05);border-radius:var(--rs);
  padding:16px 10px;text-align:center;transition:all .2s}
.sq-item:active{transform:scale(.96)}
.sq-num{font-size:22px;font-weight:800;color:var(--t1)}
.sq-label{font-size:12px;color:var(--t3);margin-top:3px;font-weight:600}

/* Section */
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;padding:0 2px}
.section-title{font-size:15px;font-weight:700;color:var(--t2);display:flex;align-items:center;gap:8px}
.section-title::before{content:'';width:3px;height:16px;border-radius:2px;background:var(--ga)}

/* ===== V8: Phase Card List (replaces calendar grid) ===== */
.phase-group{margin-bottom:20px}
.phase-label{font-size:12px;font-weight:800;color:var(--t2);letter-spacing:1.5px;text-transform:uppercase;
  padding:8px 14px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);
  border-radius:var(--rp);display:inline-block;margin-bottom:12px}
.phase-card-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.day-card{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.05);border-radius:var(--rs);
  padding:16px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden;display:flex;gap:12px;align-items:flex-start}
.day-card:active{transform:scale(.97);background:rgba(255,255,255,.04)}
.day-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(139,92,246,.15),transparent);opacity:0;transition:opacity .2s}
.day-card:active::before{opacity:1}
.dc-num{font-size:28px;font-weight:900;line-height:1;min-width:36px;text-align:center;flex-shrink:0;
  background:var(--ga);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.dc-info{flex:1;min-width:0}
.dc-title{font-size:13px;font-weight:700;color:var(--t1);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dc-sub{font-size:11px;color:var(--t3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dc-tags{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.dc-tag{font-size:10px;font-weight:700;padding:3px 8px;border-radius:var(--rp);
  background:rgba(255,255,255,.04);color:var(--t3)}
.dc-tag.purp{background:rgba(139,92,246,.1);color:#A78BFA}
.dc-tag.cyan{background:rgba(6,182,212,.1);color:#22D3EE}
.dc-done-mark{position:absolute;top:10px;right:10px;width:20px;height:20px;border-radius:50%;
  background:rgba(16,185,129,.15);border:1.5px solid #10B981;display:flex;align-items:center;justify-content:center}
.dc-done-mark svg{width:12px;height:12px;stroke:#34D399;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}

/* ===== STATS ===== */
.stats-filter{display:flex;gap:8px;margin-bottom:16px}
.stats-filter-btn{flex:1;padding:10px 12px;border-radius:var(--rs);border:1px solid rgba(255,255,255,.06);
  background:rgba(255,255,255,.02);color:var(--t3);font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;text-align:center}
.stats-filter-btn.active{background:linear-gradient(135deg,rgba(139,92,246,.18) 0%,rgba(6,182,212,.10) 100%);
  border-color:rgba(139,92,246,.3);color:var(--t1)}
.stats-hero{background:linear-gradient(135deg,rgba(139,92,246,.14) 0%,rgba(6,182,212,.06) 100%);
  border:1px solid rgba(139,92,246,.16);border-radius:var(--r);padding:24px 20px;text-align:center;
  margin-bottom:18px;position:relative;overflow:hidden}
.stats-hero::before{content:'';position:absolute;top:-40%;left:50%;transform:translateX(-50%);
  width:240px;height:240px;border-radius:50%;
  background:radial-gradient(circle,rgba(139,92,246,.15) 0%,transparent 70%)}
.sh-num{font-size:56px;font-weight:900;line-height:1;
  background:var(--ga);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  letter-spacing:-2px;position:relative;z-index:1}
.sh-label{font-size:14px;color:var(--t2);margin-top:6px;position:relative;z-index:1;font-weight:500}
.sh-progress{height:8px;background:rgba(255,255,255,.05);border-radius:var(--rp);
  margin:18px auto 0;max-width:280px;overflow:hidden;border:1px solid rgba(255,255,255,.05);position:relative;z-index:1}
.sh-progress-fill{height:100%;background:var(--ga);border-radius:var(--rp);
  box-shadow:0 0 20px rgba(96,165,250,.4);transition:width .8s cubic-bezier(.4,0,.2,1)}

/* V8: Stats grid gap 12px, card padding 18px */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
.stat-card{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.05);border-radius:var(--rs);
  padding:18px;display:flex;align-items:center;gap:14px;transition:all .2s;position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;border-radius:0 3px 3px 0}
.stat-card.purple::before{background:var(--purp2)}
.stat-card.cyan::before{background:var(--cyan2)}
.stat-card.green::before{background:#34D399}
.stat-card.orange::before{background:#FB923C}

/* V8: SVG icon containers with glow */
.sc-icon{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;position:relative}
.sc-icon svg{width:28px;height:28px}
.stat-card.purple .sc-icon{background:rgba(139,92,246,.12);
  box-shadow:0 0 16px rgba(139,92,246,.15)}
.stat-card.cyan .sc-icon{background:rgba(6,182,212,.12);
  box-shadow:0 0 16px rgba(6,182,212,.15)}
.stat-card.orange .sc-icon{background:rgba(249,115,22,.12);
  box-shadow:0 0 16px rgba(249,115,22,.15)}
.stat-card.green .sc-icon{background:rgba(16,185,129,.12);
  box-shadow:0 0 16px rgba(16,185,129,.15)}
.sc-num{font-size:22px;font-weight:800;color:var(--t1);letter-spacing:-.5px}
.sc-label{font-size:12px;color:var(--t3);font-weight:600;margin-top:2px}

/* V8: Stats section padding 18px, margin 14px */
.stats-section{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.05);
  border-radius:var(--rs);padding:18px;margin-bottom:14px}
.stats-section-title{font-size:15px;font-weight:700;color:var(--t1);margin-bottom:14px;
  display:flex;align-items:center;gap:8px}
.stats-section-title::before{content:'';width:3px;height:16px;border-radius:2px;background:var(--ga)}
.phase-item{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.phase-item:last-child{margin-bottom:0}
.phase-name{font-size:13px;font-weight:600;color:var(--t2);width:80px;flex-shrink:0}
.phase-bar{flex:1;height:6px;background:rgba(255,255,255,.05);border-radius:var(--rp);overflow:hidden}
.phase-bar-fill{height:100%;background:var(--ga);border-radius:var(--rp);transition:width .6s}
.phase-count{font-size:12px;font-weight:700;color:var(--t3);width:44px;text-align:right}

.recent-item{display:flex;align-items:center;gap:12px;padding:10px 0;
  border-bottom:1px solid rgba(255,255,255,.03)}
.recent-item:last-child{border-bottom:none;padding-bottom:0}
.recent-item:first-child{padding-top:0}
.ri-day{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:800;flex-shrink:0}
.ri-day.done{background:rgba(16,185,129,.1);color:#34D399}
.ri-day.pending{background:rgba(255,255,255,.03);color:var(--t3)}
.ri-title{flex:1;font-size:14px;font-weight:600;color:var(--t1);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.ri-status{font-size:12px;font-weight:700;color:var(--t3);flex-shrink:0}
.ri-status.done{color:#34D399}

.total-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.total-item{background:rgba(0,0,0,.15);border-radius:12px;padding:14px;text-align:center}
.total-num{font-size:22px;font-weight:800;color:var(--t1)}
.total-label{font-size:12px;color:var(--t3);margin-top:3px;font-weight:600}

/* ===== DAY DETAIL ===== */
.topbar{display:flex;align-items:center;gap:10px;padding:2px 0 14px;
  position:sticky;top:0;z-index:10;background:linear-gradient(180deg,#07090F 70%,transparent);
  padding-top:calc(var(--st)+8px)}
.back-btn{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.04);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;
  transition:all .15s;border:1px solid rgba(255,255,255,.05)}
.back-btn:active{transform:scale(.9);background:rgba(255,255,255,.08)}
.back-btn svg{width:18px;height:18px;stroke:var(--t2);fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.ptitle{font-size:17px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--t1)}
.pbadge{font-size:11px;font-weight:700;padding:5px 14px;border-radius:var(--rp);flex-shrink:0}
.pbadge.done{background:rgba(16,185,129,.1);color:#34D399;border:1px solid rgba(16,185,129,.15)}
.pbadge.pending{background:rgba(255,255,255,.04);color:var(--t3);border:1px solid rgba(255,255,255,.05)}

.dd-hero{background:linear-gradient(135deg,rgba(139,92,246,.12) 0%,rgba(6,182,212,.05) 100%);
  border:1px solid rgba(139,92,246,.14);border-radius:var(--r);padding:20px;margin-bottom:16px;position:relative;overflow:hidden}
.dd-hero::before{content:'';position:absolute;top:-40%;right:-10%;width:160px;height:160px;border-radius:50%;
  background:radial-gradient(circle,rgba(139,92,246,.15) 0%,transparent 70%)}
.dd-day{font-size:14px;font-weight:700;color:#60A5FA;margin-bottom:2px;position:relative;z-index:1}
.dd-title{font-size:22px;font-weight:800;color:var(--t1);letter-spacing:-.5px;position:relative;z-index:1}
.dd-sub{font-size:14px;color:var(--t3);margin-top:3px;position:relative;z-index:1}
.dd-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px;position:relative;z-index:1}
.dd-tag{font-size:11px;font-weight:700;padding:5px 12px;border-radius:var(--rp);
  background:rgba(255,255,255,.05);color:var(--t3);border:1px solid rgba(255,255,255,.05)}
.dd-tag.purp{background:rgba(139,92,246,.1);color:#A78BFA;border-color:rgba(139,92,246,.15)}
.dd-tag.cyan{background:rgba(6,182,212,.1);color:#22D3EE;border-color:rgba(6,182,212,.15)}
.dd-tag.org{background:rgba(249,115,22,.1);color:#FB923C;border-color:rgba(249,115,22,.15)}
.dd-tag.ylw{background:rgba(251,191,36,.1);color:#FBBF24;border-color:rgba(251,191,36,.15)}

/* Module cards */
.mc{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.05);border-radius:var(--rs);
  padding:18px;margin-bottom:12px;cursor:pointer;transition:all .2s;
  display:flex;align-items:center;gap:14px;position:relative;overflow:hidden}
.mc:active{transform:scale(.98);background:rgba(255,255,255,.04)}
.mc::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:0 3px 3px 0;opacity:0;transition:opacity .2s}
.mc:active::before{opacity:1}
.mc-icon{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;
  font-size:20px;flex-shrink:0}
.mc-icon.words{background:linear-gradient(135deg,rgba(139,92,246,.15),rgba(139,92,246,.05))}
.mc-icon.review{background:linear-gradient(135deg,rgba(6,182,212,.15),rgba(6,182,212,.05))}
.mc-icon.dialog{background:linear-gradient(135deg,rgba(249,115,22,.15),rgba(249,115,22,.05))}
.mc-icon.essay{background:linear-gradient(135deg,rgba(251,191,36,.15),rgba(251,191,36,.05))}
.mc-body{flex:1;min-width:0}
.mc-title{font-size:15px;font-weight:700;color:var(--t1)}
.mc-desc{font-size:12px;color:var(--t3);margin-top:2px}
.mc-arrow{color:var(--t3);font-size:14px;flex-shrink:0}

/* Action buttons */
.action-row{display:flex;gap:10px;margin-top:4px}
.btn{border-radius:var(--rs);padding:16px 20px;font-size:15px;font-weight:700;width:100%;
  letter-spacing:.2px;transition:all .15s;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  position:relative;overflow:hidden}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--ga);color:#fff;box-shadow:0 4px 20px rgba(96,165,250,.25)}
.btn.primary::after{content:'';position:absolute;top:0;left:0;right:0;bottom:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.2),transparent);
  background-size:50% 100%;animation:shimmer 3s infinite}
.btn.sec{background:rgba(255,255,255,.04);color:var(--t1);border:1px solid rgba(255,255,255,.08)}
.btn.sec:active{background:rgba(255,255,255,.06)}
.btn.green{background:var(--gd);color:#fff;box-shadow:0 4px 20px rgba(16,185,129,.25)}
.btn.cyan{background:var(--gc);color:#fff;box-shadow:0 4px 20px rgba(6,182,212,.25)}
.btn.orange{background:var(--go);color:#fff;box-shadow:0 4px 20px rgba(249,115,22,.25)}
.btn.sm{padding:10px 16px;font-size:13px;width:auto}
.btn-row{display:flex;gap:10px;margin-top:14px}
.btn-row .btn{flex:1}

/* ===== WORDS ===== */
.wc-mode{display:flex;gap:6px;margin-bottom:16px;
  background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05);border-radius:var(--rs);padding:4px}
.wc-mode button{flex:1;padding:10px 0;border-radius:10px;font-size:13px;font-weight:700;
  background:none;border:none;transition:all .2s;color:var(--t3)}
.wc-mode button.active{background:rgba(255,255,255,.06);color:var(--t1);
  box-shadow:0 2px 8px rgba(0,0,0,.2)}

.word-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:8px}
.word-nav .wn-progress{font-size:13px;color:var(--t3);font-weight:600}

/* Flip card */
.flip-c{perspective:1200px;cursor:pointer;margin-bottom:14px}
.flip-i{position:relative;width:100%;min-height:180px;
  transition:transform .6s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d}
.flip-c.flipped .flip-i{transform:rotateY(180deg)}
.flip-f,.flip-b{position:absolute;top:0;left:0;right:0;backface-visibility:hidden;
  border-radius:var(--r);padding:28px 20px;border:1px solid rgba(255,255,255,.06);
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  min-height:180px}
.flip-f{background:linear-gradient(135deg,rgba(139,92,246,.08) 0%,rgba(6,182,212,.04) 100%);
  border-color:rgba(139,92,246,.12);z-index:2;position:relative;overflow:hidden}
.flip-f::before{content:'';position:absolute;top:-30%;left:50%;transform:translateX(-50%);
  width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(139,92,246,.1) 0%,transparent 70%)}
.flip-f .ff-word{font-size:28px;font-weight:800;color:var(--t1);letter-spacing:-.5px;position:relative;z-index:1}
.flip-f .ff-phonetic{font-size:13px;color:var(--t3);margin-top:4px;position:relative;z-index:1;font-weight:500}
.flip-f .ff-hint{font-size:12px;color:var(--t4);margin-top:16px;position:relative;z-index:1}
.flip-f .ff-speak{width:48px;height:48px;border-radius:50%;background:rgba(139,92,246,.15);
  display:flex;align-items:center;justify-content:center;margin-top:16px;cursor:pointer;
  transition:all .15s;position:relative;z-index:1}
.flip-f .ff-speak:active{transform:scale(.9)}
.flip-f .ff-speak svg{width:20px;height:20px;stroke:#A78BFA;fill:none;stroke-width:2.5}
.ff-breakdown{margin-top:14px;position:relative;z-index:1;width:100%;max-width:280px}
.ff-bd-label{font-size:11px;color:var(--t4);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;text-align:center}
.ff-bd-parts{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px}
.ff-bd-part{padding:4px 10px;border-radius:var(--rp);background:rgba(139,92,246,.1);border:1px solid rgba(139,92,246,.15);
  font-size:13px;font-weight:600;color:#A78BFA;cursor:pointer;transition:all .15s}
.ff-bd-part:active{transform:scale(.92);background:rgba(139,92,246,.2)}
.ff-bd-sep{font-size:12px;color:var(--t4);font-weight:700}
.ff-bd-speak{display:block;margin:10px auto 0;padding:6px 16px;border-radius:var(--rp);
  background:linear-gradient(135deg,rgba(139,92,246,.15),rgba(6,182,212,.1));border:1px solid rgba(139,92,246,.2);
  font-size:12px;font-weight:700;color:#A78BFA;cursor:pointer;transition:all .15s}
.ff-bd-speak:active{transform:scale(.95)}
.flip-b{background:linear-gradient(135deg,rgba(6,182,212,.08) 0%,rgba(59,130,246,.04) 100%);
  border-color:rgba(6,182,212,.12);transform:rotateY(180deg);overflow:hidden}
.flip-b::before{content:'';position:absolute;top:-30%;left:50%;transform:translateX(-50%);
  width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(6,182,212,.1) 0%,transparent 70%)}
.flip-b .fb-trans{font-size:24px;font-weight:800;color:#22D3EE;position:relative;z-index:1}
.flip-b .fb-word{font-size:16px;color:var(--t2);margin-top:4px;position:relative;z-index:1;font-weight:500}

/* Word detail */
.wi{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.05);
  border-radius:var(--rs);padding:18px;margin-bottom:12px}
.wi-ex{padding:14px;background:rgba(0,0,0,.15);border-radius:10px;border-left:3px solid #60A5FA;font-size:13px;line-height:1.6}
.wi-ex .en{color:var(--t1);font-weight:500}
.wi-ex .cn{color:var(--t3);margin-top:3px;font-size:12px}
.wi-ex-hint{font-size:10px;color:var(--t4);margin-top:6px;text-align:right;opacity:.7}
.wi-ex{cursor:pointer;transition:background .15s}
.wi-ex:active{background:rgba(96,165,250,.08)}

/* Dictation */
.listen-card{text-align:center;padding:28px 20px;
  background:linear-gradient(135deg,rgba(139,92,246,.06) 0%,rgba(6,182,212,.03) 100%);
  border:1px solid rgba(139,92,246,.1);border-radius:var(--r);margin-bottom:14px}
.listen-card .lc-big{font-size:40px;margin-bottom:8px}
.listen-card .lc-hint{font-size:13px;color:var(--t3)}
.dict-in{width:100%;background:rgba(0,0,0,.2);border:2px solid rgba(255,255,255,.06);
  border-radius:var(--rs);padding:16px;color:var(--t1);font-size:20px;font-weight:700;
  text-align:center;letter-spacing:2px;margin:14px 0;transition:border-color .2s;
  font-family:'Plus Jakarta Sans',monospace}
.dict-in:focus{border-color:#60A5FA;outline:none}
.dict-in.correct{border-color:#10B981;background:rgba(16,185,129,.04)}
.dict-in.wrong{border-color:#EF4444;background:rgba(239,68,68,.04)}
.dict-hint{font-size:13px;color:var(--t3);text-align:center;margin:6px 0;min-height:20px;font-weight:500}

/* Quiz */
.qo{background:rgba(255,255,255,.02);border:2px solid rgba(255,255,255,.05);
  border-radius:var(--rs);padding:14px;margin-bottom:8px;font-size:14px;font-weight:600;
  cursor:pointer;transition:all .15s;text-align:center;color:var(--t1)}
.qo:active{background:rgba(255,255,255,.04);transform:scale(.98)}
.qo.correct{border-color:#10B981;background:rgba(16,185,129,.06);color:#34D399}
.qo.wrong{border-color:#EF4444;background:rgba(239,68,68,.06);color:#F87171}
.qo:disabled{cursor:default;opacity:.7}

.pbar{background:rgba(255,255,255,.04);border-radius:var(--rp);height:6px;overflow:hidden;
  border:1px solid rgba(255,255,255,.04)}
.pbar-fill{background:var(--ga);height:100%;border-radius:var(--rp);transition:width .5s cubic-bezier(.4,0,.2,1)}

/* Dialog */
.dl-scene{background:rgba(0,0,0,.12);border-radius:var(--rs);padding:16px;margin-bottom:16px;
  font-size:13px;color:var(--t2);text-align:center;border-left:3px solid #FB923C;line-height:1.6;
  font-weight:500}
.dl-line{display:flex;gap:12px;margin-bottom:14px;align-items:flex-start}
.dl-role{width:58px;padding:6px 0;border-radius:var(--rp);display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:700;flex-shrink:0;margin-top:1px;text-transform:uppercase}
.dl-role.you{background:rgba(139,92,246,.12);color:#A78BFA}
.dl-role.other{background:rgba(6,182,212,.12);color:#22D3EE}
.dl-text{flex:1;font-size:14px;line-height:1.55;color:var(--t1);cursor:pointer;
  padding:12px 14px;border-radius:10px;background:rgba(255,255,255,.015);transition:all .1s}
.dl-text:active{background:rgba(255,255,255,.04)}
.dl-text .cn{font-size:12px;color:var(--t3);margin-top:3px}

/* Essay */
.essay-card{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.05);
  border-radius:var(--r);padding:20px;margin-bottom:16px}
.es-title{font-size:18px;font-weight:800;margin-bottom:3px;
  background:var(--ga);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.es-title-cn{font-size:13px;color:var(--t3);margin-bottom:16px}
.es-item{padding:12px 14px;margin-bottom:8px;background:rgba(0,0,0,.12);border-radius:10px;
  font-size:14px;line-height:1.55;cursor:pointer;transition:all .15s;border-left:3px solid transparent}
.es-item:active{background:rgba(0,0,0,.2)}
.es-item.active{border-left-color:#22D3EE;background:rgba(6,182,212,.06)}
.es-item .en{color:var(--t1)}
.es-item .cn{font-size:12px;color:var(--t3);margin-top:3px}

/* ===== V8: Word Lookup Tooltip ===== */
.wl-word{cursor:pointer;border-radius:4px;transition:background .15s;padding:1px 2px;margin:-1px -2px}
.wl-word:active{background:rgba(139,92,246,.15)}
.wl-word.lookuped{background:rgba(139,92,246,.12)}
.wl-tip{position:fixed;z-index:300;background:rgba(15,23,42,.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:16px 18px;min-width:200px;max-width:280px;
  box-shadow:0 12px 40px rgba(0,0,0,.5);animation:scaleIn .2s ease;pointer-events:auto}
.wl-tip-word{font-size:18px;font-weight:800;color:var(--t1);margin-bottom:2px}
.wl-tip-trans{font-size:14px;font-weight:600;color:#22D3EE;margin-bottom:8px}
.wl-tip-example{font-size:12px;color:var(--t3);line-height:1.5;border-top:1px solid rgba(255,255,255,.06);
  padding-top:8px}
.wl-tip-example .en{color:var(--t2)}
.wl-tip-example .cn{color:var(--t3);font-size:11px;margin-top:2px}
.wl-tip-actions{display:flex;gap:8px;margin-top:10px}
.wl-tip-btn{padding:6px 14px;border-radius:var(--rp);font-size:12px;font-weight:700;
  background:rgba(139,92,246,.12);color:#A78BFA;border:1px solid rgba(139,92,246,.15);cursor:pointer}
.wl-tip-btn:active{background:rgba(139,92,246,.2)}
.wl-tip-notfound{font-size:13px;color:var(--t3);font-style:italic}

/* Empty state */
.empty-state{text-align:center;padding:60px 20px;color:var(--t3);font-size:14px}
.empty-state .es-icon{font-size:48px;margin-bottom:12px}
.empty-state .es-title{font-size:18px;font-weight:700;color:var(--t1);margin-bottom:4px}
.empty-state .es-desc{font-size:13px;color:var(--t3)}

/* Toast */
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  background:rgba(15,23,42,.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  color:#fff;padding:14px 24px;border-radius:14px;font-size:14px;font-weight:600;z-index:999;
  opacity:0;transition:all .25s cubic-bezier(.4,0,.2,1);pointer-events:none;text-align:center;
  max-width:280px;border:1px solid rgba(255,255,255,.08);
  box-shadow:0 20px 60px rgba(0,0,0,.5)}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}

/* Reminder banner */
.reminder-banner{background:linear-gradient(135deg,rgba(249,115,22,.1) 0%,rgba(251,191,36,.06) 100%);
  border:1px solid rgba(249,115,22,.15);border-radius:var(--rs);padding:14px 16px;margin-bottom:14px;
  display:flex;align-items:center;gap:10px;cursor:pointer;transition:all .15s}
.reminder-banner:active{transform:scale(.98)}
.reminder-icon{font-size:18px;flex-shrink:0}
.reminder-text{flex:1}
.reminder-text .rt-title{font-size:13px;font-weight:700;color:#FB923C}
.reminder-text .rt-desc{font-size:12px;color:var(--t3);margin-top:2px}

/* Swipe hint */
.swipe-hint{text-align:center;font-size:11px;color:var(--t4);margin-bottom:12px;
  display:flex;align-items:center;justify-content:center;gap:4px;opacity:.7}
.swipe-hint svg{width:12px;height:12px;stroke:var(--t4);fill:none;stroke-width:2}


/* ===== V10: Search Bar ===== */
.search-bar{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.08);border-radius:var(--rs);padding:10px 14px;margin-bottom:14px;
  transition:border-color .2s}
.search-bar:focus-within{border-color:rgba(96,165,250,.4)}
.search-bar svg{width:18px;height:18px;stroke:var(--t3);fill:none;stroke-width:2;flex-shrink:0}
.search-bar input{flex:1;background:none;border:none;outline:none;color:var(--t1);font-size:14px;font-weight:500}
.search-bar input::placeholder{color:var(--t4)}
.search-clear{width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.06);display:flex;
  align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.search-clear:active{transform:scale(.9)}
.search-clear svg{width:12px;height:12px;stroke:var(--t3);fill:none;stroke-width:2.5}
.search-results{margin-bottom:14px}
.search-result-item{display:flex;align-items:center;gap:12px;padding:12px 14px;background:rgba(255,255,255,.02);
  border:1px solid rgba(255,255,255,.05);border-radius:var(--rs);margin-bottom:8px;cursor:pointer;transition:all .15s}
.search-result-item:active{transform:scale(.98);background:rgba(255,255,255,.04)}
.sr-day{width:38px;height:38px;border-radius:10px;background:rgba(139,92,246,.12);color:#A78BFA;
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0}
.sr-word{flex:1;min-width:0}
.sr-word .sr-en{font-size:14px;font-weight:700;color:var(--t1)}
.sr-word .sr-cn{font-size:12px;color:var(--t3);margin-top:1px}

/* ===== V10: Home Top Bar + Quick Actions ===== */
.home-top-bar{display:flex;align-items:center;justify-content:space-between;
  padding:calc(var(--st)+8px) 0 4px;margin-bottom:6px}
.home-top-bar .htb-title{font-size:24px;font-weight:800;
  background:linear-gradient(135deg,#E8EDF5 0%,#94A3B8 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-.5px}
.home-top-bar .htb-actions{display:flex;gap:8px}
.htb-btn{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:all .15s}
.htb-btn:active{transform:scale(.9);background:rgba(255,255,255,.08)}
.htb-btn svg{width:18px;height:18px;stroke:var(--t2);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.home-actions{display:flex;gap:8px;margin-bottom:14px}
.home-action-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px;
  background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.05);border-radius:var(--rs);
  cursor:pointer;transition:all .15s}
.home-action-btn:active{transform:scale(.96);background:rgba(255,255,255,.04)}
.home-action-btn svg{width:20px;height:20px;stroke:var(--t2);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.home-action-btn span{font-size:11px;font-weight:600;color:var(--t2)}

/* ===== V10: Review Banner ===== */
.review-banner{background:linear-gradient(135deg,rgba(139,92,246,.12) 0%,rgba(96,165,250,.06) 100%);
  border:1px solid rgba(139,92,246,.18);border-radius:var(--rs);padding:14px 16px;margin-bottom:14px;
  display:flex;align-items:center;gap:12px;cursor:pointer;transition:all .15s}
.review-banner:active{transform:scale(.98)}
.review-banner .rb-icon{font-size:22px;flex-shrink:0}
.review-banner .rb-info{flex:1}
.review-banner .rb-title{font-size:14px;font-weight:700;color:#A78BFA}
.review-banner .rb-desc{font-size:12px;color:var(--t3);margin-top:2px}
.review-banner .rb-count{font-size:24px;font-weight:900;color:#60A5FA}

/* ===== V10: Notebook Page ===== */
.nb-word-card{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.05);
  border-radius:var(--rs);padding:16px;margin-bottom:10px;display:flex;align-items:center;gap:12px}
.nbw-day{font-size:11px;font-weight:800;padding:4px 10px;border-radius:var(--rp);
  background:rgba(139,92,246,.12);color:#A78BFA;flex-shrink:0}
.nbw-info{flex:1;min-width:0}
.nbw-en{font-size:16px;font-weight:700;color:var(--t1)}
.nbw-cn{font-size:13px;color:var(--t3);margin-top:2px}
.nbw-actions{display:flex;gap:6px;flex-shrink:0}
.nbw-btn{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.04);
  display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s}
.nbw-btn:active{transform:scale(.9)}
.nbw-btn svg{width:16px;height:16px;stroke:var(--t3);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nbw-btn.del svg{stroke:var(--red)}

/* ===== V10: Word Card Bookmark + Ebbinghaus ===== */
.wc-actions{display:flex;gap:8px;margin-top:12px}
.wc-action-btn{flex:1;padding:10px;border-radius:var(--rs);font-size:13px;font-weight:700;
  display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;transition:all .15s}
.wc-action-btn:active{transform:scale(.96)}
.wc-action-btn.bookmark{background:rgba(139,92,246,.1);color:#A78BFA;border:1px solid rgba(139,92,246,.15)}
.wc-action-btn.bookmark.saved{background:rgba(139,92,246,.25);color:#C4B5FD}
.wc-action-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.eb-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:4px 10px;
  border-radius:var(--rp);margin-top:8px}
.eb-badge.due{background:rgba(249,115,22,.12);color:#FB923C;border:1px solid rgba(249,115,22,.15)}
.eb-badge.known{background:rgba(16,185,129,.12);color:#34D399;border:1px solid rgba(16,185,129,.15)}
.eb-badge.new{background:rgba(255,255,255,.04);color:var(--t3);border:1px solid rgba(255,255,255,.06)}

/* ===== V10: Heatmap ===== */
.heatmap-container{overflow-x:auto;padding:4px 0;-webkit-overflow-scrolling:touch}
.heatmap-grid{display:flex;gap:3px;min-width:max-content}
.heatmap-col{display:flex;flex-direction:column;gap:3px}
.heatmap-cell{width:13px;height:13px;border-radius:3px;background:rgba(255,255,255,.04);
  transition:transform .1s}
.heatmap-cell.l1{background:rgba(139,92,246,.25)}
.heatmap-cell.l2{background:rgba(139,92,246,.45)}
.heatmap-cell.l3{background:rgba(139,92,246,.65)}
.heatmap-cell.l4{background:rgba(139,92,246,.9)}
.heatmap-stats{display:flex;gap:20px;margin-top:14px}
.heatmap-stat{text-align:center}
.heatmap-stat .hs-num{font-size:22px;font-weight:800;color:var(--t1)}
.heatmap-stat .hs-label{font-size:11px;color:var(--t3);margin-top:2px;font-weight:600}
.heatmap-legend{display:flex;align-items:center;gap:4px;margin-top:10px;font-size:11px;color:var(--t4)}
.heatmap-legend .heatmap-cell{width:10px;height:10px}

/* ===== V10: Settings Modal ===== */
.settings-group{margin-bottom:20px}
.settings-group-title{font-size:12px;font-weight:800;color:var(--t2);margin-bottom:10px;
  text-transform:uppercase;letter-spacing:1px}
.settings-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;
  border-bottom:1px solid rgba(255,255,255,.04)}
.settings-row:last-child{border-bottom:none}
.settings-row.col{flex-direction:column;align-items:stretch}
.settings-label{font-size:14px;font-weight:600;color:var(--t1)}
.settings-desc{font-size:12px;color:var(--t3);margin-top:2px}
.settings-value{font-size:14px;font-weight:700;color:#60A5FA}
.settings-slider{width:100%;margin:8px 0;-webkit-appearance:none;appearance:none;height:6px;border-radius:3px;
  background:rgba(255,255,255,.08);outline:none}
.settings-slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:20px;height:20px;border-radius:50%;
  background:var(--ga);cursor:pointer;box-shadow:0 2px 8px rgba(96,165,250,.4)}
.settings-slider::-moz-range-thumb{width:20px;height:20px;border-radius:50%;border:none;
  background:#60A5FA;cursor:pointer}
.settings-select{background:rgba(0,0,0,.25);border:1.5px solid rgba(255,255,255,.08);
  border-radius:var(--rs);padding:10px 14px;color:var(--t1);font-size:14px;width:100%;outline:none;
  margin-top:4px}
.settings-select:focus{border-color:#60A5FA}
.settings-select option{background:#0F1219}

/* ===== V10: Nav 3-button adjustment ===== */
.nav-btn{padding:6px 18px;min-width:60px}

/* ===== V10: Import file input ===== */
.import-hidden{display:none}


/* ===== V13: Mixed Review ===== */
.mixed-review-banner{background:linear-gradient(135deg,rgba(16,185,129,.10) 0%,rgba(6,182,212,.06) 100%);
  border:1px solid rgba(16,185,129,.2);border-radius:var(--r);padding:18px 20px;margin-bottom:16px;
  cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.mixed-review-banner:active{transform:scale(.98)}
.mixed-review-banner::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,#10B981,#06B6D4)}
.mrb-icon{font-size:28px;margin-bottom:8px}
.mrb-title{font-size:15px;font-weight:800;color:#34D399;margin-bottom:4px}
.mrb-desc{font-size:12px;color:var(--t3)}
.mrb-count{position:absolute;top:18px;right:20px;font-size:28px;font-weight:900;color:#10B981}

/* ===== V13: Sentence Builder ===== */
.sb-container{padding:8px 0}
.sb-progress{font-size:12px;color:var(--t3);font-weight:600;text-align:center;margin-bottom:12px}
.sb-prompt{background:linear-gradient(135deg,rgba(139,92,246,.06) 0%,rgba(6,182,212,.03) 100%);
  border:1px solid rgba(139,92,246,.1);border-radius:var(--r);padding:20px;text-align:center;margin-bottom:16px}
.sb-prompt-cn{font-size:16px;font-weight:700;color:var(--t1);margin-bottom:6px}
.sb-prompt-hint{font-size:12px;color:var(--t3)}
.sb-answer-area{min-height:56px;background:rgba(0,0,0,.2);border:2px dashed rgba(139,92,246,.2);
  border-radius:var(--r);padding:12px;margin-bottom:14px;display:flex;flex-wrap:wrap;gap:6px;
  align-items:center;transition:all .3s}
.sb-answer-area.correct{border-color:#10B981;background:rgba(16,185,129,.06)}
.sb-answer-area.wrong{border-color:#EF4444;background:rgba(239,68,68,.06)}
.sb-answer-placeholder{color:var(--t4);font-size:13px;width:100%;text-align:center}
.sb-word-bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:14px}
.sb-word-chip{padding:8px 14px;border-radius:var(--rp);background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.1);font-size:14px;font-weight:600;color:var(--t1);
  cursor:pointer;transition:all .2s;user-select:none;-webkit-user-select:none}
.sb-word-chip:active{transform:scale(.92)}
.sb-word-chip.used{opacity:.25;pointer-events:none}
.sb-word-chip.in-answer{background:rgba(139,92,246,.15);border-color:rgba(139,92,246,.3);color:var(--purp2)}
.sb-actions{display:flex;gap:8px;justify-content:center}
.sb-result{margin-top:12px;padding:14px;border-radius:var(--rs);text-align:center;animation:pronFadeIn .3s}
.sb-result.correct{background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.2)}
.sb-result.wrong{background:rgba(239,68,68,.06);border:1px solid rgba(239,68,68,.15)}
.sb-result-icon{font-size:32px;margin-bottom:4px}
.sb-result-text{font-size:14px;font-weight:700}
.sb-result-answer{font-size:13px;color:var(--t2);margin-top:4px}

/* ===== V13: Error pool badge ===== */
.nb-error-section{margin-bottom:14px}
.nb-error-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.nb-error-title{font-size:13px;font-weight:800;color:var(--org);display:flex;align-items:center;gap:6px}
.nb-error-count{font-size:12px;font-weight:700;color:var(--t3);background:rgba(249,115,22,.1);
  padding:2px 8px;border-radius:var(--rp)}
.nb-error-card{background:rgba(249,115,22,.04);border:1px solid rgba(249,115,22,.12);
  border-radius:var(--rs);padding:10px 12px;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.nb-error-card .nbw-day{color:var(--org)}
.nb-error-actions{display:flex;gap:6px;margin-top:8px}
/* ===== V12: Daily Sentence ===== */
.daily-sentence-card{background:linear-gradient(135deg,rgba(139,92,246,.10) 0%,rgba(6,182,212,.06) 100%);
  border:1px solid rgba(139,92,246,.18);border-radius:var(--r);padding:18px 20px;margin-bottom:16px;
  position:relative;overflow:hidden;animation:fadeUp .4s ease}
.daily-sentence-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:var(--ga)}
.ds-label{font-size:11px;font-weight:800;color:var(--purp2);text-transform:uppercase;
  letter-spacing:1px;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.ds-label svg{width:14px;height:14px;fill:var(--purp2)}
.ds-text{font-size:15px;font-weight:600;color:var(--t1);line-height:1.6;margin-bottom:6px;
  font-style:italic}
.ds-text-cn{font-size:13px;color:var(--t2);line-height:1.5}
.ds-actions{margin-top:10px;display:flex;gap:8px}
.ds-btn{display:inline-flex;align-items:center;gap:4px;padding:5px 12px;border-radius:var(--rp);
  background:rgba(139,92,246,.12);border:1px solid rgba(139,92,246,.2);color:var(--purp2);
  font-size:11px;font-weight:700;cursor:pointer;transition:all .2s}
.ds-btn:active{transform:scale(.95)}
.ds-btn svg{width:13px;height:13px;fill:currentColor}

/* ===== V12: Review Modal ===== */
.review-modal-list{max-height:50vh;overflow-y:auto;margin:12px -4px 16px;padding:0 4px;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
.review-modal-day-group{margin-bottom:12px}
.review-modal-day-label{font-size:12px;font-weight:700;color:var(--cyan2);margin-bottom:6px;
  display:flex;align-items:center;gap:6px}
.review-modal-words{display:flex;flex-wrap:wrap;gap:6px}
.review-modal-word{font-size:12px;font-weight:600;color:var(--t1);padding:5px 10px;
  background:rgba(255,255,255,.04);border-radius:var(--rp);border:1px solid rgba(255,255,255,.06)}

/* ===== V12: Pronunciation button spacing ===== */
.pron-btn{display:inline-flex;align-items:center;gap:4px;padding:8px 16px;border-radius:var(--rp);
  background:rgba(139,92,246,.12);border:1px solid rgba(139,92,246,.25);color:var(--purp2);
  font-size:12px;font-weight:700;cursor:pointer;transition:all .2s;margin-top:4px}
.pron-btn:active{transform:scale(.95);background:rgba(139,92,246,.25)}
.pron-btn.recording{background:rgba(239,68,68,.15);border-color:rgba(239,68,68,.35);color:#FCA5A5;
  animation:pronPulse 1s infinite}
.pron-stop-btn{display:inline-flex;align-items:center;gap:4px;padding:8px 16px;border-radius:var(--rp);
  background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);color:#FCA5A5;
  font-size:12px;font-weight:700;cursor:pointer;margin-top:4px;margin-left:8px}
.pron-stop-btn:active{transform:scale(.95)}

/* ===== V12: Dictation improvements ===== */
.dict-mode-card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);
  border-radius:var(--r);padding:24px 20px;text-align:center;margin-bottom:16px}
.dict-mode-card .dmc-icon{font-size:48px;margin-bottom:12px;animation:dictBounce 2s infinite}
.dict-mode-card .dmc-hint{font-size:13px;color:var(--t3);margin-bottom:16px}
.dict-mode-controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:4px}
.dict-ctrl-btn{display:inline-flex;align-items:center;gap:4px;padding:10px 16px;border-radius:var(--rp);
  font-size:13px;font-weight:700;cursor:pointer;transition:all .2s;border:1px solid}
.dict-ctrl-btn.play{background:rgba(6,182,212,.12);border-color:rgba(6,182,212,.25);color:var(--cyan2)}
.dict-ctrl-btn.slow{background:rgba(59,130,246,.10);border-color:rgba(59,130,246,.2);color:#60A5FA}
.dict-ctrl-btn.hint{background:rgba(251,191,36,.10);border-color:rgba(251,191,36,.2);color:var(--ylw)}
.dict-ctrl-btn:active{transform:scale(.95)}
.dict-hint-display{font-size:16px;font-weight:800;color:var(--ylw);letter-spacing:4px;
  margin:10px 0;font-family:'Courier New',monospace}
.dict-progress-dots{display:flex;gap:4px;justify-content:center;margin:10px 0}
.dict-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.1);transition:all .3s}
.dict-dot.correct{background:#10B981}
.dict-dot.wrong{background:#EF4444}
.dict-dot.current{background:var(--purp2);transform:scale(1.3)}
@keyframes dictBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

/* ===== V12: Online lookup ===== */
.wl-tip-online{margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.06)}
.wl-tip-online-btn{display:inline-flex;align-items:center;gap:4px;padding:6px 12px;border-radius:var(--rp);
  background:rgba(6,182,212,.12);border:1px solid rgba(6,182,212,.2);color:var(--cyan2);
  font-size:11px;font-weight:700;cursor:pointer}
.wl-tip-online-btn:active{transform:scale(.95)}
.wl-tip-loading{font-size:12px;color:var(--t3);padding:8px 0;text-align:center}
.wl-tip-api-def{font-size:12px;color:var(--t2);line-height:1.5;margin-top:6px;padding:8px;
  background:rgba(255,255,255,.03);border-radius:8px}
.wl-tip-api-def b{color:var(--t1)}

/* ===== V12: Extra examples ===== */
.word-extra-examples{margin-top:10px}
.word-extra-ex-title{font-size:11px;font-weight:800;color:var(--t3);text-transform:uppercase;
  letter-spacing:.5px;margin-bottom:8px}
.word-ex-item{padding:10px 12px;background:rgba(255,255,255,.03);border-radius:var(--rs);
  margin-bottom:8px;border-left:3px solid rgba(139,92,246,.3);cursor:pointer;transition:all .2s}
.word-ex-item:active{background:rgba(255,255,255,.06)}
.word-ex-item .en{font-size:13px;font-weight:600;color:var(--t1);line-height:1.5}
.word-ex-item .cn{font-size:12px;color:var(--t2);margin-top:4px}

/* ===== V12: Voice gender labels ===== */
.voice-gender-label{font-size:11px;font-weight:700;color:var(--t3);padding:4px 0 2px;
  border-top:1px solid rgba(255,255,255,.04)}

/* ===== V11: Pronunciation scoring ===== */
.pron-btn{display:inline-flex;align-items:center;gap:4px;padding:6px 14px;border-radius:var(--rp);
  background:rgba(139,92,246,.12);border:1px solid rgba(139,92,246,.25);color:var(--purp2);
  font-size:12px;font-weight:700;cursor:pointer;transition:all .2s}
.pron-btn:active{transform:scale(.95);background:rgba(139,92,246,.25)}
.pron-result{margin-top:10px;padding:14px;border-radius:var(--rs);background:rgba(255,255,255,.03);
  border:1px solid rgba(255,255,255,.06);text-align:center;animation:pronFadeIn .3s}
.pron-score{font-size:28px;font-weight:900;margin-bottom:4px}
.pron-grade{font-size:13px;color:var(--t2);font-weight:600;margin-bottom:8px}
.pron-detail{text-align:left;font-size:12px;line-height:1.6}
.pron-target{color:var(--t2)}
.pron-target b,.pron-recognized b{color:var(--t3);font-weight:600}
.pron-recognized{color:var(--cyan2);margin-top:4px}
.pron-recording{padding:14px;text-align:center;color:var(--purp2);font-weight:700;font-size:14px;
  animation:pronPulse 1s infinite}
.pron-error{padding:10px;text-align:center;color:var(--red);font-size:13px}
.pron-summary{display:flex;flex-direction:column;align-items:center;gap:4px;margin-bottom:14px}
.pron-avg{font-size:42px;font-weight:900;line-height:1}
.pron-avg-label{font-size:12px;color:var(--t3)}
.pron-recent{display:flex;flex-direction:column;gap:6px}
.pron-recent-item{font-size:12px;color:var(--t2);padding:6px 10px;background:rgba(255,255,255,.03);border-radius:8px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@keyframes pronPulse{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes pronFadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}

/* ===== V11: Word frequency chart ===== */
.freq-chart{display:flex;flex-direction:column;gap:8px}
.freq-row{display:flex;align-items:center;gap:8px}
.freq-word{width:80px;font-size:12px;color:var(--t2);font-weight:600;text-align:right;flex-shrink:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.freq-bar-wrap{flex:1;height:18px;background:rgba(255,255,255,.04);border-radius:4px;overflow:hidden}
.freq-bar{height:100%;border-radius:4px;background:linear-gradient(90deg,#8B5CF6,#22D3EE);transition:width .5s}
.freq-count{width:24px;font-size:11px;color:var(--t3);font-weight:700;text-align:center;flex-shrink:0}

/* ===== V11: Weak topics chart ===== */
.weak-chart{display:flex;flex-direction:column;gap:8px}
.weak-row{display:flex;align-items:center;gap:8px;padding:6px;border-radius:8px;cursor:pointer;transition:background .2s}
.weak-row:active{background:rgba(255,255,255,.03)}
.weak-day{width:50px;font-size:11px;font-weight:700;color:var(--org);flex-shrink:0}
.weak-title{flex:1;font-size:12px;color:var(--t2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.weak-bar-wrap{width:60px;height:14px;background:rgba(255,255,255,.04);border-radius:3px;overflow:hidden;flex-shrink:0}
.weak-bar{height:100%;border-radius:3px;transition:width .5s}
.weak-bar.high{background:linear-gradient(90deg,#EF4444,#F97316)}
.weak-bar.mid{background:linear-gradient(90deg,#F97316,#FBBF24)}
.weak-bar.low{background:linear-gradient(90deg,#FBBF24,#34D399)}
.weak-count{width:32px;font-size:11px;color:var(--t3);font-weight:700;text-align:center;flex-shrink:0}

/* ===== V16: Category System ===== */
.cat-grid{display:grid;grid-template-columns:1fr;gap:14px;margin-bottom:20px}
.cat-card{background:linear-gradient(135deg,rgba(139,92,246,.10) 0%,rgba(6,182,212,.05) 100%);
  border:1px solid rgba(139,92,246,.14);border-radius:var(--r);padding:24px 20px;cursor:pointer;
  transition:all .2s;position:relative;overflow:hidden;display:flex;align-items:center;gap:16px}
.cat-card:active{transform:scale(.97)}
.cat-card.cyan{background:linear-gradient(135deg,rgba(6,182,212,.10) 0%,rgba(59,130,246,.05) 100%);
  border-color:rgba(6,182,212,.14)}
.cat-card.gradient-orange{background:linear-gradient(135deg,rgba(249,115,22,.10) 0%,rgba(251,191,36,.05) 100%);
  border-color:rgba(249,115,22,.14)}
.cat-icon{width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;
  font-size:28px;flex-shrink:0;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08)}
.cat-info{flex:1;min-width:0}
.cat-name{font-size:18px;font-weight:800;color:var(--t1);margin-bottom:2px}
.cat-desc{font-size:13px;color:var(--t3);font-weight:500}
.cat-arrow{width:32px;height:32px;border-radius:10px;background:rgba(255,255,255,.04);display:flex;
  align-items:center;justify-content:center;flex-shrink:0}
.cat-arrow svg{width:16px;height:16px;stroke:var(--t2);fill:none;stroke-width:2.5}
.cat-back{display:flex;align-items:center;gap:10px;padding:2px 0 14px;cursor:pointer;margin-bottom:6px}
.cat-back svg{width:18px;height:18px;stroke:var(--t2);fill:none;stroke-width:2.5}
.cat-back span{font-size:16px;font-weight:700;color:var(--t1)}
.cat-stats{display:flex;gap:16px;margin-bottom:16px}
.cat-stat{flex:1;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05);
  border-radius:var(--rs);padding:12px 14px;text-align:center}
.cat-stat-num{font-size:20px;font-weight:800;color:var(--t1)}
.cat-stat-label{font-size:11px;color:var(--t3);margin-top:2px;font-weight:600}
.cat-empty{text-align:center;padding:40px 20px;color:var(--t3)}
.cat-empty-icon{font-size:48px;margin-bottom:12px}
.cat-empty-text{font-size:15px;font-weight:600}
.cat-empty-sub{font-size:13px;color:var(--t4);margin-top:4px}

/* V16: Category view - only hide day cards when not in a category */
body:not(.cat-view) #home-section-header,
body:not(.cat-view) #home-cards{display:none !important}

n":"Your seat is in row thirteen.","exampleCn":"您的座位在第13排。"},{"word":"twenty","translation":"二十","exampleEn":"The taxi costs about twenty dollars.","exampleCn":"出租车大约20美元。"},{"word":"thirty","translation":"三十","exampleEn":"We have a thirty-minute layover.","exampleCn":"我们有30分钟的中转时间。"},{"word":"fifty","translation":"五十","exampleEn":"The hotel is about fifty meters away.","exampleCn":"酒店大约50米远。"},{"word":"hundred","translation":"百","exampleEn":"The deposit is one hundred dollars.","exampleCn":"押金是100美元。"},{"word":"thousand","translation":"千","exampleEn":"The ticket costs two thousand yuan.","exampleCn":"机票两千元。"},{"word":"What time is it?","translation":"几点了？","exampleEn":"Excuse me, what time is it now?","exampleCn":"打扰一下，现在几点了？"},{"word":"a.m. / p.m.","translation":"上午 / 下午","exampleEn":"The flight departs at 8 a.m.","exampleCn":"航班上午8点出发。"},{"word":"half past","translation":"……点半","exampleEn":"Let's meet at half past three.","exampleCn":"我们三点半见。"},{"word":"quarter","translation":"一刻钟 / 四分之一","exampleEn":"It's a quarter to ten.","exampleCn":"现在差一刻十点。"},{"word":"How long does it take?","translation":"需要多长时间？","exampleEn":"How long does it take to get to the airport?","exampleCn":"到机场需要多长时间？"},{"word":"schedule","translation":"日程 / 时刻表","exampleEn":"Let me check the train schedule.","exampleCn":"让我查一下火车时刻表。"},{"word":"on time","translation":"准时","exampleEn":"The flight arrived right on time.","exampleCn":"航班准时到达。"}],"dialog":[{"role":"YOU","textEn":"Excuse me, how do I buy a ticket to downtown?","textCn":"打扰一下，去市中心怎么买票？"},{"role":"STAFF","textEn":"You can use the machine over there. Just select \"Single Trip,\" then tap your destination on the map. It costs four dollars.","textCn":"你可以用那边那台机器。选\"单程票\"，然后在地图上点你的目的地。四块钱。"},{"role":"YOU","textEn":"Got it. Also — which platform do I go to? I don't want to get on the wrong train.","textCn":"明白了。还有——我去哪个站台？我不想坐错方向。"},{"role":"STAFF","textEn":"Take the blue line, Platform 2. Go straight down the stairs, then turn left. You'll see the sign for Platform 2. Trains run every five minutes.","textCn":"坐蓝线，2号站台。下了楼梯直走然后左转，你会看到2号站台的指示牌。列车每五分钟一班。"},{"role":"YOU","textEn":"Thanks! One last thing — do I need to transfer?","textCn":"谢谢！最后一个问题——需要换乘吗？"},{"role":"STAFF","textEn":"No transfer needed. It's about a twenty-five-minute ride. Get off at Central Station — that's the last stop on this line.","textCn":"不需要换乘。大约25分钟车程。在中央车站下车——那是这条线的终点站。"},{"role":"YOU","textEn":"Perfect, thanks a lot for your help!","textCn":"太好了，非常感谢你的帮助！"}],"essay":null},{"day":6,"dayTitle":"公共交通出行","daySubtitle":"","phase":"Phase 1","newWordsCount":15,"reviewWordsCount":45,"dialogCount":12,"totalWords":90,"newWords":[{"word":"one-way ticket","translation":"单程票","exampleEn":"A one-way ticket to London, please.","exampleCn":"一张去伦敦的单程票。"},{"word":"round-trip ticket","translation":"往返票","exampleEn":"Is a round-trip ticket cheaper than two one-way tickets?","exampleCn":"往返票比两张单程票便宜吗？"},{"word":"ticket office","translation":"售票处","exampleEn":"The ticket office is next to the main entrance.","exampleCn":"售票处在主入口旁边。"},{"word":"fare","translation":"车费 / 票价","exampleEn":"How much is the fare to the city center?","exampleCn":"到市中心的票价是多少？"},{"word":"platform","translation":"站台","exampleEn":"Your train departs from platform 5.","exampleCn":"您的火车从5号站台出发。"},{"word":"timetable","translation":"时刻表","exampleEn":"You can check the timetable online or at the station.","exampleCn":"可以在网上或车站查询时刻表。"},{"word":"express","translation":"快车","exampleEn":"The express train takes about 40 minutes.","exampleCn":"快车大约需要40分钟。"},{"word":"local train","translation":"慢车 / 普通车","exampleEn":"The local train stops at every station along the way.","exampleCn":"慢车沿途每站都停。"},{"word":"delayed","translation":"晚点的 / 延误的","exampleEn":"The 9:15 train is delayed by 20 minutes.","exampleCn":"9点15的火车晚点20分钟。"},{"word":"transfer","translation":"换乘","exampleEn":"You need to transfer at Central Station.","exampleCn":"你需要在中央车站换乘。"},{"word":"exit","translation":"出口","exampleEn": leEn":"","exampleCn":""},{"word":"total","translation":"总计","exampleEn":"","exampleCn":""},{"word":"change","translation":"找零","exampleEn":"","exampleCn":""},{"word":"cash","translation":"现金","exampleEn":"","exampleCn":""},{"word":"pharmacy","translation":"药房","exampleEn":"","exampleCn":""},{"word":"medicine","translation":"药物","exampleEn":"","exampleCn":""},{"word":"painkiller","translation":"止痛药","exampleEn":"","exampleCn":""},{"word":"prescription","translation":"处方","exampleEn":"","exampleCn":""},{"word":"over-the-counter","translation":"非处方药","exampleEn":"","exampleCn":""},{"word":"doctor","translation":"医生","exampleEn":"","exampleCn":""},{"word":"hospital","translation":"医院","exampleEn":"","exampleCn":""},{"word":"clinic","translation":"诊所","exampleEn":"","exampleCn":""},{"word":"headache","translation":"头疼","exampleEn":"","exampleCn":""},{"word":"fever","translation":"发烧","exampleEn":"","exampleCn":""},{"word":"cough","translation":"咳嗽","exampleEn":"","exampleCn":""},{"word":"stomachache","translation":"胃痛","exampleEn":"","exampleCn":""},{"word":"symptom","translation":"症状","exampleEn":"","exampleCn":""},{"word":"insurance","translation":"保险","exampleEn":"","exampleCn":""},{"word":"emergency","translation":"紧急情况","exampleEn":"","exampleCn":""}],"dialog":[{"role":"Receptionist 接待员","textEn":"Good morning, Westside Clinic. How can I help you?","textCn":"早上好，西区诊所。需要什么帮助？"},{"role":"You 你","textEn":"I'd like to make an appointment to see a doctor. I have a really sore throat and a fever.","textCn":"我想预约看医生。我喉咙很疼，还发烧。"},{"role":"Receptionist","textEn":"Are you a regular patient here? May I have your name and date of birth, please?","textCn":"您是这里的常客吗？请告诉我您的姓名和出生日期。"},{"role":"You","textEn":"No, I'm a visitor. My name is Wang, born on April 7th, 2000.","textCn":"不是，我是游客。我姓王，2000年4月7日生。"},{"role":"Receptionist","textEn":"Thanks. How about 11:30 this morning with Dr. Smith?","textCn":"谢谢。今天上午11:30看史密斯医生怎么样？"},{"role":"You","textEn":"That works. Do you take travel insurance?","textCn":"可以。你们接受旅行保险吗？"},{"role":"Receptionist","textEn":"Yes, we do. Please bring your insurance card and passport.","textCn":"是的，接受。请带上您的保险卡和护照。"},{"role":"Doctor 医生","textEn":"Hello Mr. Wang. What brings you in today?","textCn":"你好王先生。今天哪里不舒服？"},{"role":"You","textEn":"I have had a sore throat for three days, a fever since yesterday, and I think I caught a cold on the flight.","textCn":"我喉咙疼三天了，昨晚开始发烧，我觉得在飞机上感冒了。"},{"role":"Doctor","textEn":"Let me take your temperature and check your blood pressure.","textCn":"先量一下体温，测一下血压。"},{"role":"Doctor","textEn":"It looks like a flu, not just a common cold. I'll prescribe some antibiotics — take one pill twice a day for five days.","textCn":"看起来像流感，不只是普通感冒。我给你开点抗生素——每天两次，每次一片，吃五天。"},{"role":"You","textEn":"Got it. Should I rest at the hotel?","textCn":"明白。我需要回酒店休息吗？"},{"role":"Doctor","textEn":"Yes, please rest for two or three days, drink lots of water, and stay hydrated. You should fully recover within a week.","textCn":"是的，请休息两三天，多喝水，保持补水。一周之内你应该能完全恢复。"},{"role":"You","textEn":"Thank you, doctor. Where do I pick up the medicine?","textCn":"谢谢医生。哪里能拿药？"},{"role":"Doctor","textEn":"Just across the hall — there's a pharmacy at the clinic. If it gets worse, call an ambulance or come back to the emergency room.","textCn":"就在大厅对面，诊所有药房。如果变严重了，叫救护车或直接回来挂急诊。"}],"essay":{"title":"Seeing a Doctor Abroad","titleCn":"在国外看医生","sentences":[{"en":"On the second day of my trip, I woke up with a sore throat and a high fever.","cn":"旅行第二天我醒来时喉咙很疼而且发高烧"},{"en":"I knew it was not just a common cold, so I decided to see a doctor.","cn":"我知道这不只是普通感冒所以决定去看医生"},{"en":"I called a local clinic and made an appointment for 11:30 in the morning.","cn":"我打电话给当地一家诊所预约了上午十一点半"},{"en":"The receptionist asked for my name, date of birth, and whether I had travel insurance.","cn":"接待员问了姓名出生日期还有是否买了旅行保险"},{"en":"At the clinic, the doctor took my temperature and checked my blood pressure.","cn":"在诊所医生给我量了体温测了血压"},{"en":"She said I had the flu and prescribed antibiotics for five days.","cn":"她说我得了流感给我开了五天的抗生素"},{"en":"She told me to rest, stay hydrated, and take one pill twice a day.","cn":"她嘱咐我好好休息多喝水每天吃两次药"},{"en":"I picked up the medicine at the pharmacy across the hall and kept the receipt for my insurance claim.","cn":"我在对面药房取了药并保留了收据准备报销"},{"en":"Three days later I started to feel better and could continue my trip.","cn":"三天后我开始好转可以继续剩下的旅程"}]}},{"day":13,"dayTitle":"紧急情况与求助","daySubtitle":"Emergency & Help","phase":"Phase 1","newWordsCount":181,"reviewWordsCount":60,"dialogCount":8,"totalWords":180,"newWords":[{"word":"help","translation":"帮助 救命","exampleEn":"","exampleCn":""},{"word":"emergency","translation":"紧急情况","exampleEn":"","exampleCn":""},{"word":"call","translation":"打电话","exampleEn":"","exampleCn":""},{"word":"police","translation":"警察","exampleEn":"","exampleCn":""},{"word":"ambulance","translation":"救护车","exampleEn":"","exampleCn":""},{"word":"accident","translation":"事故 意外","exampleEn":"","exampleCn":""},{"word":"injury","translation":"受伤 伤","exampleEn":"","exampleCn":""},{"word":"incident","translation":"事件 事故","exampleEn":"","exampleCn":""},{"word":"lost","translation":"丢失的 迷路的","exampleEn":"","exampleCn":""},{"word":"stolen","translation":"被盗的","exampleEn":"","exampleCn":""},{"word":"missing","translation":"失踪的 找不到的","exampleEn":"","exampleCn":""},{"word":"embassy","translation":"大使馆","exampleEn":"","exampleCn":""},{"word":"report","translation":"报警 报告","exampleEn":"","exampleCn":""},{"word":"insurance","translation":"保险","exampleEn":"","exampleCn":""}],"reviewWords":[{"word":"subway","translation":"地铁","exampleEn":"","exampleCn":""},{"word":"bus","translation":"公交车","exampleEn":"","exampleCn":""},{"word":"taxi","translation":"出租车","exampleEn":"","exampleCn":""},{"word":"train","translation":"火车","exampleEn":"","exampleCn":""},{"word":"station","translation":"车站","exampleEn":"","exampleCn":""},{"word":"stop","translation":"站 停","exampleEn":"","exampleCn":""},{"word":"ticket","translatio ","translation":"诊所","exampleEn":"","exampleCn":""},{"word":"headache","translation":"头痛","exampleEn":"","exampleCn":""},{"word":"fever","translation":"发烧","exampleEn":"","exampleCn":""},{"word":"cough","translation":"咳嗽","exampleEn":"","exampleCn":""},{"word":"stomachache","translation":"胃痛","exampleEn":"","exampleCn":""},{"word":"symptom","translation":"症状","exampleEn":"","exampleCn":""},{"word":"insurance","translation":"保险","exampleEn":"","exampleCn":""},{"word":"emergency","translation":"紧急情况","exampleEn":"","exampleCn":""},{"word":"allergic","translation":"过敏的","exampleEn":"","exampleCn":""},{"word":"body","translation":"身体","exampleEn":"","exampleCn":""},{"word":"sore throat","translation":"咽喉痛","exampleEn":"","exampleCn":""},{"word":"flu","translation":"流感","exampleEn":"","exampleCn":""},{"word":"toothache","translation":"牙痛","exampleEn":"","exampleCn":""},{"word":"appointment","translation":"预约","exampleEn":"","exampleCn":""},{"word":"temperature","translation":"体温","exampleEn":"","exampleCn":""},{"word":"pill","translation":"药片","exampleEn":"","exampleCn":""},{"word":"antibiotics","translation":"抗生素","exampleEn":"","exampleCn":""},{"word":"blood pressure","translation":"血压","exampleEn":"","exampleCn":""},{"word":"rest","translation":"休息","exampleEn":"","exampleCn":""},{"word":"recover","translation":"恢复","exampleEn":"","exampleCn":""},{"word":"stay hydrated","translation":"保持水分","exampleEn":"","exampleCn":""},{"word":"allergic reaction","translation":"过敏反应","exampleEn":"","exampleCn":""},{"word":"cold","translation":"感冒","exampleEn":"","exampleCn":""},{"word":"ambulance","translation":"救护车","exampleEn":"","exampleCn":""}],"dialog":[{"role":"You 游客","textEn":"Excuse me, officer. I need to report a stolen wallet.","textCn":"警察先生 我要报案 我的钱包被偷了"},{"role":"Police 警察","textEn":"I'm sorry to hear that. When did it happen?","textCn":"很抱歉 请问是什么时候发生的"},{"role":"You 游客","textEn":"About one hour ago, on the subway. My wallet is missing from my bag.","textCn":"大概一小时前 在地铁上 我的钱包从包里不见了"},{"role":"Police 警察","textEn":"Was anything else stolen? Your phone or passport?","textCn":"还有别的被偷吗 手机或护照"},{"role":"You 游客","textEn":"Just the wallet. It has some cash and my credit card inside.","textCn":"只有钱包 里面有现金和信用卡"},{"role":"Police 警察","textEn":"I see. I will write a report. Do you have ID with you?","textCn":"我明白了 我会写一份报告 你带身份证件了吗"},{"role":"You 游客","textEn":"Yes, I have my passport. I also need to call my bank to cancel the card.","textCn":"有 我有护照 我还要打电话给银行挂失信用卡"},{"role":"Police 警察","textEn":"Good. Here is the report number. Contact your embassy if you need more help.","textCn":"好的 这是报案编号 如果需要更多帮助 联系大使馆"}],"essay":{"title":"紧急情况下的求助","titleCn":"","sentences":[{"en":"Last year, I had an emergency while traveling in another country.","cn":"去年 我在其他国家旅行时遇到了紧急情况"},{"en":"I lost my passport and all my cash on the subway.","cn":"我在地铁上丢了护照和所有现金"},{"en":"I felt very scared, but I went to the police station right away.","cn":"我非常害怕 但我马上去了警察局"},{"en":"The officer was very kind and helped me write a report.","cn":"警察很友善 帮我写了报案记录"},{"en":"Then I called the embassy, and they gave me a new travel document.","cn":"之后我打电话给大使馆 他们给了我新的旅行证件"},{"en":"From that day, I always keep a copy of my passport in the hotel safe.","cn":"从那天起 我总是把护照复印件放在酒店保险箱里"},{"en":"Travel insurance is also very important for every trip abroad.","cn":"旅行保险对每次出国都非常重要"},{"en":"Stay calm, ask for help, and things will work out in the end.","cn":"保持冷静 寻求帮助 最后一切都会好起来的"}]}},{"day":14,"dayTitle":"天气与出行准备","daySubtitle":"Weather & What to Wear","phase":"Phase 1","newWordsCount":196,"reviewWordsCount":60,"dialogCount":10,"totalWords":210,"newWords":[{"word":"weather","translation":"天气","exampleEn":"","exampleCn":""},{"word":"sunny","translation":"晴朗的","exampleEn":"","exampleCn":""},{"word":"rainy","translation":"下雨的","exampleEn":"","exampleCn":""},{"word":"cloudy","translation":"多云的","exampleEn":"","exampleCn":""},{"word":"hot","translation":"热的","exampleEn":"","exampleCn":""},{"word":"cold","tr Cn":""}],"essay":{"title":"Asking for Help","titleCn":"请求帮助","sentences":[{"en":"Traveling alone, I often need to ask for help.","cn":"一个人旅行时，我经常需要请求帮助。"},{"en":"Yesterday I forgot my phone charger.","cn":"昨天我忘带手机充电器了。"},{"en":"So I went into a small shop and said excuse me.","cn":"于是我走进一家小店说了句打扰一下。"},{"en":"I said I need a new charger for my phone.","cn":"我说我需要一个新的手机充电器。"},{"en":"The shop assistant was very friendly and helpful.","cn":"店员非常友好也很乐意帮忙。"},{"en":"She lent me a pen to write my hotel address.","cn":"她借给我一支笔写酒店地址。"},{"en":"I also asked if they could deliver a package for me.","cn":"我还问她们能不能帮我寄一个包裹。"},{"en":"She said the service was free of charge.","cn":"她说这项服务是免费的。"},{"en":"I bought a new bag because the old one was broken.","cn":"我买了一个新包因为旧的坏了。"},{"en":"I am so grateful for the kind service in this city.","cn":"我很感激这座城市的友好服务。"}]}},{"day":25,"dayTitle":"时间安排与做计划","daySubtitle":"Schedules & Making Plans","phase":"Phase 2","newWordsCount":15,"reviewWordsCount":120,"dialogCount":17,"totalWords":375,"newWords":[{"word":"schedule","translation":"时间表 / 日程","exampleEn":"","exampleCn":""},{"word":"appointment","translation":"预约 / 约会","exampleEn":"","exampleCn":""},{"word":"plan","translation":"计划 / 打算","exampleEn":"","exampleCn":""},{"word":"arrange","translation":"安排 / 组织","exampleEn":"","exampleCn":""},{"word":"confirm","translation":"确认 / 证实","exampleEn":"","exampleCn":""},{"word":"cancel","translation":"取消","exampleEn":"","exampleCn":""},{"word":"postpone","translation":"推迟 / 延期","exampleEn":"","exampleCn":""},{"word":"available","translation":"有空的 / 可用的","exampleEn":"","exampleCn":""},{"word":"convenient","translation":"方便的","exampleEn":"","exampleCn":""},{"word":"calendar","translation":"日历","exampleEn":"","exampleCn":""},{"word":"deadline","translation":"截止日期","exampleEn":"","exampleCn":""},{"word":"remind","translation":"提醒","exampleEn":"","exampleCn":""},{"word":"reserve","translation":"预订 / 保留","exampleEn":"","exampleCn":""},{"word":"reschedule","transl s is fully booked for today.","textCn":""},{"role":"YOU","textEn":"I'd like to make a reservation for the express train, please.","textCn":""},{"role":"AGENT","textEn":"Of course. May I have your name and passport number?","textCn":""},{"role":"YOU","textEn":"Here you are. Could you confirm the departure time and terminal?","textCn":""},{"role":"AGENT","textEn":"Confirmed. Departure is at 8:00 a.m. from Terminal 2. Please arrive 30 minutes early.","textCn":""},{"role":"YOU","textEn":"Thank you. If there is a delay, will you notify me?","textCn":""},{"role":"AGENT","textEn":"Yes, we will send a text message to your phone. Have a great trip!","textCn":""}],"essay":{"title":"Booking a Flight","titleCn":"预订航班","sentences":[{"en":"When I plan to travel far, I usually book a flight first.","cn":"当我计划去远方旅行时，我通常会先预订航班。"},{"en":"I compare different airlines to find a reasonable price.","cn":"我会比较不同航空公司，找到合理的价格。"},{"en":"A direct flight saves time, but it may cost more money.","cn":"直飞航班省时间，但可能更贵。"},{"en":"I prefer an economy seat near the window for short trips.","cn":"短途旅行我喜欢经济舱靠窗的座位。"},{"en":"Before I confirm the reservation, I check the departure time carefully.","cn":"确认预订之前，我会仔细核对出发时间。"},{"en":"Sometimes bad weather causes a delay, so I arrive at the terminal early.","cn":"有时恶劣天气会造成延误，所以我会提前到达航站楼。"},{"en":"A shuttle bus can take me from the airport to the city center.","cn":"机场摆渡车可以把我送到市中心。"},{"en":"Good planning makes the journey much easier.","cn":"良好的计划让旅程轻松很多。"}]}},{"day":29,"dayTitle":"租车自驾与导航","daySubtitle":"Car Rental & Road Navigation","phase":"Phase 2","newWordsCount":15,"reviewWordsCount":30,"dialogCount":16,"totalWords":435,"newWords":[{"word":"rent","translation":"租用","exampleEn":"","exampleCn":""},{"word":"return","translation":"归还","exampleEn":"","exampleCn":""},{"word":"fuel","translation":"汽油","exampleEn":"","exampleCn":""},{"word":"tank","translation":"油箱","exampleEn":"","exampleCn":""},{"word":"highway","translation":"高速公路","exampleEn":"","exampleCn":" ranslation":"游轮","exampleEn":"","exampleCn":""},{"word":"shuttle","translation":"摆渡车","exampleEn":"","exampleCn":""},{"word":"rental","translation":"租车","exampleEn":"","exampleCn":""},{"word":"route","translation":"路线","exampleEn":"","exampleCn":""},{"word":"express","translation":"快车","exampleEn":"","exampleCn":""},{"word":"direct","translation":"直达的","exampleEn":"","exampleCn":""},{"word":"departure","translation":"出发","exampleEn":"","exampleCn":""},{"word":"arrival","translation":"到达","exampleEn":"","exampleCn":""},{"word":"reservation","translation":"预订","exampleEn":"","exampleCn":""},{"word":"economy","translation":"经济舱","exampleEn":"","exampleCn":""},{"word":"business","translation":"商务舱","exampleEn":"","exampleCn":""},{"word":"delay","translation":"延误","exampleEn":"","exampleCn":""}],"dialog":[{"role":"AGENT","textEn":"Welcome! How can I help you with your rental today?","textCn":""},{"role":"YOU","textEn":"I'd like to rent a car for three days. Do you have a compact car available?","textCn":""},{"role":"AGENT","textEn":"Yes, we do. May I see your driver's license and a credit card for the deposit?","textCn":""},{"role":"YOU","textEn":"Here you are. Does the price include insurance?","textCn":""},{"role":"AGENT","textEn":"Basic insurance is included. Full coverage costs an extra 15 dollars per day.","textCn":""},{"role":"YOU","textEn":"I'll take the full coverage. Do I need to return it with a full tank?","textCn":""},{"role":"AGENT","textEn":"Yes, please return it with a full tank of fuel to avoid any extra charges.","textCn":""},{"role":"YOU","textEn":"Got it. One more thing — is there a navigation system in the car?","textCn":""},{"role":"AGENT","textEn":"Yes, all our cars come with built-in GPS navigation. Here are your keys.","textCn":""},{"role":"YOU","textEn":"I'm driving to the national park. Should I take the highway?","textCn":""},{"role":"LOCAL","textEn":"Yes, the highway is faster, but watch out for the toll road after the intersection.","textCn":""},{"role":"YOU","textEn":"What is the speed limit on the highway?","textCn":""},{"role":"LOCAL","textEn":"The speed limit is 100 kilometers per hour. Be careful at the roundabout ahead.","textCn":""},{"role":"YOU","textEn":"Thanks for the tip. Is there free parking near the park entrance?","textCn":""},{"role":"LOCAL","textEn":"Yes, there is a large parking lot on the left. Just follow the traffic lights.","textCn":""},{"role":"YOU","textEn":"Perfect. I'll set the navigation and hit the road. Thanks a lot!","textCn":""}],"essay":{"title":"Renting a Car on a Trip","titleCn":"旅行中租一辆车","sentences":[{"en":"Last summer I rented a car for the first time on a trip.","cn":"去年夏天，我第一次在旅行中租了一辆车。"},{"en":"I walked into the rental office and showed my license.","cn":"我走进租车办公室，出示了我的驾照。"},{"en":"The agent asked if I wanted full insurance coverage.","cn":"工作人员问我是否需要全额保险。"},{"en":"I said yes, because I wanted to feel safe on the road.","cn":"我说要，因为我想在路上有安全感。"},{"en":"She reminded me to return the car with a full tank of fuel.","cn":"她提醒我还车时要加满油箱。"},{"en":"I set the GPS navigation and headed for the highway.","cn":"我设好导航，开上了高速公路。"},{"en":"The speed limit was clear, and I followed it carefully.","cn":"限速标识很清楚，我小心翼翼地遵守着。"},{"en":"At the roundabout I almost took the wrong exit.","cn":"在环岛处我差点走错了出口。"},{"en":"But the friendly voice of the navigation guided me back.","cn":"但导航友善的声音把我带回了正轨。"},{"en":"When I arrived, I found a free parking lot near the beach.","cn":"到达后，我在海滩附近找到了免费停车场。"},{"en":"Driving yourself gives you so much freedom to explore.","cn":"自驾让你有太多自由去探索。"},{"en":"Next time I travel, I will rent a car without hesitation.","cn":"下次旅行，我会毫不犹豫地租一辆车。"}]}},{"day":30,"dayTitle":"住宿设施与客房服务","daySubtitle":"Hotel Facilities & Room Service","phase":"Phase 2","newWordsCount":15,"reviewWordsCount":60,"dialogCount":20,"totalWords":450,"newWords":[{"word":"suite","translation":"套房","exampleEn":"","exampleCn":""},{"word":"balcony","translation":"阳台","exampleEn":"","exampleCn":""},{"word":"vie
