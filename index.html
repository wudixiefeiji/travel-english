<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#07090F">
<meta name="apple-mobile-web-app-title" content="旅行英语">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v5">
<link rel="apple-touch-icon" sizes="120x120" href="apple-touch-icon.png?v5">
<link rel="apple-touch-icon" sizes="152x152" href="apple-touch-icon.png?v5">
<link rel="apple-touch-icon" sizes="167x167" href="apple-touch-icon.png?v5">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v5">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png?v5">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v5">
<title>旅行英语 · 38天计划</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior-y:contain}
body{background:#07090F;color:#E8EDF5;font-family:'Plus Jakarta Sans','Inter',-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;letter-spacing:-.1px}
button{font-family:inherit;cursor:pointer;border:none;outline:none;color:inherit;font-weight:700}
input,textarea{font-family:inherit}
:root{
  --nav-h:68px;--sb:env(safe-area-inset-bottom,8px);--st:max(env(safe-area-inset-top,0px),44px);
  --r:20px;--rs:14px;--rp:999px;
  --purp:#8B5CF6;--purp2:#A78BFA;--cyan:#06B6D4;--cyan2:#22D3EE;--blue:#3B82F6;
  --grn:#10B981;--red:#EF4444;--org:#F97316;--ylw:#FBBF24;
  --t1:#F1F5F9;--t2:#94A3B8;--t3:#64748B;--t4:#475569;
  --bg:#07090F;--bg2:#0C1018;
  --glow-p:0 0 30px rgba(139,92,246,.3);
  --glow-c:0 0 30px rgba(6,182,212,.3);
  --ga:linear-gradient(135deg,#A78BFA 0%,#60A5FA 50%,#22D3EE 100%);
  --gb:linear-gradient(135deg,#6366F1 0%,#3B82F6 100%);
  --gc:linear-gradient(135deg,#22D3EE 0%,#06B6D4 100%);
  --gd:linear-gradient(135deg,#10B981 0%,#059669 100%);
  --go:linear-gradient(135deg,#F97316 0%,#EA580C 100%);
  --gy:linear-gradient(135deg,#FBBF24 0%,#F59E0B 100%);
}

#app{width:100%;height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;position:relative;
  background:
    radial-gradient(ellipse 90% 45% at 50% -5%,rgba(139,92,246,.12) 0%,transparent 60%),
    radial-gradient(ellipse 60% 35% at 90% 20%,rgba(6,182,212,.06) 0%,transparent 50%),
    radial-gradient(ellipse 50% 30% at 10% 60%,rgba(59,130,246,.05) 0%,transparent 50%),
    #07090F;
}
#app::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(139,92,246,.2),rgba(6,182,212,.2),transparent);
  pointer-events:none}

/* V8: Increased horizontal padding from 16px to 20px */
.page{display:none;flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  padding:calc(var(--st)+12px) 20px calc(var(--nav-h)+var(--sb)+20px);animation:fadeUp .3s ease}
.page.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes scaleIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
@keyframes slideRight{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:translateX(0)}}
@keyframes slideLeft{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:translateX(0)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
@keyframes wordPop{0%{opacity:0;transform:translateY(4px)}100%{opacity:1;transform:none}}

.page::-webkit-scrollbar{width:0}

/* Nav - Glassmorphism */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;
  height:calc(var(--nav-h)+var(--sb));
  background:rgba(7,9,15,.8);
  backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);
  border-top:1px solid rgba(255,255,255,.06);
  display:flex;align-items:flex-start;justify-content:space-around;
  padding:10px 0 var(--sb);z-index:100}
.nav::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:60%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(139,92,246,.3),rgba(6,182,212,.3),transparent)}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 28px;border-radius:14px;
  background:none;transition:all .2s;position:relative;min-width:72px}
.nav-btn:active{transform:scale(.92)}
.nav-btn svg{width:24px;height:24px;stroke:var(--t3);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
  transition:all .2s}
.nav-btn.active svg{stroke:url(#navGrad);filter:drop-shadow(0 0 8px rgba(96,165,250,.5))}
.nav-btn span{font-size:11px;font-weight:600;color:var(--t3);transition:all .2s}
.nav-btn.active span{color:#60A5FA;font-weight:700}

/* ===== HOME ===== */
/* V9: removed top title text, adjusted spacing */
.home-top{padding:calc(var(--st)+8px) 0 4px;display:flex;align-items:center;justify-content:space-between;margin-bottom:0}
.home-title .ht-main{font-size:26px;font-weight:800;
  background:linear-gradient(135deg,#E8EDF5 0%,#94A3B8 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-.5px}
.home-title .ht-sub{font-size:14px;color:#94A3B8;margin-top:2px;font-weight:500}



/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.show{display:flex}
.modal{background:#0F1219;border:1px solid rgba(255,255,255,.08);border-radius:var(--r);
  width:100%;max-width:420px;padding:24px;animation:scaleIn .25s ease}
.modal-title{font-size:18px;font-weight:800;color:var(--t1);margin-bottom:16px}
.modal-close{position:absolute;top:16px;right:16px;width:32px;height:32px;border-radius:10px;
  background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center;cursor:pointer}
.modal-close svg{width:16px;height:16px;stroke:var(--t3);fill:none;stroke-width:2.5}
.modal-label{font-size:13px;font-weight:600;color:var(--t2);margin-bottom:8px}
.modal-input{width:100%;background:rgba(0,0,0,.25);border:1.5px solid rgba(255,255,255,.08);
  border-radius:var(--rs);padding:14px 16px;color:var(--t1);font-size:14px;margin-bottom:12px;
  transition:border-color .2s}
.modal-input:focus{border-color:#60A5FA;outline:none}
.modal-textarea{width:100%;min-height:120px;background:rgba(0,0,0,.25);border:1.5px solid rgba(255,255,255,.08);
  border-radius:var(--rs);padding:14px 16px;color:var(--t1);font-size:13px;margin-bottom:12px;resize:vertical;
  font-family:'Plus Jakarta Sans',monospace;line-height:1.5;transition:border-color .2s}
.modal-textarea:focus{border-color:#60A5FA;outline:none}
.modal-hint{font-size:12px;color:var(--t3);margin-bottom:12px;line-height:1.5}
.modal-divider{text-align:center;color:var(--t4);font-size:12px;margin:16px 0;position:relative}
.modal-divider::before,.modal-divider::after{content:'';position:absolute;top:50%;width:calc(50% - 30px);height:1px;background:rgba(255,255,255,.06)}
.modal-divider::before{left:0}
.modal-divider::after{right:0}
.modal-actions{display:flex;gap:10px;margin-top:8px}
.modal-actions .btn{flex:1}

/* Hero Card */
.hero-card{background:linear-gradient(135deg,rgba(139,92,246,.12) 0%,rgba(6,182,212,.06) 100%);
  border:1px solid rgba(139,92,246,.15);border-radius:var(--r);padding:16px;margin-bottom:14px;position:relative;overflow:hidden}
.hero-card::before{content:'';position:absolute;top:-50%;right:-20%;width:180px;height:180px;border-radius:50%;
  background:radial-gradient(circle,rgba(139,92,246,.15) 0%,transparent 70%);pointer-events:none}
.hero-card::after{content:'';position:absolute;bottom:-30%;left:-10%;width:140px;height:140px;border-radius:50%;
  background:radial-gradient(circle,rgba(6,182,212,.1) 0%,transparent 70%);pointer-events:none}
.hero-top{display:flex;align-items:flex-end;justify-content:space-between;position:relative;z-index:1}
.hero-num{font-size:32px;font-weight:900;line-height:1;
  background:var(--ga);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  letter-spacing:-2px}
.hero-num small{font-size:14px;-webkit-text-fill-color:var(--t2);font-weight:600;letter-spacing:0}
.hero-label{font-size:12px;color:var(--t2);margin-top:2px;font-weight:500}
.hero-pct{font-size:24px;font-weight:800;color:#60A5FA}
.hero-pct span{font-size:14px;color:var(--t3);font-weight:600}
.hero-bar{margin-top:12px;height:6px;background:rgba(255,255,255,.05);border-radius:var(--rp);overflow:hidden;
  border:1px solid rgba(255,255,255,.05);position:relative;z-index:1}
.hero-bar-fill{height:100%;background:var(--ga);border-radius:var(--rp);
  box-shadow:0 0 20px rgba(96,165,250,.4);transition:width .8s cubic-bezier(.4,0,.2,1);position:relative}
.hero-bar-fill::after{content:'';position:absolute;top:0;left:0;right:0;bottom:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);
  background-size:50% 100%;animation:shimmer 2s infinite}

/* V8: Stats quick - label from 11px to 12px, gap 12px */
.stats-quick{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:18px}
.sq-item{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.05);border-radius:var(--rs);
  padding:16px 10px;text-align:center;transition:all .2s}
.sq-item:active{transform:scale(.96)}
.sq-num{font-size:22px;font-weight:800;color:var(--t1)}
.sq-label{font-size:12px;color:var(--t3);margin-top:3px;font-weight:600}

/* Section */
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;padding:0 2px}
.section-title{font-size:15px;font-weight:700;color:var(--t2);display:flex;align-items:center;gap:8px}
.section-title::before{content:'';width:3px;height:16px;border-radius:2px;background:var(--ga)}

/* ===== V8: Phase Card List (replaces calendar grid) ===== */
.phase-group{margin-bottom:20px}
.phase-label{font-size:12px;font-weight:800;color:var(--t2);letter-spacing:1.5px;text-transform:uppercase;
  padding:8px 14px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);
  border-radius:var(--rp);display:inline-block;margin-bottom:12px}
.phase-card-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.day-card{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.05);border-radius:var(--rs);
  padding:16px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden;display:flex;gap:12px;align-items:flex-start}
.day-card:active{transform:scale(.97);background:rgba(255,255,255,.04)}
.day-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(139,92,246,.15),transparent);opacity:0;transition:opacity .2s}
.day-card:active::before{opacity:1}
.dc-num{font-size:28px;font-weight:900;line-height:1;min-width:36px;text-align:center;flex-shrink:0;
  background:var(--ga);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.dc-info{flex:1;min-width:0}
.dc-title{font-size:13px;font-weight:700;color:var(--t1);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dc-sub{font-size:11px;color:var(--t3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dc-tags{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.dc-tag{font-size:10px;font-weight:700;padding:3px 8px;border-radius:var(--rp);
  background:rgba(255,255,255,.04);color:var(--t3)}
.dc-tag.purp{background:rgba(139,92,246,.1);color:#A78BFA}
.dc-tag.cyan{background:rgba(6,182,212,.1);color:#22D3EE}
.dc-done-mark{position:absolute;top:10px;right:10px;width:20px;height:20px;border-radius:50%;
  background:rgba(16,185,129,.15);border:1.5px solid #10B981;display:flex;align-items:center;justify-content:center}
.dc-done-mark svg{width:12px;height:12px;stroke:#34D399;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}

/* ===== STATS ===== */
.stats-hero{background:linear-gradient(135deg,rgba(139,92,246,.14) 0%,rgba(6,182,212,.06) 100%);
  border:1px solid rgba(139,92,246,.16);border-radius:var(--r);padding:24px 20px;text-align:center;
  margin-bottom:18px;position:relative;overflow:hidden}
.stats-hero::before{content:'';position:absolute;top:-40%;left:50%;transform:translateX(-50%);
  width:240px;height:240px;border-radius:50%;
  background:radial-gradient(circle,rgba(139,92,246,.15) 0%,transparent 70%)}
.sh-num{font-size:56px;font-weight:900;line-height:1;
  background:var(--ga);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  letter-spacing:-2px;position:relative;z-index:1}
.sh-label{font-size:14px;color:var(--t2);margin-top:6px;position:relative;z-index:1;font-weight:500}
.sh-progress{height:8px;background:rgba(255,255,255,.05);border-radius:var(--rp);
  margin:18px auto 0;max-width:280px;overflow:hidden;border:1px solid rgba(255,255,255,.05);position:relative;z-index:1}
.sh-progress-fill{height:100%;background:var(--ga);border-radius:var(--rp);
  box-shadow:0 0 20px rgba(96,165,250,.4);transition:width .8s cubic-bezier(.4,0,.2,1)}

/* V8: Stats grid gap 12px, card padding 18px */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
.stat-card{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.05);border-radius:var(--rs);
  padding:18px;display:flex;align-items:center;gap:14px;transition:all .2s;position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;border-radius:0 3px 3px 0}
.stat-card.purple::before{background:var(--purp2)}
.stat-card.cyan::before{background:var(--cyan2)}
.stat-card.green::before{background:#34D399}
.stat-card.orange::before{background:#FB923C}

/* V8: SVG icon containers with glow */
.sc-icon{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;position:relative}
.sc-icon svg{width:28px;height:28px}
.stat-card.purple .sc-icon{background:rgba(139,92,246,.12);
  box-shadow:0 0 16px rgba(139,92,246,.15)}
.stat-card.cyan .sc-icon{background:rgba(6,182,212,.12);
  box-shadow:0 0 16px rgba(6,182,212,.15)}
.stat-card.orange .sc-icon{background:rgba(249,115,22,.12);
  box-shadow:0 0 16px rgba(249,115,22,.15)}
.stat-card.green .sc-icon{background:rgba(16,185,129,.12);
  box-shadow:0 0 16px rgba(16,185,129,.15)}
.sc-num{font-size:22px;font-weight:800;color:var(--t1);letter-spacing:-.5px}
.sc-label{font-size:12px;color:var(--t3);font-weight:600;margin-top:2px}

/* V8: Stats section padding 18px, margin 14px */
.stats-section{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.05);
  border-radius:var(--rs);padding:18px;margin-bottom:14px}
.stats-section-title{font-size:15px;font-weight:700;color:var(--t1);margin-bottom:14px;
  display:flex;align-items:center;gap:8px}
.stats-section-title::before{content:'';width:3px;height:16px;border-radius:2px;background:var(--ga)}
.phase-item{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.phase-item:last-child{margin-bottom:0}
.phase-name{font-size:13px;font-weight:600;color:var(--t2);width:80px;flex-shrink:0}
.phase-bar{flex:1;height:6px;background:rgba(255,255,255,.05);border-radius:var(--rp);overflow:hidden}
.phase-bar-fill{height:100%;background:var(--ga);border-radius:var(--rp);transition:width .6s}
.phase-count{font-size:12px;font-weight:700;color:var(--t3);width:44px;text-align:right}

.recent-item{display:flex;align-items:center;gap:12px;padding:10px 0;
  border-bottom:1px solid rgba(255,255,255,.03)}
.recent-item:last-child{border-bottom:none;padding-bottom:0}
.recent-item:first-child{padding-top:0}
.ri-day{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-size:14px;font-weight:800;flex-shrink:0}
.ri-day.done{background:rgba(16,185,129,.1);color:#34D399}
.ri-day.pending{background:rgba(255,255,255,.03);color:var(--t3)}
.ri-title{flex:1;font-size:14px;font-weight:600;color:var(--t1);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.ri-status{font-size:12px;font-weight:700;color:var(--t3);flex-shrink:0}
.ri-status.done{color:#34D399}

.total-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.total-item{background:rgba(0,0,0,.15);border-radius:12px;padding:14px;text-align:center}
.total-num{font-size:22px;font-weight:800;color:var(--t1)}
.total-label{font-size:12px;color:var(--t3);margin-top:3px;font-weight:600}

/* ===== DAY DETAIL ===== */
.topbar{display:flex;align-items:center;gap:10px;padding:2px 0 14px;
  position:sticky;top:0;z-index:10;background:linear-gradient(180deg,#07090F 70%,transparent);
  padding-top:calc(var(--st)+8px)}
.back-btn{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.04);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;
  transition:all .15s;border:1px solid rgba(255,255,255,.05)}
.back-btn:active{transform:scale(.9);background:rgba(255,255,255,.08)}
.back-btn svg{width:18px;height:18px;stroke:var(--t2);fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.ptitle{font-size:17px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--t1)}
.pbadge{font-size:11px;font-weight:700;padding:5px 14px;border-radius:var(--rp);flex-shrink:0}
.pbadge.done{background:rgba(16,185,129,.1);color:#34D399;border:1px solid rgba(16,185,129,.15)}
.pbadge.pending{background:rgba(255,255,255,.04);color:var(--t3);border:1px solid rgba(255,255,255,.05)}

.dd-hero{background:linear-gradient(135deg,rgba(139,92,246,.12) 0%,rgba(6,182,212,.05) 100%);
  border:1px solid rgba(139,92,246,.14);border-radius:var(--r);padding:20px;margin-bottom:16px;position:relative;overflow:hidden}
.dd-hero::before{content:'';position:absolute;top:-40%;right:-10%;width:160px;height:160px;border-radius:50%;
  background:radial-gradient(circle,rgba(139,92,246,.15) 0%,transparent 70%)}
.dd-day{font-size:14px;font-weight:700;color:#60A5FA;margin-bottom:2px;position:relative;z-index:1}
.dd-title{font-size:22px;font-weight:800;color:var(--t1);letter-spacing:-.5px;position:relative;z-index:1}
.dd-sub{font-size:14px;color:var(--t3);margin-top:3px;position:relative;z-index:1}
.dd-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px;position:relative;z-index:1}
.dd-tag{font-size:11px;font-weight:700;padding:5px 12px;border-radius:var(--rp);
  background:rgba(255,255,255,.05);color:var(--t3);border:1px solid rgba(255,255,255,.05)}
.dd-tag.purp{background:rgba(139,92,246,.1);color:#A78BFA;border-color:rgba(139,92,246,.15)}
.dd-tag.cyan{background:rgba(6,182,212,.1);color:#22D3EE;border-color:rgba(6,182,212,.15)}
.dd-tag.org{background:rgba(249,115,22,.1);color:#FB923C;border-color:rgba(249,115,22,.15)}
.dd-tag.ylw{background:rgba(251,191,36,.1);color:#FBBF24;border-color:rgba(251,191,36,.15)}

/* Module cards */
.mc{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.05);border-radius:var(--rs);
  padding:18px;margin-bottom:12px;cursor:pointer;transition:all .2s;
  display:flex;align-items:center;gap:14px;position:relative;overflow:hidden}
.mc:active{transform:scale(.98);background:rgba(255,255,255,.04)}
.mc::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:0 3px 3px 0;opacity:0;transition:opacity .2s}
.mc:active::before{opacity:1}
.mc-icon{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;
  font-size:20px;flex-shrink:0}
.mc-icon.words{background:linear-gradient(135deg,rgba(139,92,246,.15),rgba(139,92,246,.05))}
.mc-icon.review{background:linear-gradient(135deg,rgba(6,182,212,.15),rgba(6,182,212,.05))}
.mc-icon.dialog{background:linear-gradient(135deg,rgba(249,115,22,.15),rgba(249,115,22,.05))}
.mc-icon.essay{background:linear-gradient(135deg,rgba(251,191,36,.15),rgba(251,191,36,.05))}
.mc-body{flex:1;min-width:0}
.mc-title{font-size:15px;font-weight:700;color:var(--t1)}
.mc-desc{font-size:12px;color:var(--t3);margin-top:2px}
.mc-arrow{color:var(--t3);font-size:14px;flex-shrink:0}

/* Action buttons */
.action-row{display:flex;gap:10px;margin-top:4px}
.btn{border-radius:var(--rs);padding:16px 20px;font-size:15px;font-weight:700;width:100%;
  letter-spacing:.2px;transition:all .15s;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  position:relative;overflow:hidden}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--ga);color:#fff;box-shadow:0 4px 20px rgba(96,165,250,.25)}
.btn.primary::after{content:'';position:absolute;top:0;left:0;right:0;bottom:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.2),transparent);
  background-size:50% 100%;animation:shimmer 3s infinite}
.btn.sec{background:rgba(255,255,255,.04);color:var(--t1);border:1px solid rgba(255,255,255,.08)}
.btn.sec:active{background:rgba(255,255,255,.06)}
.btn.green{background:var(--gd);color:#fff;box-shadow:0 4px 20px rgba(16,185,129,.25)}
.btn.cyan{background:var(--gc);color:#fff;box-shadow:0 4px 20px rgba(6,182,212,.25)}
.btn.orange{background:var(--go);color:#fff;box-shadow:0 4px 20px rgba(249,115,22,.25)}
.btn.sm{padding:10px 16px;font-size:13px;width:auto}
.btn-row{display:flex;gap:10px;margin-top:14px}
.btn-row .btn{flex:1}

/* ===== WORDS ===== */
.wc-mode{display:flex;gap:6px;margin-bottom:16px;
  background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05);border-radius:var(--rs);padding:4px}
.wc-mode button{flex:1;padding:10px 0;border-radius:10px;font-size:13px;font-weight:700;
  background:none;border:none;transition:all .2s;color:var(--t3)}
.wc-mode button.active{background:rgba(255,255,255,.06);color:var(--t1);
  box-shadow:0 2px 8px rgba(0,0,0,.2)}

.word-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:8px}
.word-nav .wn-progress{font-size:13px;color:var(--t3);font-weight:600}

/* Flip card */
.flip-c{perspective:1200px;cursor:pointer;margin-bottom:14px}
.flip-i{position:relative;width:100%;min-height:180px;
  transition:transform .6s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d}
.flip-c.flipped .flip-i{transform:rotateY(180deg)}
.flip-f,.flip-b{position:absolute;top:0;left:0;right:0;backface-visibility:hidden;
  border-radius:var(--r);padding:28px 20px;border:1px solid rgba(255,255,255,.06);
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  min-height:180px}
.flip-f{background:linear-gradient(135deg,rgba(139,92,246,.08) 0%,rgba(6,182,212,.04) 100%);
  border-color:rgba(139,92,246,.12);z-index:2;position:relative;overflow:hidden}
.flip-f::before{content:'';position:absolute;top:-30%;left:50%;transform:translateX(-50%);
  width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(139,92,246,.1) 0%,transparent 70%)}
.flip-f .ff-word{font-size:28px;font-weight:800;color:var(--t1);letter-spacing:-.5px;position:relative;z-index:1}
.flip-f .ff-phonetic{font-size:13px;color:var(--t3);margin-top:4px;position:relative;z-index:1;font-weight:500}
.flip-f .ff-hint{font-size:12px;color:var(--t4);margin-top:16px;position:relative;z-index:1}
.flip-f .ff-speak{width:48px;height:48px;border-radius:50%;background:rgba(139,92,246,.15);
  display:flex;align-items:center;justify-content:center;margin-top:16px;cursor:pointer;
  transition:all .15s;position:relative;z-index:1}
.flip-f .ff-speak:active{transform:scale(.9)}
.flip-f .ff-speak svg{width:20px;height:20px;stroke:#A78BFA;fill:none;stroke-width:2.5}
.ff-breakdown{margin-top:14px;position:relative;z-index:1;width:100%;max-width:280px}
.ff-bd-label{font-size:11px;color:var(--t4);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;text-align:center}
.ff-bd-parts{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px}
.ff-bd-part{padding:4px 10px;border-radius:var(--rp);background:rgba(139,92,246,.1);border:1px solid rgba(139,92,246,.15);
  font-size:13px;font-weight:600;color:#A78BFA;cursor:pointer;transition:all .15s}
.ff-bd-part:active{transform:scale(.92);background:rgba(139,92,246,.2)}
.ff-bd-sep{font-size:12px;color:var(--t4);font-weight:700}
.ff-bd-speak{display:block;margin:10px auto 0;padding:6px 16px;border-radius:var(--rp);
  background:linear-gradient(135deg,rgba(139,92,246,.15),rgba(6,182,212,.1));border:1px solid rgba(139,92,246,.2);
  font-size:12px;font-weight:700;color:#A78BFA;cursor:pointer;transition:all .15s}
.ff-bd-speak:active{transform:scale(.95)}
.flip-b{background:linear-gradient(135deg,rgba(6,182,212,.08) 0%,rgba(59,130,246,.04) 100%);
  border-color:rgba(6,182,212,.12);transform:rotateY(180deg);overflow:hidden}
.flip-b::before{content:'';position:absolute;top:-30%;left:50%;transform:translateX(-50%);
  width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(6,182,212,.1) 0%,transparent 70%)}
.flip-b .fb-trans{font-size:24px;font-weight:800;color:#22D3EE;position:relative;z-index:1}
.flip-b .fb-word{font-size:16px;color:var(--t2);margin-top:4px;position:relative;z-index:1;font-weight:500}

/* Word detail */
.wi{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.05);
  border-radius:var(--rs);padding:18px;margin-bottom:12px}
.wi-ex{padding:14px;background:rgba(0,0,0,.15);border-radius:10px;border-left:3px solid #60A5FA;font-size:13px;line-height:1.6}
.wi-ex .en{color:var(--t1);font-weight:500}
.wi-ex .cn{color:var(--t3);margin-top:3px;font-size:12px}
.wi-ex-hint{font-size:10px;color:var(--t4);margin-top:6px;text-align:right;opacity:.7}
.wi-ex{cursor:pointer;transition:background .15s}
.wi-ex:active{background:rgba(96,165,250,.08)}

/* Dictation */
.listen-card{text-align:center;padding:28px 20px;
  background:linear-gradient(135deg,rgba(139,92,246,.06) 0%,rgba(6,182,212,.03) 100%);
  border:1px solid rgba(139,92,246,.1);border-radius:var(--r);margin-bottom:14px}
.listen-card .lc-big{font-size:40px;margin-bottom:8px}
.listen-card .lc-hint{font-size:13px;color:var(--t3)}
.dict-in{width:100%;background:rgba(0,0,0,.2);border:2px solid rgba(255,255,255,.06);
  border-radius:var(--rs);padding:16px;color:var(--t1);font-size:20px;font-weight:700;
  text-align:center;letter-spacing:2px;margin:14px 0;transition:border-color .2s;
  font-family:'Plus Jakarta Sans',monospace}
.dict-in:focus{border-color:#60A5FA;outline:none}
.dict-in.correct{border-color:#10B981;background:rgba(16,185,129,.04)}
.dict-in.wrong{border-color:#EF4444;background:rgba(239,68,68,.04)}
.dict-hint{font-size:13px;color:var(--t3);text-align:center;margin:6px 0;min-height:20px;font-weight:500}

/* Quiz */
.qo{background:rgba(255,255,255,.02);border:2px solid rgba(255,255,255,.05);
  border-radius:var(--rs);padding:14px;margin-bottom:8px;font-size:14px;font-weight:600;
  cursor:pointer;transition:all .15s;text-align:center;color:var(--t1)}
.qo:active{background:rgba(255,255,255,.04);transform:scale(.98)}
.qo.correct{border-color:#10B981;background:rgba(16,185,129,.06);color:#34D399}
.qo.wrong{border-color:#EF4444;background:rgba(239,68,68,.06);color:#F87171}
.qo:disabled{cursor:default;opacity:.7}

.pbar{background:rgba(255,255,255,.04);border-radius:var(--rp);height:6px;overflow:hidden;
  border:1px solid rgba(255,255,255,.04)}
.pbar-fill{background:var(--ga);height:100%;border-radius:var(--rp);transition:width .5s cubic-bezier(.4,0,.2,1)}

/* Dialog */
.dl-scene{background:rgba(0,0,0,.12);border-radius:var(--rs);padding:16px;margin-bottom:16px;
  font-size:13px;color:var(--t2);text-align:center;border-left:3px solid #FB923C;line-height:1.6;
  font-weight:500}
.dl-line{display:flex;gap:12px;margin-bottom:14px;align-items:flex-start}
.dl-role{width:58px;padding:6px 0;border-radius:var(--rp);display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:700;flex-shrink:0;margin-top:1px;text-transform:uppercase}
.dl-role.you{background:rgba(139,92,246,.12);color:#A78BFA}
.dl-role.other{background:rgba(6,182,212,.12);color:#22D3EE}
.dl-text{flex:1;font-size:14px;line-height:1.55;color:var(--t1);cursor:pointer;
  padding:12px 14px;border-radius:10px;background:rgba(255,255,255,.015);transition:all .1s}
.dl-text:active{background:rgba(255,255,255,.04)}
.dl-text .cn{font-size:12px;color:var(--t3);margin-top:3px}

/* Essay */
.essay-card{background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.05);
  border-radius:var(--r);padding:20px;margin-bottom:16px}
.es-title{font-size:18px;font-weight:800;margin-bottom:3px;
  background:var(--ga);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.es-title-cn{font-size:13px;color:var(--t3);margin-bottom:16px}
.es-item{padding:12px 14px;margin-bottom:8px;background:rgba(0,0,0,.12);border-radius:10px;
  font-size:14px;line-height:1.55;cursor:pointer;transition:all .15s;border-left:3px solid transparent}
.es-item:active{background:rgba(0,0,0,.2)}
.es-item.active{border-left-color:#22D3EE;background:rgba(6,182,212,.06)}
.es-item .en{color:var(--t1)}
.es-item .cn{font-size:12px;color:var(--t3);margin-top:3px}

/* ===== V8: Word Lookup Tooltip ===== */
.wl-word{cursor:pointer;border-radius:4px;transition:background .15s;padding:1px 2px;margin:-1px -2px}
.wl-word:active{background:rgba(139,92,246,.15)}
.wl-word.lookuped{background:rgba(139,92,246,.12)}
.wl-tip{position:fixed;z-index:300;background:rgba(15,23,42,.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:16px 18px;min-width:200px;max-width:280px;
  box-shadow:0 12px 40px rgba(0,0,0,.5);animation:scaleIn .2s ease;pointer-events:auto}
.wl-tip-word{font-size:18px;font-weight:800;color:var(--t1);margin-bottom:2px}
.wl-tip-trans{font-size:14px;font-weight:600;color:#22D3EE;margin-bottom:8px}
.wl-tip-example{font-size:12px;color:var(--t3);line-height:1.5;border-top:1px solid rgba(255,255,255,.06);
  padding-top:8px}
.wl-tip-example .en{color:var(--t2)}
.wl-tip-example .cn{color:var(--t3);font-size:11px;margin-top:2px}
.wl-tip-actions{display:flex;gap:8px;margin-top:10px}
.wl-tip-btn{padding:6px 14px;border-radius:var(--rp);font-size:12px;font-weight:700;
  background:rgba(139,92,246,.12);color:#A78BFA;border:1px solid rgba(139,92,246,.15);cursor:pointer}
.wl-tip-btn:active{background:rgba(139,92,246,.2)}
.wl-tip-notfound{font-size:13px;color:var(--t3);font-style:italic}

/* Empty state */
.empty-state{text-align:center;padding:60px 20px;color:var(--t3);font-size:14px}
.empty-state .es-icon{font-size:48px;margin-bottom:12px}
.empty-state .es-title{font-size:18px;font-weight:700;color:var(--t1);margin-bottom:4px}
.empty-state .es-desc{font-size:13px;color:var(--t3)}

/* Toast */
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  background:rgba(15,23,42,.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  color:#fff;padding:14px 24px;border-radius:14px;font-size:14px;font-weight:600;z-index:999;
  opacity:0;transition:all .25s cubic-bezier(.4,0,.2,1);pointer-events:none;text-align:center;
  max-width:280px;border:1px solid rgba(255,255,255,.08);
  box-shadow:0 20px 60px rgba(0,0,0,.5)}
.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}

/* Reminder banner */
.reminder-banner{background:linear-gradient(135deg,rgba(249,115,22,.1) 0%,rgba(251,191,36,.06) 100%);
  border:1px solid rgba(249,115,22,.15);border-radius:var(--rs);padding:14px 16px;margin-bottom:14px;
  display:flex;align-items:center;gap:10px;cursor:pointer;transition:all .15s}
.reminder-banner:active{transform:scale(.98)}
.reminder-icon{font-size:18px;flex-shrink:0}
.reminder-text{flex:1}
.reminder-text .rt-title{font-size:13px;font-weight:700;color:#FB923C}
.reminder-text .rt-desc{font-size:12px;color:var(--t3);margin-top:2px}

/* Swipe hint */
.swipe-hint{text-align:center;font-size:11px;color:var(--t4);margin-bottom:12px;
  display:flex;align-items:center;justify-content:center;gap:4px;opacity:.7}
.swipe-hint svg{width:12px;height:12px;stroke:var(--t4);fill:none;stroke-width:2}

</style>
</head>
<body>

<div id="app">
  <svg style="position:absolute;width:0;height:0">
    <defs>
      <linearGradient id="navGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#A78BFA"/>
        <stop offset="50%" style="stop-color:#60A5FA"/>
        <stop offset="100%" style="stop-color:#22D3EE"/>
      </linearGradient>
      <!-- V8: Stat icon gradients -->
      <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#C084FC"/>
        <stop offset="100%" style="stop-color:#8B5CF6"/>
      </linearGradient>
      <linearGradient id="reviewGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#22D3EE"/>
        <stop offset="100%" style="stop-color:#06B6D4"/>
      </linearGradient>
      <linearGradient id="dialogGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#FB923C"/>
        <stop offset="100%" style="stop-color:#F97316"/>
      </linearGradient>
      <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" style="stop-color:#34D399"/>
        <stop offset="100%" style="stop-color:#10B981"/>
      </linearGradient>
    </defs>
  </svg>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- Word lookup tooltip -->
  <div class="wl-tip" id="wl-tip" style="display:none"></div>

  <!-- ===== HOME ===== -->
  <div class="page active" id="pg-home">
    <div class="hero-card">
      <div class="hero-top">
        <div>
          <div class="hero-num"><span id="hm-done">0</span><small>/39</small></div>
          <div class="hero-label">已完成天数</div>
        </div>
        <div style="text-align:right">
          <div class="hero-pct"><span id="hm-pct">0</span>%</div>
          <div style="font-size:12px;color:var(--t3);font-weight:600">完成进度</div>
        </div>
      </div>
      <div class="hero-bar">
        <div class="hero-bar-fill" id="hm-pbar" style="width:0%"></div>
      </div>
    </div>

    <div class="stats-quick">
      <div class="sq-item"><div class="sq-num">569</div><div class="sq-label">新词</div></div>
      <div class="sq-item"><div class="sq-num">2354</div><div class="sq-label">复习词</div></div>
      <div class="sq-item"><div class="sq-num">542</div><div class="sq-label">句数</div></div>
    </div>

    <div class="section-header">
      <div class="section-title">学习计划</div>
    </div>

    <div id="home-cards"></div>
  </div>

  <!-- ===== STATS ===== -->
  <div class="page" id="pg-stats">
    <div style="padding:calc(var(--st)+6px) 0 6px;font-size:24px;font-weight:800;
      background:linear-gradient(135deg,#E8EDF5 0%,#94A3B8 100%);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
      letter-spacing:-.5px">学习统计</div>
    <div id="stats-content"></div>
  </div>

  <!-- ===== DAY DETAIL ===== -->
  <div class="page" id="pg-day">
    <div class="topbar">
      <div class="back-btn" onclick="goHome()"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></div>
      <div class="ptitle" id="dd-title"></div>
      <div class="pbadge" id="dd-badge"></div>
    </div>
    <div id="dd-content"></div>
  </div>

  <!-- ===== WORDS ===== -->
  <div class="page" id="pg-words">
    <div class="topbar">
      <div class="back-btn" onclick="goDay()"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></div>
      <div class="ptitle" id="w-title"></div>
      <div style="font-size:12px;color:var(--t3);font-weight:600" id="w-counter"></div>
    </div>
    <div class="wc-mode" id="w-mode-bar"></div>
    <div id="w-content"></div>
  </div>

  <!-- ===== DIALOG ===== -->
  <div class="page" id="pg-dlg">
    <div class="topbar">
      <div class="back-btn" onclick="goDay()"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></div>
      <div class="ptitle">口语练习</div>
      <div></div>
    </div>
    <div id="d-content"></div>
  </div>

  <!-- ===== ESSAY ===== -->
  <div class="page" id="pg-essay">
    <div class="topbar">
      <div class="back-btn" onclick="goDay()"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></div>
      <div class="ptitle">阅读理解</div>
      <div></div>
    </div>
    <div id="e-content"></div>
  </div>

  <!-- ===== NAV ===== -->
  <div class="nav">
    <div class="nav-btn active" id="nav-home" onclick="switchNav('home')">
      <svg viewBox="0 0 24 24"><path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 01-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 01-1 1h-2z"/></svg>
      <span>学习</span>
    </div>
    <div class="nav-btn" id="nav-stats" onclick="switchNav('stats')">
      <svg viewBox="0 0 24 24"><path d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6m6 0h6m-6 0V9a2 2 0 012-2h2a2 2 0 012 2v10m6 0v-4a2 2 0 00-2-2h-2a2 2 0 00-2 2v4"/></svg>
      <span>统计</span>
    </div>
  </div>
</div>

s and ID.","exampleCn":"请出示您的登机牌和身份证件。"},{"word":"departure","translation":"出发","exampleEn":"The departure time is 3:30 PM.","exampleCn":"出发时间是下午3:30。"},{"word":"arrival","translation":"到达","exampleEn":"What is the arrival time in New York?","exampleCn":"到达纽约是几点？"},{"word":"terminal","translation":"航站楼","exampleEn":"International flights depart from Terminal 3.","exampleCn":"国际航班从3号航站楼出发。"},{"word":"gate","translation":"登机口","exampleEn":"Gate 22 will open 30 minutes before departure.","exampleCn":"22号登机口将在起飞前30分钟开放。"},{"word":"baggage / luggage","translation":"行李","exampleEn":"How many pieces of baggage can I check in?","exampleCn":"我可以托运几件行李？"},{"word":"carry-on","translation":"随身行李","exampleEn":"You can bring one carry-on bag and one personal item.","exampleCn":"您可以携带一件随身行李和一件个人物品。"},{"word":"check-in","translation":"值机/办理登机","exampleEn":"Online check-in opens 24 hours before the flight.","exampleCn":"网上值机在起飞前24小时开放。"},{"word":"passport","translation":"护照","exampleEn":"Make sure your passport is valid for at least 6 months.","exampleCn":"确保您的护照有效期至少还有6个月。"},{"word":"visa","translation":"签证","exampleEn":"Do I need a visa to enter this country?","exampleCn":"进入这个国家需要签证吗？"},{"word":"customs","translation":"海关","exampleEn":"You need to declare goods at customs.","exampleCn":"您需要在海关申报物品。"},{"word":"security check","translation":"安检","exampleEn":"Please remove your laptop from your bag for security check.","exampleCn":"请将笔记本电脑从包里取出进行安检。"},{"word":"flight","translation":"航班","exampleEn":"Your flight has been delayed by one hour.","exampleCn":"您的航班延误了一小时。"},{"word":"airline","translation":"航空公司","exampleEn":"Which airline are you flying with?","exampleCn":"您乘坐的是哪家航空公司？"},{"word":"delay","translation":"延误","exampleEn":"The flight delay is due to bad weather.","exampleCn":"航班延误是由于恶劣天气。"},{"word":"reservation","translation":"预订","exampleEn":"I have a reservation under the name Wang.","exampleCn":"我有一个以王姓预订的房间。"},{"word":"front desk / reception","translation":"前台","exampleEn" n":"Your seat is in row thirteen.","exampleCn":"您的座位在第13排。"},{"word":"twenty","translation":"二十","exampleEn":"The taxi costs about twenty dollars.","exampleCn":"出租车大约20美元。"},{"word":"thirty","translation":"三十","exampleEn":"We have a thirty-minute layover.","exampleCn":"我们有30分钟的中转时间。"},{"word":"fifty","translation":"五十","exampleEn":"The hotel is about fifty meters away.","exampleCn":"酒店大约50米远。"},{"word":"hundred","translation":"百","exampleEn":"The deposit is one hundred dollars.","exampleCn":"押金是100美元。"},{"word":"thousand","translation":"千","exampleEn":"The ticket costs two thousand yuan.","exampleCn":"机票两千元。"},{"word":"What time is it?","translation":"几点了？","exampleEn":"Excuse me, what time is it now?","exampleCn":"打扰一下，现在几点了？"},{"word":"a.m. / p.m.","translation":"上午 / 下午","exampleEn":"The flight departs at 8 a.m.","exampleCn":"航班上午8点出发。"},{"word":"half past","translation":"……点半","exampleEn":"Let's meet at half past three.","exampleCn":"我们三点半见。"},{"word":"quarter","translation":"一刻钟 / 四分之一","exampleEn":"It's a quarter to ten.","exampleCn":"现在差一刻十点。"},{"word":"How long does it take?","translation":"需要多长时间？","exampleEn":"How long does it take to get to the airport?","exampleCn":"到机场需要多长时间？"},{"word":"schedule","translation":"日程 / 时刻表","exampleEn":"Let me check the train schedule.","exampleCn":"让我查一下火车时刻表。"},{"word":"on time","translation":"准时","exampleEn":"The flight arrived right on time.","exampleCn":"航班准时到达。"}],"dialog":[{"role":"YOU","textEn":"Excuse me, how do I buy a ticket to downtown?","textCn":"打扰一下，去市中心怎么买票？"},{"role":"STAFF","textEn":"You can use the machine over there. Just select \"Single Trip,\" then tap your destination on the map. It costs four dollars.","textCn":"你可以用那边那台机器。选\"单程票\"，然后在地图上点你的目的地。四块钱。"},{"role":"YOU","textEn":"Got it. Also — which platform do I go to? I don't want to get on the wrong train.","textCn":"明白了。还有——我去哪个站台？我不想坐错方向。"},{"role":"STAFF","textEn":"Take the blue line, Platform 2. Go straight down the stairs, then turn left. You'll see the sign for Platform 2. Trains run every five minutes.","textCn":"坐蓝线，2号站台。下了楼梯直走然后左转，你会看到2号站台的指示牌。列车每五分钟一班。"},{"role":"YOU","textEn":"Thanks! One last thing — do I need to transfer?","textCn":"谢谢！最后一个问题——需要换乘吗？"},{"role":"STAFF","textEn":"No transfer needed. It's about a twenty-five-minute ride. Get off at Central Station — that's the last stop on this line.","textCn":"不需要换乘。大约25分钟车程。在中央车站下车——那是这条线的终点站。"},{"role":"YOU","textEn":"Perfect, thanks a lot for your help!","textCn":"太好了，非常感谢你的帮助！"}],"essay":null},{"day":6,"dayTitle":"公共交通出行","daySubtitle":"","phase":"Phase 1","newWordsCount":15,"reviewWordsCount":45,"dialogCount":12,"totalWords":90,"newWords":[{"word":"one-way ticket","translation":"单程票","exampleEn":"A one-way ticket to London, please.","exampleCn":"一张去伦敦的单程票。"},{"word":"round-trip ticket","translation":"往返票","exampleEn":"Is a round-trip ticket cheaper than two one-way tickets?","exampleCn":"往返票比两张单程票便宜吗？"},{"word":"ticket office","translation":"售票处","exampleEn":"The ticket office is next to the main entrance.","exampleCn":"售票处在主入口旁边。"},{"word":"fare","translation":"车费 / 票价","exampleEn":"How much is the fare to the city center?","exampleCn":"到市中心的票价是多少？"},{"word":"platform","translation":"站台","exampleEn":"Your train departs from platform 5.","exampleCn":"您的火车从5号站台出发。"},{"word":"timetable","translation":"时刻表","exampleEn":"You can check the timetable online or at the station.","exampleCn":"可以在网上或车站查询时刻表。"},{"word":"express","translation":"快车","exampleEn":"The express train takes about 40 minutes.","exampleCn":"快车大约需要40分钟。"},{"word":"local train","translation":"慢车 / 普通车","exampleEn":"The local train stops at every station along the way.","exampleCn":"慢车沿途每站都停。"},{"word":"delayed","translation":"晚点的 / 延误的","exampleEn":"The 9:15 train is delayed by 20 minutes.","exampleCn":"9点15的火车晚点20分钟。"},{"word":"transfer","translation":"换乘","exampleEn":"You need to transfer at Central Station.","exampleCn":"你需要在中央车站换乘。"},{"word":"exit","translation":"出口","exampleEn": :"","exampleCn":""}],"dialog":[{"role":"Traveler","textEn":"Hi, I'd like a ticket to Manchester, please.","textCn":""},{"role":"Clerk","textEn":"One-way or round-trip?","textCn":""},{"role":"Traveler","textEn":"One-way, please. How much is the fare?","textCn":""},{"role":"Clerk","textEn":"A one-way ticket is 45 pounds. When would you like to travel?","textCn":""},{"role":"Traveler","textEn":"Today, around 2 p.m. Is there an express train?","textCn":""},{"role":"Clerk","textEn":"Yes. The 2:05 express gets you there in 50 minutes. It departs from platform 7.","textCn":""},{"role":"Traveler","textEn":"Do I need to transfer?","textCn":""},{"role":"Clerk","textEn":"No, it's a direct train. Would you like first class or standard class?","textCn":""},{"role":"Traveler","textEn":"Standard class is fine. One ticket, please.","textCn":""},{"role":"Clerk","textEn":"Here you go. Don't forget to validate your ticket before boarding. The exit is on the left side of the platform.","textCn":""},{"role":"Traveler","textEn":"Thank you. Is the train usually on time?","textCn":""},{"role":"Clerk","textEn":"Yes, it's pretty reliable. Enjoy your trip!","textCn":""}],"essay":{"title":"A Train Ride in a New City","titleCn":"","sentences":[{"en":"Taking public transportation in a new city can be confusing at first.","cn":"在一个新城市乘坐公共交通一开始可能会有些困惑。"},{"en":"You need to find the right platform and check the timetable.","cn":"你需要找到正确的站台并查看时刻表。"},{"en":"Sometimes you have to transfer at a big station.","cn":"有时候你得在一个大站换乘。"},{"en":"But once you figure it out it is actually quite simple.","cn":"但一旦弄明白了其实很简单。"},{"en":"I like watching people get on and off at every stop.","cn":"我喜欢看人们在每一站上上下下。"},{"en":"You look out the window and see the city change block by block.","cn":"你望向窗外看着城市一个街区一个街区地变化。"},{"en":"The announcement calls out the next exit for the museum.","cn":"广播报出下一站是博物馆出口。"},{"en":"This is my stop.","cn":"我到站了。"},{"en":"I grab my bag and step off into a brand new adventure.","cn":"我抓起包踏出车门走进一段 cist","textEn":"Sorry, cash or card only. But you can keep the receipt for your insurance claim.","textCn":"抱歉，只收现金或刷卡。但你可以保留收据去报保险。"}],"essay":{"title":"A Trip to the Pharmacy","titleCn":"去药房的一次经历","sentences":[{"en":"Last summer I was traveling in London when I woke up with a terrible headache and a fever.","cn":"去年夏天我在伦敦旅行时醒来发现头疼发烧"},{"en":"I had no idea where to find medicine in a foreign country.","cn":"我不知道在外国哪里能买到药"},{"en":"I asked the hotel front desk and they pointed me to a pharmacy around the corner.","cn":"问了酒店前台他们给我指了拐角处的一家药房"},{"en":"The pharmacist was very kind — she asked about my symptoms in simple English.","cn":"药剂师人很好她用简单的英语问我症状"},{"en":"I told her I also had a cough and felt very tired.","cn":"我告诉她我还有咳嗽感觉非常疲惫"},{"en":"She gave me an over-the-counter painkiller and told me to rest and drink lots of water.","cn":"她给我开了非处方止痛药让我好好休息多喝水"},{"en":"Two days later I felt much better and could enjoy the rest of my trip.","cn":"两天后我感觉好多了能够继续享受剩下的旅程"},{"en":"That experience taught me how important it is to know some basic health words when traveling.","cn":"那次经历教会我旅行时懂得一些基础健康词汇有多重要"}]}},{"day":12,"dayTitle":"看医生进阶","daySubtitle":"","phase":"Phase 1","newWordsCount":15,"reviewWordsCount":60,"dialogCount":15,"totalWords":180,"newWords":[{"word":"body","translation":"身体","exampleEn":"My whole body feels tired and sore.","exampleCn":""},{"word":"sore throat","translation":"喉咙痛","exampleEn":"I have a really sore throat — it hurts to swallow.","exampleCn":""},{"word":"cold","translation":"感冒","exampleEn":"I think I caught a cold on the flight.","exampleCn":""},{"word":"flu","translation":"流感","exampleEn":"The flu is going around the city this week.","exampleCn":""},{"word":"toothache","translation":"牙痛","exampleEn":"I have a terrible toothache. Can you recommend a dentist?","exampleCn":""},{"word":"appointment","translation":"预约 (医生)","exampleEn":"I'd like to make an appointment to see a doctor.","exampleCn":""},{"word":"temperature","translation":"温度 / 发烧","exam urance?","textCn":"可以。你们接受旅行保险吗？"},{"role":"Receptionist","textEn":"Yes, we do. Please bring your insurance card and passport.","textCn":"是的，接受。请带上您的保险卡和护照。"},{"role":"Doctor 医生","textEn":"Hello Mr. Wang. What brings you in today?","textCn":"你好王先生。今天哪里不舒服？"},{"role":"You","textEn":"I have had a sore throat for three days, a fever since yesterday, and I think I caught a cold on the flight.","textCn":"我喉咙疼三天了，昨晚开始发烧，我觉得在飞机上感冒了。"},{"role":"Doctor","textEn":"Let me take your temperature and check your blood pressure.","textCn":"先量一下体温，测一下血压。"},{"role":"Doctor","textEn":"It looks like a flu, not just a common cold. I'll prescribe some antibiotics — take one pill twice a day for five days.","textCn":"看起来像流感，不只是普通感冒。我给你开点抗生素——每天两次，每次一片，吃五天。"},{"role":"You","textEn":"Got it. Should I rest at the hotel?","textCn":"明白。我需要回酒店休息吗？"},{"role":"Doctor","textEn":"Yes, please rest for two or three days, drink lots of water, and stay hydrated. You should fully recover within a week.","textCn":"是的，请休息两三天，多喝水，保持补水。一周之内你应该能完全恢复。"},{"role":"You","textEn":"Thank you, doctor. Where do I pick up the medicine?","textCn":"谢谢医生。哪里能拿药？"},{"role":"Doctor","textEn":"Just across the hall — there's a pharmacy at the clinic. If it gets worse, call an ambulance or come back to the emergency room.","textCn":"就在大厅对面，诊所有药房。如果变严重了，叫救护车或直接回来挂急诊。"}],"essay":{"title":"Seeing a Doctor Abroad","titleCn":"在国外看医生","sentences":[{"en":"On the second day of my trip, I woke up with a sore throat and a high fever.","cn":"旅行第二天我醒来时喉咙很疼而且发高烧"},{"en":"I knew it was not just a common cold, so I decided to see a doctor.","cn":"我知道这不只是普通感冒所以决定去看医生"},{"en":"I called a local clinic and made an appointment for 11:30 in the morning.","cn":"我打电话给当地一家诊所预约了上午十一点半"},{"en":"The receptionist asked for my name, date of birth, and whether I had travel insurance.","cn":"接待员问了姓名出生日期还有是否买了旅行保险"},{"en":"At the clinic, the doctor took my temperature and checked my blood pressure.","cn":"在诊所医生给我量了体温测了血压"},{"en":"She said I had the flu and "},{"role":"LISA","textEn":"I enjoy music and photography. How about you?","textCn":""},{"role":"YOU","textEn":"I love hiking and swimming. I also like reading books.","textCn":""},{"role":"LISA","textEn":"That sounds great. Do you play any sport?","textCn":""},{"role":"YOU","textEn":"Sometimes I play basketball. What about music?","textCn":""},{"role":"LISA","textEn":"I play the guitar. I also go to concerts.","textCn":""},{"role":"YOU","textEn":"I went to a music festival last year. It was amazing.","textCn":""},{"role":"LISA","textEn":"Wow, I would love to go to a festival too.","textCn":""},{"role":"YOU","textEn":"Do you like dancing or cooking?","textCn":""},{"role":"LISA","textEn":"I like dancing but I am not good at cooking.","textCn":""},{"role":"YOU","textEn":"I can cook a little. Maybe we can cook together sometime.","textCn":""},{"role":"LISA","textEn":"Sure! I am sure it will be fun.","textCn":""}],"essay":{"title":"A Travel Hobby","titleCn":"旅行爱好","sentences":[{"en":"I love traveling because I can try new hobbies.","cn":"我喜欢旅行因为我可以尝试新的爱好。"},{"en":"Last month I went hiking in the mountains.","cn":"上个月我去山里徒步。"},{"en":"I took many photos with my camera.","cn":"我用相机拍了很多照片。"},{"en":"Swimming in the lake was so relaxing.","cn":"在湖里游泳很放松。"},{"en":"I also visited a small concert in the evening.","cn":"晚上我还去听了一场小型音乐会。"},{"en":"The music was beautiful and the people were friendly.","cn":"音乐很美人们也很友好。"},{"en":"I bought a book about local history.","cn":"我买了一本关于当地历史的书。"},{"en":"Cooking local food is another hobby of mine.","cn":"烹饪当地食物也是我的爱好之一。"},{"en":"Travel makes every hobby more interesting.","cn":"旅行让每个爱好都变得更有趣。"},{"en":"I can't wait for my next trip.","cn":"我迫不及待想开始下一次旅行。"}]}},{"day":24,"dayTitle":"日常需求与请求帮助","daySubtitle":"Asking for Help & Daily Needs","phase":"Phase 2","newWordsCount":15,"reviewWordsCount":120,"dialogCount":12,"totalWords":360,"newWords":[{"word":"help","translation":"帮助","exampleEn":"","exampleCn":""},{"word":"need","translation":"需要","exa Cn":""}],"essay":{"title":"Asking for Help","titleCn":"请求帮助","sentences":[{"en":"Traveling alone, I often need to ask for help.","cn":"一个人旅行时，我经常需要请求帮助。"},{"en":"Yesterday I forgot my phone charger.","cn":"昨天我忘带手机充电器了。"},{"en":"So I went into a small shop and said excuse me.","cn":"于是我走进一家小店说了句打扰一下。"},{"en":"I said I need a new charger for my phone.","cn":"我说我需要一个新的手机充电器。"},{"en":"The shop assistant was very friendly and helpful.","cn":"店员非常友好也很乐意帮忙。"},{"en":"She lent me a pen to write my hotel address.","cn":"她借给我一支笔写酒店地址。"},{"en":"I also asked if they could deliver a package for me.","cn":"我还问她们能不能帮我寄一个包裹。"},{"en":"She said the service was free of charge.","cn":"她说这项服务是免费的。"},{"en":"I bought a new bag because the old one was broken.","cn":"我买了一个新包因为旧的坏了。"},{"en":"I am so grateful for the kind service in this city.","cn":"我很感激这座城市的友好服务。"}]}},{"day":25,"dayTitle":"时间安排与做计划","daySubtitle":"Schedules & Making Plans","phase":"Phase 2","newWordsCount":15,"reviewWordsCount":120,"dialogCount":17,"totalWords":375,"newWords":[{"word":"schedule","translation":"时间表 / 日程","exampleEn":"","exampleCn":""},{"word":"appointment","translation":"预约 / 约会","exampleEn":"","exampleCn":""},{"word":"plan","translation":"计划 / 打算","exampleEn":"","exampleCn":""},{"word":"arrange","translation":"安排 / 组织","exampleEn":"","exampleCn":""},{"word":"confirm","translation":"确认 / 证实","exampleEn":"","exampleCn":""},{"word":"cancel","translation":"取消","exampleEn":"","exampleCn":""},{"word":"postpone","translation":"推迟 / 延期","exampleEn":"","exampleCn":""},{"word":"available","translation":"有空的 / 可用的","exampleEn":"","exampleCn":""},{"word":"convenient","translation":"方便的","exampleEn":"","exampleCn":""},{"word":"calendar","translation":"日历","exampleEn":"","exampleCn":""},{"word":"deadline","translation":"截止日期","exampleEn":"","exampleCn":""},{"word":"remind","translation":"提醒","exampleEn":"","exampleCn":""},{"word":"reserve","translation":"预订 / 保留","exampleEn":"","exampleCn":""},{"word":"reschedule","transl ole":"ANNA","textEn":"It was wonderful. I have so many unforgettable memories.","textCn":""},{"role":"YOU","textEn":"What is your favorite place there?","textCn":""},{"role":"ANNA","textEn":"I really loved Kyoto. The old temples left a deep impression on me.","textCn":""},{"role":"YOU","textEn":"Would you recommend it to me?","textCn":""},{"role":"ANNA","textEn":"Definitely. I suggest you go in spring when the weather is nice.","textCn":""},{"role":"YOU","textEn":"Can you share some travel advice?","textCn":""},{"role":"ANNA","textEn":"Sure. My advice is to book hotels and restaurants ahead of time.","textCn":""},{"role":"YOU","textEn":"What is your opinion of the local food?","textCn":""},{"role":"ANNA","textEn":"It was delicious. Now I prefer Japanese food to fast food.","textCn":""},{"role":"YOU","textEn":"Did you write a review online?","textCn":""},{"role":"ANNA","textEn":"Yes. I shared my story and some photos on a travel website.","textCn":""},{"role":"YOU","textEn":"I hope my trip will be as good as yours.","textCn":""},{"role":"ANNA","textEn":"I am sure you will have a great experience.","textCn":""}],"essay":{"title":"An Unforgettable Trip","titleCn":"一次难忘的旅行","sentences":[{"en":"My trip to the mountain village was unforgettable.","cn":"我去山村的旅行很难忘。"},{"en":"The scenery was wonderful and the air was fresh.","cn":"风景很美空气很清新。"},{"en":"I want to share my story with you.","cn":"我想和你分享我的故事。"},{"en":"First I hiked to the top early in the morning.","cn":"首先我一大早徒步到山顶。"},{"en":"The view from there left a deep impression on me.","cn":"那里的景色给我留下了深刻的印象。"},{"en":"Local people were friendly and gave me useful advice.","cn":"当地人很友好给了我很多有用的建议。"},{"en":"They recommended a small restaurant with great food.","cn":"他们推荐了一家很棒的小餐馆。"},{"en":"I tried dishes that I had never eaten before.","cn":"我尝到了以前从没吃过的菜。"},{"en":"My favorite was the homemade soup.","cn":"我最喜欢的是家常汤。"},{"en":"I will always prefer this kind of quiet travel.","cn":"我会一直更喜欢这种安静的旅行。"},{"en":"I wrote a review online s is fully booked for today.","textCn":""},{"role":"YOU","textEn":"I'd like to make a reservation for the express train, please.","textCn":""},{"role":"AGENT","textEn":"Of course. May I have your name and passport number?","textCn":""},{"role":"YOU","textEn":"Here you are. Could you confirm the departure time and terminal?","textCn":""},{"role":"AGENT","textEn":"Confirmed. Departure is at 8:00 a.m. from Terminal 2. Please arrive 30 minutes early.","textCn":""},{"role":"YOU","textEn":"Thank you. If there is a delay, will you notify me?","textCn":""},{"role":"AGENT","textEn":"Yes, we will send a text message to your phone. Have a great trip!","textCn":""}],"essay":{"title":"Booking a Flight","titleCn":"预订航班","sentences":[{"en":"When I plan to travel far, I usually book a flight first.","cn":"当我计划去远方旅行时，我通常会先预订航班。"},{"en":"I compare different airlines to find a reasonable price.","cn":"我会比较不同航空公司，找到合理的价格。"},{"en":"A direct flight saves time, but it may cost more money.","cn":"直飞航班省时间，但可能更贵。"},{"en":"I prefer an economy seat near the window for short trips.","cn":"短途旅行我喜欢经济舱靠窗的座位。"},{"en":"Before I confirm the reservation, I check the departure time carefully.","cn":"确认预订之前，我会仔细核对出发时间。"},{"en":"Sometimes bad weather causes a delay, so I arrive at the terminal early.","cn":"有时恶劣天气会造成延误，所以我会提前到达航站楼。"},{"en":"A shuttle bus can take me from the airport to the city center.","cn":"机场摆渡车可以把我送到市中心。"},{"en":"Good planning makes the journey much easier.","cn":"良好的计划让旅程轻松很多。"}]}},{"day":29,"dayTitle":"租车自驾与导航","daySubtitle":"Car Rental & Road Navigation","phase":"Phase 2","newWordsCount":15,"reviewWordsCount":30,"dialogCount":16,"totalWords":435,"newWords":[{"word":"rent","translation":"租用","exampleEn":"","exampleCn":""},{"word":"return","translation":"归还","exampleEn":"","exampleCn":""},{"word":"fuel","translation":"汽油","exampleEn":"","exampleCn":""},{"word":"tank","translation":"油箱","exampleEn":"","exampleCn":""},{"word":"highway","translation":"高速公路","exampleEn":"","exampleCn":""},{"word":"toll","translation":"过路费","exampleEn":"","exampleCn":""},{"word":"parking","translation":"停车","exampleEn":"","exampleCn":""},{"word":"intersection","translation":"十字路口","exampleEn":"","exampleCn":""},{"word":"roundabout","translation":"环岛","exampleEn":"","exampleCn":""},{"word":"speed limit","translation":"限速","exampleEn":"","exampleCn":""},{"word":"traffic light","translation":"红绿灯","exampleEn":"","exampleCn":""},{"word":"accident","translation":"事故","exampleEn":"","exampleCn":""},{"word":"license","translation":"驾照","exampleEn":"","exampleCn":""},{"word":"insurance","translation":"保险","exampleEn":"","exampleCn":""},{"word":"navigation","translation":"导航","exampleEn":"","exampleCn":""}],"reviewWords":[{"word":"destination","translation":"目的地","exampleEn":"","exampleCn":""},{"word":"itinerary","translation":"行程路线","exampleEn":"","exampleCn":""},{"word":"budget","translation":"预算","exampleEn":"","exampleCn":""},{"word":"option","translation":"选项","exampleEn":"","exampleCn":""},{"word":"alternative","translation":"替代方案","exampleEn":"","exampleCn":""},{"word":"worthwhile","translation":"值得的","exampleEn":"","exampleCn":""},{"word":"explore","translation":"探索","exampleEn":"","exampleCn":""},{"word":"local","translation":"当地的","exampleEn":"","exampleCn":""},{"word":"authentic","translation":"地道的","exampleEn":"","exampleCn":""},{"word":"guidebook","translation":"旅行指南","exampleEn":"","exampleCn":""},{"word":"must-see","translation":"必看的","exampleEn":"","exampleCn":""},{"word":"reasonable","translation":"合理的","exampleEn":"","exampleCn":""},{"word":"avoid","translation":"避免","exampleEn":"","exampleCn":""},{"word":"peak season","translation":"旺季","exampleEn":"","exampleCn":""},{"word":"off-season","translation":"淡季","exampleEn":"","exampleCn":""},{"word":"flight","translation":"航班","exampleEn":"","exampleCn":""},{"word":"airline","translation":"航空公司","exampleEn":"","exampleCn":""},{"word":"ferry","translation":"渡轮","exampleEn":"","exampleCn":""},{"word":"cruise","translation":"游轮","exampleEn":"","exampleCn":""},{"word":"shuttle","translation":"摆渡车","exampleEn":"","exampleCn":""},{"word":"rental","translation":"租车","exampleEn":"","exampleCn":""},{"word":"route","translation":"路线","exampleEn":"","exampleCn":""},{"word":"express","translation":"快车","exampleEn":"","exampleCn":""},{"word":"direct","translation":"直达的","exampleEn":"","exampleCn":""},{"word":"departure","translation":"出发","exampleEn":"","exampleCn":""},{"word":"arrival","translation":"到达","exampleEn":"","exampleCn":""},{"word":"reservation","translation":"预订","exampleEn":"","exampleCn":""},{"word":"economy","translation":"经济舱","exampleEn":"","exampleCn":""},{"word":"business","translation":"商务舱","exampleEn":"","exampleCn":""},{"word":"delay","translation":"延误","exampleEn":"","exampleCn":""}],"dialog":[{"role":"AGENT","textEn":"Welcome! How can I help you with your rental today?","textCn":""},{"role":"YOU","textEn":"I'd like to rent a car for three days. Do you have a compact car available?","textCn":""},{"role":"AGENT","textEn":"Yes, we do. May I see your driver's license and a credit card for the deposit?","textCn":""},{"role":"YOU","textEn":"Here you are. Does the price include insurance?","textCn":""},{"role":"AGENT","textEn":"Basic insurance is included. Full coverage costs an extra 15 dollars per day.","textCn":""},{"role":"YOU","textEn":"I'll take the full coverage. Do I need to return it with a full tank?","textCn":""},{"role":"AGENT","textEn":"Yes, please return it with a full tank of fuel to avoid any extra charges.","textCn":""},{"role":"YOU","textEn":"Got it. One more thing — is there a navigation system in the car?","textCn":""},{"role":"AGENT","textEn":"Yes, all our cars come with built-in GPS navigation. Here are your keys.","textCn":""},{"role":"YOU","textEn":"I'm driving to the national park. Should I take the highway?","textCn":""},{"role":"LOCAL","textEn":"Yes, the highway is faster, but watch out for the toll road after the intersection.","textCn":""},{"role":"YOU","textEn":"What is the speed limit on the highway?","textCn":""},{"role":"LOCAL","textEn":"The speed limit is 100 kilometers per hour. Be careful at the roundabout ahead.","textCn":""},{"role":"YOU","textEn":"Thanks for the tip. Is there free parking near the park entrance?","textCn":""},{"role":"LOCAL","textEn":"Yes, there is a large parking lot on the left. Just follow the traffic lights.","textCn":""},{"role":"YOU","textEn":"Perfect. I'll set the navigation and hit the road. Thanks a lot!","textCn":""}],"essay":{"title":"Renting a Car on a Trip","titleCn":"旅行中租一辆车","sentences":[{"en":"Last summer I rented a car for the first time on a trip.","cn":"去年夏天，我第一次在旅行中租了一辆车。"},{"en":"I walked into the rental office and showed my license.","cn":"我走进租车办公室，出示了我的驾照。"},{"en":"The agent asked if I wanted full insurance coverage.","cn":"工作人员问我是否需要全额保险。"},{"en":"I said yes, because I wanted to feel safe on the road.","cn":"我说要，因为我想在路上有安全感。"},{"en":"She reminded me to return the car with a full tank of fuel.","cn":"她提醒我还车时要加满油箱。"},{"en":"I set the GPS navigation and headed for the highway.","cn":"我设好导航，开上了高速公路。"},{"en":"The speed limit was clear, and I followed it carefully.","cn":"限速标识很清楚，我小心翼翼地遵守着。"},{"en":"At the roundabout I almost took the wrong exit.","cn":"在环岛处我差点走错了出口。"},{"en":"But the friendly voice of the navigation guided me back.","cn":"但导航友善的声音把我带回了正轨。"},{"en":"When I arrived, I found a free parking lot near the beach.","cn":"到达后，我在海滩附近找到了免费停车场。"},{"en":"Driving yourself gives you so much freedom to explore.","cn":"自驾让你有太多自由去探索。"},{"en":"Next time I travel, I will rent a car without hesitation.","cn":"下次旅行，我会毫不犹豫地租一辆车。"}]}},{"day":30,"dayTitle":"住宿设施与客房服务","daySubtitle":"Hotel Facilities & Room Service","phase":"Phase 2","newWordsCount":15,"reviewWordsCount":60,"dialogCount":20,"totalWords":450,"newWords":[{"word":"suite","translation":"套房","exampleEn":"","exampleCn":""},{"word":"balcony","translation":"阳台","exampleEn":"","exampleCn":""},{"word":"vie YOU","textEn":"Perfect. One more thing — is there a laundry service?","textCn":""},{"role":"DESK","textEn":"Yes, just put your clothes in the bag in the closet. Laundry is returned the next day.","textCn":""},{"role":"YOU","textEn":"The thermostat in my room seems stuck. Can someone check it?","textCn":""},{"role":"DESK","textEn":"I'll send maintenance right away. Sorry for the inconvenience.","textCn":""},{"role":"YOU","textEn":"No problem. By the way, the balcony view is amazing.","textCn":""},{"role":"DESK","textEn":"I'm glad you like it! That's one of our best suite rooms. Enjoy your stay.","textCn":""},{"role":"YOU","textEn":"Could I also borrow an iron? I need to press my shirt for tomorrow.","textCn":""},{"role":"DESK","textEn":"Sure, I'll have housekeeping bring an iron along with your extra pillow and blanket.","textCn":""},{"role":"YOU","textEn":"That's wonderful. Are the towels in the bathroom replaced daily?","textCn":""},{"role":"DESK","textEn":"Yes, fresh towels are provided every day as part of our standard amenities.","textCn":""}],"essay":{"title":"A Comfortable Hotel Stay","titleCn":"舒适的酒店住宿","sentences":[{"en":"After checking into my hotel, I wanted to make my room more comfortable.","cn":"入住酒店后，我想让房间更舒适一些。"},{"en":"I called the front desk and asked for an extra pillow and blanket.","cn":"我打电话给前台，要了一个额外的枕头和毯子。"},{"en":"Housekeeping brought them up within fifteen minutes.","cn":"客房服务在十五分钟内就送来了。"},{"en":"I found the safe in the closet and locked my passport inside.","cn":"我在衣柜里找到了保险箱，把护照锁了进去。"},{"en":"The minibar had some snacks, but I made tea with the kettle instead.","cn":"迷你吧里有些零食，但我用电热水壶泡了茶。"},{"en":"The balcony had an amazing view of the ocean.","cn":"阳台上有绝佳的海景视野。"},{"en":"I adjusted the thermostat to make the room warmer.","cn":"我调了调温控器，让房间暖和一些。"},{"en":"Later, I sent some shirts for laundry service.","cn":"后来，我送了几件衬衫去洗衣服务。"},{"en":"The amenities in the bathroom included soft towels and soap.","cn":"浴室里的便利设施包括柔软的毛巾和肥皂。"},{"en":"I felt relaxed and ready for a good night's sleep.","cn":"我感到放松，准备好美美睡一觉了。"},{"en":"A good hotel makes travel so much more enjoyable.","cn":"一家好酒店让旅行更加愉快。"}]}},{"day":31,"dayTitle":"处理问题与投诉","daySubtitle":"Dealing with Problems & Complaints","phase":"Phase 2","newWordsCount":15,"reviewWordsCount":45,"dialogCount":16,"totalWords":465,"newWords":[{"word":"complaint","translation":"投诉","exampleEn":"","exampleCn":""},{"word":"complain","translation":"投诉 抱怨","exampleEn":"","exampleCn":""},{"word":"issue","translation":"问题","exampleEn":"","exampleCn":""},{"word":"broken","translation":"损坏的","exampleEn":"","exampleCn":""},{"word":"dirty","translation":"脏的","exampleEn":"","exampleCn":""},{"word":"noise","translation":"噪音","exampleEn":"","exampleCn":""},{"word":"leak","translation":"漏水","exampleEn":"","exampleCn":""},{"word":"faulty","translation":"有故障的","exampleEn":"","exampleCn":""},{"word":"unacceptable","translation":"不可接受的","exampleEn":"","exampleCn":""},{"word":"replace","translation":"替换","exampleEn":"","exampleCn":""},{"word":"refund","translation":"退款","exampleEn":"","exampleCn":""},{"word":"apologize","translation":"道歉","exampleEn":"","exampleCn":""},{"word":"inconvenience","translation":"不便","exampleEn":"","exampleCn":""},{"word":"resolve","translation":"解决","exampleEn":"","exampleCn":""},{"word":"manager","translation":"经理","exampleEn":"","exampleCn":""}],"reviewWords":[{"word":"flight","translation":"航班","exampleEn":"","exampleCn":""},{"word":"airline","translation":"航空公司","exampleEn":"","exampleCn":""},{"word":"ferry","translation":"渡轮","exampleEn":"","exampleCn":""},{"word":"cruise","translation":"游轮","exampleEn":"","exampleCn":""},{"word":"shuttle","translation":"摆渡车","exampleEn":"","exampleCn":""},{"word":"rental","translation":"租车","exampleEn":"","exampleCn":""},{"word":"route","translation":"路线","exampleEn":"","exampleCn":""},{"word":"express","translation":"快车","exampleEn":"","exampleCn":""},{"word":"direct","translation":"直达的","exampleEn":"","exampleCn":""},{"word":"d ermostat","translation":"温控器","exampleEn":"","exampleCn":""},{"word":"kettle","translation":"电热水壶","exampleEn":"","exampleCn":""},{"word":"amenity","translation":"便利设施","exampleEn":"","exampleCn":""},{"word":"extra","translation":"额外的","exampleEn":"","exampleCn":""},{"word":"pillow","translation":"枕头","exampleEn":"","exampleCn":""},{"word":"blanket","translation":"毯子","exampleEn":"","exampleCn":""},{"word":"towel","translation":"毛巾","exampleEn":"","exampleCn":""}],"dialog":[{"role":"YOU","textEn":"Excuse me, I have a complaint about my room.","textCn":""},{"role":"DESK","textEn":"I'm sorry to hear that. What is the issue?","textCn":""},{"role":"YOU","textEn":"The air conditioner is faulty and the room is too hot.","textCn":""},{"role":"DESK","textEn":"I apologize for the inconvenience. We'll send someone to fix it.","textCn":""},{"role":"YOU","textEn":"Also, there's a leak in the bathroom and the floor is dirty and wet.","textCn":""},{"role":"DESK","textEn":"That's unacceptable. I'll arrange a room change for you right away.","textCn":""},{"role":"YOU","textEn":"Can I get a refund for tonight since the room was not in good condition?","textCn":""},{"role":"DESK","textEn":"I understand. Let me call the manager to resolve this.","textCn":""},{"role":"YOU","textEn":"The noise from the street is also very loud. I couldn't sleep at all.","textCn":""},{"role":"DESK","textEn":"We can replace your room with one on a higher floor. The view is better too.","textCn":""},{"role":"YOU","textEn":"That sounds good. I hope this can be resolved quickly.","textCn":""},{"role":"DESK","textEn":"Absolutely. We'll move you to a clean suite immediately.","textCn":""},{"role":"YOU","textEn":"What about the broken lamp by the bed?","textCn":""},{"role":"DESK","textEn":"Housekeeping will replace it in your new room. Again, I apologize for the trouble.","textCn":""},{"role":"YOU","textEn":"Thank you. I just want a comfortable stay.","textCn":""},{"role":"DESK","textEn":"We'll make sure of that. Here's your new room key — room 508, ocean view.","textCn":""}],"essay":{"title":"Dealing with Hotel Problems","titleCn":"在酒店遇到问题","sentences":[{"en":"When I arrived at my hotel, the room was not what I expected.","cn":"到达酒店时，房间和预期不一样。"},{"en":"The air conditioner was faulty and the room felt too hot.","cn":"空调有故障，房间太热了。"},{"en":"There was also a leak in the bathroom and the floor was dirty.","cn":"浴室还有漏水，地板是脏的。"},{"en":"I went to the front desk to make a complaint.","cn":"我去前台投诉。"},{"en":"The staff apologized for the inconvenience.","cn":"工作人员为不便道歉。"},{"en":"They said this was unacceptable and promised to resolve the issue.","cn":"他们说这是不可接受的，并承诺解决问题。"},{"en":"The manager offered to replace my room with a better one.","cn":"经理提出给我换一间更好的房间。"},{"en":"I asked if I could get a refund for the night.","cn":"我问能否退款。"},{"en":"The noise from outside was also a big problem.","cn":"外面的噪音也是个大问题。"},{"en":"They moved me to a suite on a higher floor.","cn":"他们把我搬到了更高层的套房。"},{"en":"The new room was clean and quiet.","cn":"新房间干净又安静。"},{"en":"Problems happen, but good service makes everything better.","cn":"问题总会发生，但好的服务让一切变好。"},{"en":"Always speak up when something is wrong.","cn":"有问题时一定要说出来。"}]}},{"day":32,"dayTitle":"旅途社交与礼仪","daySubtitle":"Travel Etiquette & Social Customs","phase":"Phase 2","newWordsCount":15,"reviewWordsCount":75,"dialogCount":14,"totalWords":480,"newWords":[{"word":"etiquette","translation":"礼仪 礼节","exampleEn":"","exampleCn":""},{"word":"greeting","translation":"问候 打招呼","exampleEn":"","exampleCn":""},{"word":"handshake","translation":"握手","exampleEn":"","exampleCn":""},{"word":"bow","translation":"鞠躬","exampleEn":"","exampleCn":""},{"word":"gesture","translation":"手势 示意动作","exampleEn":"","exampleCn":""},{"word":"custom","translation":"习俗 风俗","exampleEn":"","exampleCn":""},{"word":"tradition","translation":"传统 惯例","exampleEn":"","exampleCn":""},{"word":"taboo","translation":"禁忌 忌讳","exampleEn":"","exampleCn":""},{"word":"appropriate","translation":"合适的 适当的", n":"保险箱","exampleEn":"","exampleCn":""},{"word":"laundry","translation":"洗衣服务","exampleEn":"","exampleCn":""},{"word":"iron","translation":"熨斗","exampleEn":"","exampleCn":""},{"word":"thermostat","translation":"温控器","exampleEn":"","exampleCn":""},{"word":"kettle","translation":"电热水壶","exampleEn":"","exampleCn":""},{"word":"amenity","translation":"便利设施","exampleEn":"","exampleCn":""},{"word":"extra","translation":"额外的","exampleEn":"","exampleCn":""},{"word":"pillow","translation":"枕头","exampleEn":"","exampleCn":""},{"word":"blanket","translation":"毯子","exampleEn":"","exampleCn":""},{"word":"towel","translation":"毛巾","exampleEn":"","exampleCn":""},{"word":"complaint","translation":"投诉","exampleEn":"","exampleCn":""},{"word":"complain","translation":"投诉 抱怨","exampleEn":"","exampleCn":""},{"word":"issue","translation":"问题","exampleEn":"","exampleCn":""},{"word":"broken","translation":"损坏的","exampleEn":"","exampleCn":""},{"word":"dirty","translation":"脏的","exampleEn":"","exampleCn":""},{"word":"noise","translation":"噪音","exampleEn":"","exampleCn":""},{"word":"leak","translation":"漏水","exampleEn":"","exampleCn":""},{"word":"faulty","translation":"有故障的","exampleEn":"","exampleCn":""},{"word":"unacceptable","translation":"不可接受的","exampleEn":"","exampleCn":""},{"word":"replace","translation":"替换","exampleEn":"","exampleCn":""},{"word":"refund","translation":"退款","exampleEn":"","exampleCn":""},{"word":"apologize","translation":"道歉","exampleEn":"","exampleCn":""},{"word":"inconvenience","translation":"不便","exampleEn":"","exampleCn":""},{"word":"resolve","translation":"解决","exampleEn":"","exampleCn":""},{"word":"manager","translation":"经理","exampleEn":"","exampleCn":""}],"dialog":[{"role":"YOU","textEn":"Hi, I just arrived here. Can you tell me about local etiquette?","textCn":""},{"role":"GUIDE","textEn":"Of course! Greetings are important here. People usually bow slightly instead of shaking hands.","textCn":""},{"role":"YOU","textEn":"Oh, I didn't know that. What about tipping?","textCn":""},{"role":"GUIDE","textEn":"Tipping is not expected here. It can even be considered offensive in some places.","textCn":""},{"role":"YOU","textEn":"Really? Are there any taboos I should avoid?","textCn":""},{"role":"GUIDE","textEn":"Yes, pointing with your index finger is a taboo. Use your whole hand instead.","textCn":""},{"role":"YOU","textEn":"What about the dress code? I want to visit the temple tomorrow.","textCn":""},{"role":"GUIDE","textEn":"You need to wear appropriate clothing. No shorts or sleeveless shirts inside the temple.","textCn":""},{"role":"YOU","textEn":"I want to be respectful during my visit. Is there anything else?","textCn":""},{"role":"GUIDE","textEn":"Being punctual for appointments is appreciated. Common courtesy is always welcome.","textCn":""},{"role":"YOU","textEn":"So this country has many different customs from mine.","textCn":""},{"role":"GUIDE","textEn":"That's right. Every tradition has its own meaning. Understanding them shows respect.","textCn":""},{"role":"YOU","textEn":"I'll be careful with my gestures. Thanks for the advice!","textCn":""},{"role":"GUIDE","textEn":"No problem! Enjoy your trip and embrace the local culture.","textCn":""}],"essay":{"title":"Travel Etiquette Matters","titleCn":"旅行礼仪很重要","sentences":[{"en":"When traveling to a new country, understanding local etiquette is very important.","cn":"去一个新国家旅行时，了解当地礼仪非常重要。"},{"en":"Every place has its own customs and traditions.","cn":"每个地方都有自己的习俗和传统。"},{"en":"In Japan, people bow to greet each other, while in Western countries, a handshake is common.","cn":"在日本人们鞠躬互相问候，而在西方国家握手更常见。"},{"en":"Some gestures that are normal at home can be offensive in other cultures.","cn":"一些在家里正常的手势，在其他文化中可能是冒犯的。"},{"en":"Pointing with your finger may be a taboo in certain places.","cn":"用手指指东西在某些地方可能是禁忌。"},{"en":"Tipping rules vary greatly between countries.","cn":"各国的小费规则差别很大。"},{"en":"In some places, tipping is expected, while in others, it can be rude.","cn":"有些地方要给小费，有些地方给小费反而粗鲁。"},{"en":"When visiting religious sites, always follow the dress code and be respectful.","cn":"参观宗教场所时一定要遵守着装要求并保持尊重。"},{"en":"Being punctual shows courtesy to others.","cn":"守时体现对他人的礼貌。"},{"en":"Learning local customs helps you avoid mistakes and makes your trip more enjoyable.","cn":"了解当地习俗帮你避免犯错让你的旅行更愉快。"}]}},{"day":33,"dayTitle":"文化差异与跨文化交流","daySubtitle":"Cultural Differences & Cross-Cultural Communication","phase":"Phase 2","newWordsCount":15,"reviewWordsCount":75,"dialogCount":14,"totalWords":495,"newWords":[{"word":"culture","translation":"文化","exampleEn":"","exampleCn":""},{"word":"diverse","translation":"多样的 多元的","exampleEn":"","exampleCn":""},{"word":"difference","translation":"差异 区别","exampleEn":"","exampleCn":""},{"word":"misunderstand","translation":"误解 误会","exampleEn":"","exampleCn":""},{"word":"stereotype","translation":"刻板印象","exampleEn":"","exampleCn":""},{"word":"adapt","translation":"适应","exampleEn":"","exampleCn":""},{"word":"adjust","translation":"调整 适应","exampleEn":"","exampleCn":""},{"word":"communicate","translation":"交流 沟通","exampleEn":"","exampleCn":""},{"word":"body language","translation":"肢体语言","exampleEn":"","exampleCn":""},{"word":"polite","translation":"礼貌的","exampleEn":"","exampleCn":""},{"word":"rude","translation":"粗鲁的 无礼的","exampleEn":"","exampleCn":""},{"word":"norm","translation":"规范 准则","exampleEn":"","exampleCn":""},{"word":"acceptable","translation":"可接受的","exampleEn":"","exampleCn":""},{"word":"expect","translation":"期望 预期","exampleEn":"","exampleCn":""},{"word":"embrace","translation":"拥抱 接纳","exampleEn":"","exampleCn":""}],"reviewWords":[{"word":"post office","translation":"邮局","exampleEn":"","exampleCn":""},{"word":"stamp","translation":"邮票","exampleEn":"","exampleCn":""},{"word":"envelope","translation":"信封","exampleEn":"","exampleCn":""},{"word":"letter","translation":"信件","exampleEn":"","exampleCn":""},{"word":"postcard","translation":"明信片","exampleEn":"","exampleCn":""},{"word":"package","translation":"包裹",
