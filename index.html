YOU","textEn":"Perfect. One more thing — is there a laundry service?","textCn":""},{"role":"DESK","textEn":"Yes, just put your clothes in the bag in the closet. Laundry is returned the next day.","textCn":""},{"role":"YOU","textEn":"The thermostat in my room seems stuck. Can someone check it?","textCn":""},{"role":"DESK","textEn":"I'll send maintenance right away. Sorry for the inconvenience.","textCn":""},{"role":"YOU","textEn":"No problem. By the way, the balcony view is amazing.","textCn":""},{"role":"DESK","textEn":"I'm glad you like it! That's one of our best suite rooms. Enjoy your stay.","textCn":""},{"role":"YOU","textEn":"Could I also borrow an iron? I need to press my shirt for tomorrow.","textCn":""},{"role":"DESK","textEn":"Sure, I'll have housekeeping bring an iron along with your extra pillow and blanket.","textCn":""},{"role":"YOU","textEn":"That's wonderful. Are the towels in the bathroom replaced daily?","textCn":""},{"role":"DESK","textEn":"Yes, fresh towels are provided every day as part of our standard amenities.","textCn":""}],"essay":{"title":"A Comfortable Hotel Stay","titleCn":"舒适的酒店住宿","sentences":[{"en":"After checking into my hotel, I wanted to make my room more comfortable.","cn":"入住酒店后，我想让房间更舒适一些。"},{"en":"I called the front desk and asked for an extra pillow and blanket.","cn":"我打电话给前台，要了一个额外的枕头和毯子。"},{"en":"Housekeeping brought them up within fifteen minutes.","cn":"客房服务在十五分钟内就送来了。"},{"en":"I found the safe in the closet and locked my passport inside.","cn":"我在衣柜里找到了保险箱，把护照锁了进去。"},{"en":"The minibar had some snacks, but I made tea with the kettle instead.","cn":"迷你吧里有些零食，但我用电热水壶泡了茶。"},{"en":"The balcony had an amazing view of the ocean.","cn":"阳台上有绝佳的海景视野。"},{"en":"I adjusted the thermostat to make the room warmer.","cn":"我调了调温控器，让房间暖和一些。"},{"en":"Later, I sent some shirts for laundry service.","cn":"后来，我送了几件衬衫去洗衣服务。"},{"en":"The amenities in the bathroom included soft towels and soap.","cn":"浴室里的便利设施包括柔软的毛巾和肥皂。"},{"en":"I felt relaxed and ready for a good night's sleep.","cn":"我感到放松，准备好美美睡一觉了。"},{"en":"A good hotel makes travel so much more enjoyable.","cn":"一家好酒店让旅行更加愉快。"}]}},{"day":31,"dayTitle":"处理问题与投诉","daySubtitle":"Dealing with Problems & Complaints","phase":"Phase 2","newWordsCount":15,"reviewWordsCount":45,"dialogCount":16,"totalWords":465,"newWords":[{"word":"complaint","translation":"投诉","exampleEn":"","exampleCn":""},{"word":"complain","translation":"投诉 抱怨","exampleEn":"","exampleCn":""},{"word":"issue","translation":"问题","exampleEn":"","exampleCn":""},{"word":"broken","translation":"损坏的","exampleEn":"","exampleCn":""},{"word":"dirty","translation":"脏的","exampleEn":"","exampleCn":""},{"word":"noise","translation":"噪音","exampleEn":"","exampleCn":""},{"word":"leak","translation":"漏水","exampleEn":"","exampleCn":""},{"word":"faulty","translation":"有故障的","exampleEn":"","exampleCn":""},{"word":"unacceptable","translation":"不可接受的","exampleEn":"","exampleCn":""},{"word":"replace","translation":"替换","exampleEn":"","exampleCn":""},{"word":"refund","translation":"退款","exampleEn":"","exampleCn":""},{"word":"apologize","translation":"道歉","exampleEn":"","exampleCn":""},{"word":"inconvenience","translation":"不便","exampleEn":"","exampleCn":""},{"word":"resolve","translation":"解决","exampleEn":"","exampleCn":""},{"word":"manager","translation":"经理","exampleEn":"","exampleCn":""}],"reviewWords":[{"word":"flight","translation":"航班","exampleEn":"","exampleCn":""},{"word":"airline","translation":"航空公司","exampleEn":"","exampleCn":""},{"word":"ferry","translation":"渡轮","exampleEn":"","exampleCn":""},{"word":"cruise","translation":"游轮","exampleEn":"","exampleCn":""},{"word":"shuttle","translation":"摆渡车","exampleEn":"","exampleCn":""},{"word":"rental","translation":"租车","exampleEn":"","exampleCn":""},{"word":"route","translation":"路线","exampleEn":"","exampleCn":""},{"word":"express","translation":"快车","exampleEn":"","exampleCn":""},{"word":"direct","translation":"直达的","exampleEn":"","exampleCn":""},{"word":"d t. Here's your new room key — room 508, ocean view.","textCn":""}],"essay":{"title":"Dealing with Hotel Problems","titleCn":"在酒店遇到问题","sentences":[{"en":"When I arrived at my hotel, the room was not what I expected.","cn":"到达酒店时，房间和预期不一样。"},{"en":"The air conditioner was faulty and the room felt too hot.","cn":"空调有故障，房间太热了。"},{"en":"There was also a leak in the bathroom and the floor was dirty.","cn":"浴室还有漏水，地板是脏的。"},{"en":"I went to the front desk to make a complaint.","cn":"我去前台投诉。"},{"en":"The staff apologized for the inconvenience.","cn":"工作人员为不便道歉。"},{"en":"They said this was unacceptable and promised to resolve the issue.","cn":"他们说这是不可接受的，并承诺解决问题。"},{"en":"The manager offered to replace my room with a better one.","cn":"经理提出给我换一间更好的房间。"},{"en":"I asked if I could get a refund for the night.","cn":"我问能否退款。"},{"en":"The noise from outside was also a big problem.","cn":"外面的噪音也是个大问题。"},{"en":"They moved me to a suite on a higher floor.","cn":"他们把我搬到了更高层的套房。"},{"en":"The new room was clean and quiet.","cn":"新房间干净又安静。"},{"en":"Problems happen, but good service makes everything better.","cn":"问题总会发生，但好的服务让一切变好。"},{"en":"Always speak up when something is wrong.","cn":"有问题时一定要说出来。"}]}},{"day":32,"dayTitle":"旅途社交与礼仪","daySubtitle":"Travel Etiquette & Social Customs","phase":"Phase 2","newWordsCount":15,"reviewWordsCount":75,"dialogCount":14,"totalWords":480,"newWords":[{"word":"etiquette","translation":"礼仪 礼节","exampleEn":"","exampleCn":""},{"word":"greeting","translation":"问候 打招呼","exampleEn":"","exampleCn":""},{"word":"handshake","translation":"握手","exampleEn":"","exampleCn":""},{"word":"bow","translation":"鞠躬","exampleEn":"","exampleCn":""},{"word":"gesture","translation":"手势 示意动作","exampleEn":"","exampleCn":""},{"word":"custom","translation":"习俗 风俗","exampleEn":"","exampleCn":""},{"word":"tradition","translation":"传统 惯例","exampleEn":"","exampleCn":""},{"word":"taboo","translation":"禁忌 忌讳","exampleEn":"","exampleCn":""},{"word":"appropriate","translation":"合适的 适当的", n":"保险箱","exampleEn":"","exampleCn":""},{"word":"laundry","translation":"洗衣服务","exampleEn":"","exampleCn":""},{"word":"iron","translation":"熨斗","exampleEn":"","exampleCn":""},{"word":"thermostat","translation":"温控器","exampleEn":"","exampleCn":""},{"word":"kettle","translation":"电热水壶","exampleEn":"","exampleCn":""},{"word":"amenity","translation":"便利设施","exampleEn":"","exampleCn":""},{"word":"extra","translation":"额外的","exampleEn":"","exampleCn":""},{"word":"pillow","translation":"枕头","exampleEn":"","exampleCn":""},{"word":"blanket","translation":"毯子","exampleEn":"","exampleCn":""},{"word":"towel","translation":"毛巾","exampleEn":"","exampleCn":""},{"word":"complaint","translation":"投诉","exampleEn":"","exampleCn":""},{"word":"complain","translation":"投诉 抱怨","exampleEn":"","exampleCn":""},{"word":"issue","translation":"问题","exampleEn":"","exampleCn":""},{"word":"broken","translation":"损坏的","exampleEn":"","exampleCn":""},{"word":"dirty","translation":"脏的","exampleEn":"","exampleCn":""},{"word":"noise","translation":"噪音","exampleEn":"","exampleCn":""},{"word":"leak","translation":"漏水","exampleEn":"","exampleCn":""},{"word":"faulty","translation":"有故障的","exampleEn":"","exampleCn":""},{"word":"unacceptable","translation":"不可接受的","exampleEn":"","exampleCn":""},{"word":"replace","translation":"替换","exampleEn":"","exampleCn":""},{"word":"refund","translation":"退款","exampleEn":"","exampleCn":""},{"word":"apologize","translation":"道歉","exampleEn":"","exampleCn":""},{"word":"inconvenience","translation":"不便","exampleEn":"","exampleCn":""},{"word":"resolve","translation":"解决","exampleEn":"","exampleCn":""},{"word":"manager","translation":"经理","exampleEn":"","exampleCn":""}],"dialog":[{"role":"YOU","textEn":"Hi, I just arrived here. Can you tell me about local etiquette?","textCn":""},{"role":"GUIDE","textEn":"Of course! Greetings are important here. People usually bow slightly instead of shaking hands.","textCn":""},{"role":"YOU","textEn":"Oh, I didn't know that. What about tipping?","textCn":""},{"role":"GUIDE","textEn":"Tipping is not expected here. It can even be considered offensive in some places.","textCn":""},{"role":"YOU","textEn":"Really? Are there any taboos I should avoid?","textCn":""},{"role":"GUIDE","textEn":"Yes, pointing with your index finger is a taboo. Use your whole hand instead.","textCn":""},{"role":"YOU","textEn":"What about the dress code? I want to visit the temple tomorrow.","textCn":""},{"role":"GUIDE","textEn":"You need to wear appropriate clothing. No shorts or sleeveless shirts inside the temple.","textCn":""},{"role":"YOU","textEn":"I want to be respectful during my visit. Is there anything else?","textCn":""},{"role":"GUIDE","textEn":"Being punctual for appointments is appreciated. Common courtesy is always welcome.","textCn":""},{"role":"YOU","textEn":"So this country has many different customs from mine.","textCn":""},{"role":"GUIDE","textEn":"That's right. Every tradition has its own meaning. Understanding them shows respect.","textCn":""},{"role":"YOU","textEn":"I'll be careful with my gestures. Thanks for the advice!","textCn":""},{"role":"GUIDE","textEn":"No problem! Enjoy your trip and embrace the local culture.","textCn":""}],"essay":{"title":"Travel Etiquette Matters","titleCn":"旅行礼仪很重要","sentences":[{"en":"When traveling to a new country, understanding local etiquette is very important.","cn":"去一个新国家旅行时，了解当地礼仪非常重要。"},{"en":"Every place has its own customs and traditions.","cn":"每个地方都有自己的习俗和传统。"},{"en":"In Japan, people bow to greet each other, while in Western countries, a handshake is common.","cn":"在日本人们鞠躬互相问候，而在西方国家握手更常见。"},{"en":"Some gestures that are normal at home can be offensive in other cultures.","cn":"一些在家里正常的手势，在其他文化中可能是冒犯的。"},{"en":"Pointing with your finger may be a taboo in certain places.","cn":"用手指指东西在某些地方可能是禁忌。"},{"en":"Tipping rules vary greatly between countries.","cn":"各国的小费规则差别很大。"},{"en":"In some places, tipping is expected, while in others, it can be rude.","cn":"有些地方要给小费，有些地 xampleCn":""},{"word":"gesture","translation":"手势 示意动作","exampleEn":"","exampleCn":""},{"word":"custom","translation":"习俗 风俗","exampleEn":"","exampleCn":""},{"word":"tradition","translation":"传统 惯例","exampleEn":"","exampleCn":""},{"word":"taboo","translation":"禁忌 忌讳","exampleEn":"","exampleCn":""},{"word":"appropriate","translation":"合适的 适当的","exampleEn":"","exampleCn":""},{"word":"offensive","translation":"冒犯的 无礼的","exampleEn":"","exampleCn":""},{"word":"respectful","translation":"尊重的 恭敬的","exampleEn":"","exampleCn":""},{"word":"courtesy","translation":"礼貌 谦恭","exampleEn":"","exampleCn":""},{"word":"tip","translation":"小费 给小费","exampleEn":"","exampleCn":""},{"word":"dress code","translation":"着装要求","exampleEn":"","exampleCn":""},{"word":"punctual","translation":"准时的 守时的","exampleEn":"","exampleCn":""}],"dialog":[{"role":"YOU","textEn":"I noticed people here don't make eye contact when talking. Is that part of the culture?","textCn":""},{"role":"LOCAL","textEn":"Yes, in our culture, too much eye contact can be seen as rude or aggressive.","textCn":""},{"role":"YOU","textEn":"That's so interesting! In my country, eye contact shows respect and honesty.","textCn":""},{"role":"LOCAL","textEn":"Cultural differences can be surprising. That's why travel is so eye-opening.","textCn":""},{"role":"YOU","textEn":"I want to avoid misunderstandings. Are there other norms I should know?","textCn":""},{"role":"LOCAL","textEn":"When someone gives you a gift, don't open it right away. It's considered polite to wait.","textCn":""},{"role":"YOU","textEn":"Oh, I almost made that mistake yesterday! I need to adapt quickly.","textCn":""},{"role":"LOCAL","textEn":"Don't worry too much. People appreciate it when visitors try to understand our customs.","textCn":""},{"role":"YOU","textEn":"What about body language? Are there gestures I should avoid?","textCn":""},{"role":"LOCAL","textEn":"Avoid pointing with one finger. Use your whole hand if you need to gesture toward something.","textCn":""},{"role":"YOU","textEn":"I'll keep that in mind. I want to be polite and respectful during my trip.","textCn":""},{"role":"LOCAL","textEn":"That attitude is exactly what makes a good traveler. Embrace the differences!","textCn":""},{"role":"YOU","textEn":"Have you met other travelers who struggled with cultural adjustment?","textCn":""},{"role":"LOCAL","textEn":"Many do at first. But those who communicate openly and ask questions usually adapt well.","textCn":""}],"essay":{"title":"Embracing Cultural Differences","titleCn":"拥抱文化差异","sentences":[{"en":"Traveling to a new country means entering a world with different norms and expectations.","cn":"去一个新国家旅行意味着进入一个有不同规范和期望的世界。"},{"en":"Every culture has its own way of communicating and showing respect.","cn":"每种文化都有自己的交流方式和表达尊重的方式。"},{"en":"What is polite in one place can be rude in another.","cn":"在一个地方礼貌的事在另一个地方可能很粗鲁。"},{"en":"Body language varies greatly across cultures.","cn":"肢体语言在不同文化中差异很大。"},{"en":"Eye contact, hand gestures, and personal space all have different meanings around the world.","cn":"目光接触、手势、个人空间在世界各地都有不同的含义。"},{"en":"Stereotypes can lead to misunderstandings when we judge too quickly.","cn":"刻板印象如果太早下判断会导致误解。"},{"en":"Instead of expecting others to adapt, we should adjust our own behavior.","cn":"与其期待别人适应我们不如我们自己调整行为。"},{"en":"Asking questions and listening carefully helps us avoid mistakes.","cn":"提问和认真倾听可以帮助我们避免犯错。"},{"en":"When we embrace cultural diversity, traveling becomes a truly enriching experience.","cn":"当我们拥抱文化多样性旅行就变成了真正丰富的体验。"},{"en":"Every difference is a chance to learn something new about the world and ourselves.","cn":"每一个差异都是一次了解世界和了解自己的新机会。"}]}},{"day":34,"dayTitle":"旅行安全与防范","daySubtitle":"Travel Safety & Precautions","phase":"Phase 2","newWordsCount":15,"reviewWordsCount":75,"dialogCount":14,"totalWords":510,"newWords":[{"word":"safe","translation":"安全的","exampleEn":"","exampleCn":""},{"word":"dangerous","translation":"危险的","exampleEn":"","exampleCn":""},{"word":"risk","tran ranslation":"期望","exampleEn":"","exampleCn":""},{"word":"embrace","translation":"接纳","exampleEn":"","exampleCn":""}],"dialog":[{"role":"YOU","textEn":"Hi, I'm staying in this area for a few days. Is it safe here?","textCn":""},{"role":"STAFF","textEn":"Generally yes, but please be careful at night. Stay alert in crowded places.","textCn":""},{"role":"YOU","textEn":"What should I avoid?","textCn":""},{"role":"STAFF","textEn":"Avoid showing expensive items. Keep your belongings close to you.","textCn":""},{"role":"YOU","textEn":"Are there any scams I should know about?","textCn":""},{"role":"STAFF","textEn":"Sometimes people pretend to be police and ask for your passport. Be suspicious of strangers.","textCn":""},{"role":"YOU","textEn":"How can I prevent theft?","textCn":""},{"role":"STAFF","textEn":"Use a money belt and don't keep all your cash in one place. Watch out for pickpockets.","textCn":""},{"role":"YOU","textEn":"What if I lose my passport?","textCn":""},{"role":"STAFF","textEn":"Contact your embassy immediately. They can help you with a replacement.","textCn":""},{"role":"YOU","textEn":"Is there anything else I should do to protect myself?","textCn":""},{"role":"STAFF","textEn":"Save emergency contacts and the local police number. It's better to be safe than sorry.","textCn":""},{"role":"YOU","textEn":"Thank you. I'll be aware of my surroundings.","textCn":""},{"role":"STAFF","textEn":"You're welcome. Have a safe and enjoyable trip.","textCn":""}],"essay":{"title":"Staying Safe While Traveling","titleCn":"旅行时保持安全","sentences":[{"en":"Traveling is exciting, but safety is always important.","cn":"旅行很令人兴奋但安全永远重要。"},{"en":"Before I go out, I check if the area is safe.","cn":"出门前我会确认区域是否安全。"},{"en":"I try to avoid dangerous places, especially at night.","cn":"我尽量避免危险的地方尤其是晚上。"},{"en":"I keep my belongings close and stay alert in crowds.","cn":"我把随身物品放在身边在人群中保持警惕。"},{"en":"If someone looks suspicious, I walk away.","cn":"如果有人看起来可疑我就走开。"},{"en":"I never share pers // V16: Migration will run after Store is defined (see below)
var __v16MigrateDone = function(){
  var done = Store.get('done', {});
  var migrated = false;
  var newDone = {};
  Object.keys(done).forEach(function(k){
    if (done[k] && k.indexOf('_') === -1) {
      newDone['travel_' + k] = true;
      migrated = true;
    } else {
      newDone[k] = done[k];
    }
  });
  if (migrated) Store.set('done', newDone);
};

function getCategoryStats(catId) {
  var data = DATA.filter(function(d){ return d && d.category === catId; });
  var done = Store.get('done', {});
  var doneCount = data.filter(function(d){ return done[catId + '_' + d.day]; }).length;
  var totalWords = 0;
  data.forEach(function(d){ totalWords += (d.newWords||[]).length; });
  return {days: data.length, done: doneCount, words: totalWords};
}

令人难受的"},{"word":"lovely","translation":"宜人的 美好的"},{"word":"unpredictable","translation":"不可预测的"},{"word":"typical","translation":"典型的"},{"word":"routine","translation":"日常 习惯"},{"word":"commute","translation":"通勤"},{"word":"groceries","translation":"日用品 杂货"},{"word":"chores","translation":"家务杂事"}],"dialogue":[{"role":"FRIEND","textEn":"Hey, a few of us are getting together this Saturday. Want to hang out?","textCn":""},{"role":"YOU","textEn":"Sounds fun! Let me check my schedule. Yes, I am available in the afternoon.","textCn":""},{"role":"FRIEND","textEn":"Great! We are thinking of dinner at 6. Does that suit you?","textCn":""},{"role":"YOU","textEn":"That is convenient for me. Where are we meeting?","textCn":""},{"role":"FRIEND","textEn":"The new Italian place downtown. I will send you the address.","textCn":""},{"role":"YOU","textEn":"Perfect. Count me in! I am really looking forward to it.","textCn":""},{"role":"FRIEND","textEn":"Awesome. Just make sure to be punctual this time!","textCn":""},{"role":"YOU","textEn":"Haha, I promise. If anything comes up, I will let you know in advance.","textCn":""}],"essayEn":["Making Plans with Friends","Inviting friends out is a great way to stay connected.","Always check if someone is available before making plans.","A busy schedule can make it hard to fit everything in.","It is polite to confirm the time and place beforehand.","Sometimes you need to reschedule when things come up.","Hanging out with friends is a great stress reliever.","Getting together regularly keeps friendships strong.","When someone says count me in, they are committed.","Being punctual shows respect for others time.","Looking forward to an event makes it more enjoyable."],"essayCn":["邀请朋友出去是保持联系的好方法。","邀请朋友出去是保持联系的好方法。","在做计划前总要确认对方是否有空。","繁忙的日程可能让你很难安排所有事情。","提前确认时间和地点是礼貌的表现。","有时遇到突发情况需要重新安排。","和朋友一起闲逛是很好的减压方式。","定期聚会让友谊更加牢固。","当有人说算我一个，就是做出了承诺。","守时表明你尊重别人的时间。","期待一个活动会让它更加令人愉快。"],"category":"daily","newWordsCount":15,"reviewWordsCount":45,"dialogCo "Absolutely, no nuts in that dish. How would you like it cooked?","textCn":""},{"role":"YOU","textEn":"Medium rare, please. And we will split the bill at the end.","textCn":""}],"essayEn":["Dining Out","Dining out is a popular social activity.","Making a reservation saves you from waiting.","An appetizer is a great way to start the meal.","The main course is the highlight of dinner.","Always ask what the waiter recommends.","If you are allergic to something, speak up early.","The portion size determines how much you order.","Splitting the bill is common among friends.","Leaving a tip shows appreciation for good service.","Dessert is the perfect ending to a meal."],"essayCn":["外出就餐是一项流行的社交活动。","外出就餐是一项流行的社交活动。","提前预订可以省去等待。","开胃菜是开始用餐的好方式。","主菜是晚餐的亮点。","总是问问服务员有什么推荐。","如果你对某些食物过敏，要尽早说明。","份量大小决定了你点多少。","朋友之间AA制分账很常见。","给小费表示对优质服务的感谢。","甜点是一顿饭的完美收尾。"],"category":"daily","newWordsCount":15,"reviewWordsCount":60,"dialogCount":8,"totalWords":75},{"day":9,"dayTitle":"购物与退换货","daySubtitle":"Shopping & Returns","phase":"DAILY COMM · DAY 9","newWords":[{"word":"try on","translation":"试穿"},{"word":"fitting room","translation":"试衣间"},{"word":"size up","translation":"大一号"},{"word":"on sale","translation":"打折促销"},{"word":"discount","translation":"折扣"},{"word":"receipt","translation":"收据"},{"word":"refund","translation":"退款"},{"word":"exchange","translation":"换货"},{"word":"out of stock","translation":"缺货"},{"word":"warranty","translation":"保修"},{"word":"defective","translation":"有缺陷的"},{"word":"bargain","translation":"便宜货 讨价还价"},{"word":"afford","translation":"负担得起"},{"word":"luxury","translation":"奢侈品"},{"word":"price tag","translation":"价格标签"}],"reviewWords":[{"word":"appetizer","translation":"开胃菜前菜"},{"word":"main course","translation":"主菜"},{"word":"dessert","translation":"甜点"},{"word":"beverage","translation":"饮料"},{"word":"recommend","translation":"推荐"},{"word":"specialty","translation":"招牌菜 特色菜"},{"word":"spicy","translation":"辣的"},{"word":"allergic to","translation":"对... ved","translation":"刚搬来"},{"word":"adjust to","translation":"适应"},{"word":"looking forward to","translation":"期待"},{"word":"get to know","translation":"认识 了解"},{"word":"impressive","translation":"令人印象深刻的"}],"dialogue":[{"role":"STAFF","textEn":"Hi there! Can I help you find anything?","textCn":""},{"role":"YOU","textEn":"Yes, I am looking for a jacket. Can I try this one on?","textCn":""},{"role":"STAFF","textEn":"Of course! The fitting room is right over there. What size do you need?","textCn":""},{"role":"YOU","textEn":"I think I need to size up. This one is a bit tight.","textCn":""},{"role":"STAFF","textEn":"Let me check. Sorry, that size is out of stock. But this similar one is on sale.","textCn":""},{"role":"YOU","textEn":"Oh nice, 30 percent off! That is a great bargain. Is there a warranty?","textCn":""},{"role":"STAFF","textEn":"Yes, one year warranty. Keep your receipt for any exchange or refund.","textCn":""},{"role":"YOU","textEn":"Perfect. If it turns out to be defective, I can bring it back?","textCn":""},{"role":"STAFF","textEn":"Absolutely, within 30 days for a full refund.","textCn":""}],"essayEn":["Shopping Smart","Shopping can be fun when you know what you want.","Always try on clothes before buying them.","The fitting room is your best friend in a store.","When something does not fit, size up or down.","Buying items on sale helps you save money.","A good discount makes luxury items affordable.","Always keep your receipt for returns and exchanges.","If a product is defective, you can get a refund.","Check the warranty before making big purchases.","A great bargain feels like a small victory."],"essayCn":["当你知道自己想要什么时，购物很有趣。","当你知道自己想要什么时，购物很有趣。","买衣服前一定要试穿。","试衣间是你在商店里最好的朋友。","当衣服不合身时，换大一号或小一号。","买打折商品可以帮你省钱。","好的折扣让奢侈品也能负担得起。","退货换货时一定要保留收据。","如果产品有缺陷，你可以获得退款。","购买大件商品前检查保修条款。","买到便宜货感觉像一场小小的胜利。"],"category":"daily","newWordsCount":15,"reviewWordsCount":60,"dialogCount":9,"totalWords":75},{"day":10,"dayTitle":"问路与城市导航","daySubtitle":"Directions & ""}],"essayEn":["Finding Your Way","Asking for directions is nothing to be embarrassed about.","Go straight until you reach the intersection.","Turn left at the traffic lights and keep walking.","A landmark helps you identify the right place.","The subway station is usually in the downtown area.","Crosswalks keep pedestrians safe on busy streets.","When you miss a turn, just turn around calmly.","The entrance is often between two large buildings.","Opposite the park is a common way to describe location.","Roundabouts can be confusing for new drivers."],"essayCn":["问路没什么好尴尬的。","问路没什么好尴尬的。","直走直到你到达十字路口。","在红绿灯处左转然后继续走。","地标帮助你找到正确的地方。","地铁站通常在市中心区域。","人行横道保护行人在繁忙街道上的安全。","当你错过一个转弯时，平静地掉头就好。","入口通常在两栋大楼之间。","在公园对面是描述位置的常见方式。","环岛可能让新手司机感到困惑。"],"category":"daily","newWordsCount":15,"reviewWordsCount":60,"dialogCount":8,"totalWords":75},{"day":11,"dayTitle":"电话与视频沟通","daySubtitle":"Phone & Video Calls","phase":"DAILY COMM · DAY 11","newWords":[{"word":"hold on","translation":"稍等"},{"word":"call back","translation":"回电话"},{"word":"leave a message","translation":"留言"},{"word":"voicemail","translation":"语音信箱"},{"word":"bad signal","translation":"信号差"},{"word":"can you hear me","translation":"你能听到吗"},{"word":"freeze","translation":"卡顿 冻结"},{"word":"mute","translation":"静音"},{"word":"screen share","translation":"屏幕共享"},{"word":"drop","translation":"掉线"},{"word":"put on hold","translation":"让...等待"},{"word":"extension","translation":"分机号"},{"word":"reachable","translation":"能联系上的"},{"word":"dial","translation":"拨打"},{"word":"connection","translation":"连接 通话质量"}],"reviewWords":[{"word":"intersection","translation":"十字路口"},{"word":"crosswalk","translation":"人行横道"},{"word":"block","translation":"街区"},{"word":"turn left","translation":"左转"},{"word":"go straight","translation":"直走"},{"word":"opposite","translation":"对面的"},{"word":"next to","translation":"紧挨着"},{"word":"between","translation":"在...之间"},{"word":"landmark","translation":"地标"},{"word":"roundabout","translation":"环岛"}, ndicate low blood pressure.","Swollen glands are a sign of infection.","The doctor checks your vital signs first.","A prescription tells you the correct dose.","Always finish your medication completely.","Side effects should be reported immediately.","Regular check-ups help prevent chronic diseases.","Most infections recover within a week."],"essayCn":["清楚地描述症状有助于医生诊断。","清楚地描述症状有助于医生诊断。","嗓子疼和发烧通常一起出现。","头晕可能表明血压偏低。","腺体肿胀是感染的征兆。","医生会先检查你的生命体征。","处方会告诉你正确的剂量。","一定要把药吃完即使感觉好转了。","副作用应该立即报告。","定期体检有助于预防慢性疾病。","大多数感染在一周内恢复。"],"category":"daily","newWordsCount":15,"reviewWordsCount":60,"dialogCount":9,"totalWords":75},{"day":13,"dayTitle":"感谢与道歉的艺术","daySubtitle":"Gratitude & Apologies","phase":"DAILY COMM · DAY 13","newWords":[{"word":"appreciate","translation":"感激 感谢"},{"word":"grateful","translation":"感恩的"},{"word":"owe you one","translation":"欠你一个人情"},{"word":"thoughtful","translation":"体贴的"},{"word":"apologize","translation":"道歉"},{"word":"my fault","translation":"我的错"},{"word":"make it up to","translation":"补偿"},{"word":"forgive","translation":"原谅"},{"word":"misunderstanding","translation":"误解"},{"word":"on behalf of","translation":"代表"},{"word":"regret","translation":"遗憾 后悔"},{"word":"sincere","translation":"真诚的"},{"word":"no worries","translation":"没关系"},{"word":"accident","translation":"意外"},{"word":"take responsibility","translation":"承担责任"}],"reviewWords":[{"word":"symptom","translation":"症状"},{"word":"prescription","translation":"处方"},{"word":"dose","translation":"剂量"},{"word":"side effect","translation":"副作用"},{"word":"swollen","translation":"肿胀的"},{"word":"dizzy","translation":"头晕的"},{"word":"sore throat","translation":"嗓子疼"},{"word":"fever","translation":"发烧"},{"word":"check-up","translation":"体检"},{"word":"blood pressure","translation":"血压"},{"word":"allergy","translation":"过敏"},{"word":"infection","translation":"感染"},{"word":"recover","translation":"恢复 康复"},{"word":"chronic","translation":"慢性的"},{"word":"vital signs","translation":"生命体征"},{"word":"hold riends are for.","textCn":""},{"role":"YOU","textEn":"I am so grateful. I owe you one. Let me take you to dinner.","textCn":""},{"role":"FRIEND","textEn":"That is very thoughtful of you. Speaking of which, I need to apologize for being late earlier.","textCn":""},{"role":"YOU","textEn":"Oh, it was not your fault. There was a misunderstanding about the time.","textCn":""},{"role":"FRIEND","textEn":"I still feel bad. Let me make it up to you with dessert.","textCn":""},{"role":"YOU","textEn":"No need to apologize. I forgive you already. It was an accident.","textCn":""},{"role":"FRIEND","textEn":"You are too kind. I sincerely appreciate your understanding.","textCn":""}],"essayEn":["The Art of Gratitude and Apology","Expressing gratitude strengthens relationships.","Telling someone you appreciate them costs nothing.","Being grateful makes you a happier person.","When you owe someone a favor, return it sincerely.","A thoughtful gesture can make someone is day.","Apologizing shows you take responsibility for your actions.","Saying my fault is a sign of maturity.","Making it up to someone shows you care.","Forgiveness heals misunderstandings between friends.","A sincere apology is always accepted eventually."],"essayCn":["表达感激能加强人际关系。","表达感激能加强人际关系。","告诉别人你感谢他们不需要任何代价。","心怀感恩让你成为一个更快乐的人。","当你欠别人一个人情时，真诚地回报。","体贴的举动可以点亮别人的一天。","道歉表明你对自己的行为负责。","说是我的错是成熟的标志。","补偿别人表明你在意。","宽恕能治愈朋友之间的误解。","真诚的道歉最终总会被接受。"],"category":"daily","newWordsCount":15,"reviewWordsCount":60,"dialogCount":8,"totalWords":75},{"day":14,"dayTitle":"请求与提供帮助","daySubtitle":"Asking & Offering Help","phase":"DAILY COMM · DAY 14","newWords":[{"word":"favor","translation":"帮忙 恩惠"},{"word":"lend a hand","translation":"伸出援手"},{"word":"assist","translation":"协助"},{"word":"bother","translation":"麻烦 打扰"},{"word":"would you mind","translation":"你介意...吗"},{"word":"available","translation":"有空的 能帮忙的"},{"word":"struggle with","translation":"在...方面挣扎"},{"word":"manage","translation":"应付 应对"},{"word":"offer","translation hers builds trust and respect.","Never make people feel like a burden.","Managing problems together is easier than alone."],"essayCn":["请求帮忙不是软弱的表现。","请求帮忙不是软弱的表现。","你介意吗是礼貌请求帮助的方式。","当有人伸出援手时，要表示感激。","不要独自挣扎应对一切。","在被请求之前主动提供帮助是令人敬佩的。","你可以永远指望真正的朋友。","回报恩惠保持友谊中的平衡。","协助他人建立信任和尊重。","永远不要让人觉得他们是个负担。","一起解决问题比独自面对更容易。"],"category":"daily","newWordsCount":15,"reviewWordsCount":60,"dialogCount":8,"totalWords":75},{"day":15,"dayTitle":"同意反对与讨论","daySubtitle":"Agreement & Disagreement","phase":"DAILY COMM · DAY 15","newWords":[{"word":"agree","translation":"同意 赞同"},{"word":"disagree","translation":"不同意"},{"word":"absolutely","translation":"完全同意 没错"},{"word":"point taken","translation":"你说得有道理"},{"word":"on the other hand","translation":"另一方面"},{"word":"respect your opinion","translation":"尊重你的观点"},{"word":"convince","translation":"说服"},{"word":"compromise","translation":"妥协 让步"},{"word":"perspective","translation":"视角 观点"},{"word":"reasonable","translation":"有道理的 合理的"},{"word":"argue","translation":"争论 辩论"},{"word":"standpoint","translation":"立场"},{"word":"make sense","translation":"有道理 说得通"},{"word":"differ","translation":"不同 分歧"},{"word":"common ground","translation":"共同点 共识"}],"reviewWords":[{"word":"favor","translation":"帮忙 恩惠"},{"word":"lend a hand","translation":"伸出援手"},{"word":"assist","translation":"协助"},{"word":"bother","translation":"麻烦 打扰"},{"word":"would you mind","translation":"你介意...吗"},{"word":"available","translation":"有空的 能帮忙的"},{"word":"struggle with","translation":"在...方面挣扎"},{"word":"manage","translation":"应付 应对"},{"word":"offer","translation":"主动提供"},{"word":"volunteer","translation":"自愿"},{"word":"count on","translation":"依靠 指望"},{"word":"return the favor","translation":"回报"},{"word":"no problem at all","translation":"完全没问题"},{"word":"appreciate it","translation":"非常感谢"},{"word":"burden","translation":"负担"},{"word":"appreciate","translation":"感激 感谢"},{"word":"grateful","translation":"感恩的"},{"word":"owe you one","translation":"欠你一个人情"},{"word":"thoug u use?","textCn":""},{"role":"YOU","textEn":"Just basic ingredients. The secret is the marinade and the seasoning.","textCn":""},{"role":"FRIEND","textEn":"I love cooking too, but I am not great at steaming. My dishes always turn out soggy.","textCn":""},{"role":"YOU","textEn":"You should try baking instead. It is more forgiving. Do you prefer spicy or sour flavors?","textCn":""},{"role":"FRIEND","textEn":"Definitely spicy! Chinese cuisine is my favorite. I never lose my appetite for it.","textCn":""},{"role":"YOU","textEn":"Same! Let me share the recipe with you. You can adjust the seasoning to your taste.","textCn":""}],"essayEn":["Food and Cooking","Cooking at home is healthier than eating out.","A good recipe is the foundation of a great dish.","Fresh ingredients make all the difference.","Every cuisine has its unique flavors and techniques.","Marinating meat makes it tender and flavorful.","Stir-frying requires high heat and quick movements.","Steaming preserves the nutrients in vegetables.","Baking is a science that requires precision.","The right seasoning can transform a plain dish.","A home-cooked meal warms both body and soul."],"essayCn":["在家做饭比外出就餐更健康。","在家做饭比外出就餐更健康。","好的食谱是一道好菜的基础。","新鲜的食材决定了味道的差异。","每种菜系都有独特的风味和技巧。","腌制让肉更嫩更入味。","翻炒需要大火和快速动作。","蒸保留了蔬菜中的营养。","烘焙是一门需要精确度的科学。","合适的调味料能改变一道平淡的菜。","家常菜温暖身体和心灵。"],"category":"daily","newWordsCount":15,"reviewWordsCount":75,"dialogCount":8,"totalWords":90},{"day":22,"dayTitle":"聊科技与社交媒体","daySubtitle":"Technology & Social Media","phase":"DAILY COMM · DAY 22","newWords":[{"word":"gadget","translation":"小设备 小工具"},{"word":"update","translation":"更新"},{"word":"download","translation":"下载"},{"word":"upload","translation":"上传"},{"word":"notification","translation":"通知"},{"word":"follower","translation":"粉丝 关注者"},{"word":"go viral","translation":"走红"},{"word":"algorithm","translation":"算法"},{"word":"privacy","translation":"隐私"},{"word":"screen time","translation":"屏幕时间"},{"word":"unplug","translation":"断网 放下手机"},{"w om trusted sources now. And I turned off data sharing.","textCn":""},{"role":"FRIEND","textEn":"Did you see that video that went viral? It has millions of followers.","textCn":""},{"role":"YOU","textEn":"Yes! It is crazy how fast trends spread. Sometimes I miss the days before all these gadgets.","textCn":""}],"essayEn":["Technology and Social Media","Technology has transformed how we communicate.","Social media can be incredibly addictive.","The algorithm decides what content you see.","Too much screen time affects your health and sleep.","Doing a digital detox helps reset your brain.","Privacy is a growing concern in the digital age.","Turning off notifications reduces daily stress.","Every new gadget promises to make life easier.","Going viral is every content creator is dream.","Unplugging from devices reconnects you with reality."],"essayCn":["科技改变了我们的沟通方式。","科技改变了我们的沟通方式。","社交媒体可以非常令人上瘾。","算法决定了你看到什么内容。","过多的屏幕时间影响健康和睡眠。","进行数字排毒帮助重置大脑。","隐私是数字时代日益增长的担忧。","关闭通知减少了日常压力。","每个新设备都承诺让生活更轻松。","走红是每个内容创作者的梦想。","放下设备让你重新与现实连接。"],"category":"daily","newWordsCount":15,"reviewWordsCount":75,"dialogCount":8,"totalWords":90},{"day":23,"dayTitle":"聊教育与学习","daySubtitle":"Education & Learning","phase":"DAILY COMM · DAY 23","newWords":[{"word":"enroll","translation":"注册 报名"},{"word":"tuition","translation":"学费"},{"word":"scholarship","translation":"奖学金"},{"word":"syllabus","translation":"教学大纲"},{"word":"assignment","translation":"作业"},{"word":"deadline","translation":"截止日期"},{"word":"grade","translation":"成绩 评分"},{"word":"lecturer","translation":"讲师"},{"word":"seminar","translation":"研讨会"},{"word":"thesis","translation":"论文"},{"word":"graduation","translation":"毕业"},{"word":"lifelong learning","translation":"终身学习"},{"word":"self-taught","translation":"自学的"},{"word":"memorize","translation":"记忆 背诵"},{"word":"comprehension","translation":"理解力"}],"reviewWords":[{"word":"gadget","translation":"小设备 小工具"},{"word":"update","translation":"更新"},{"word":"download","translation":"下载"},{ ctful prevents unnecessary confrontations.","A diplomatic approach diffuses tense situations.","Sensitive topics require careful word choice.","Misunderstandings often escalate into conflicts.","Keeping a calm tone shows emotional intelligence.","Constructive criticism is better than blunt honesty.","Pointing out issues gently is an art.","Bringing up problems at the right time matters.","Sugarcoating too much hides the real issue.","Addressing the issue directly resolves it faster."],"essayCn":["得体的表达避免不必要的冲突。","得体的表达避免不必要的冲突。","圆滑的方式化解紧张局面。","敏感话题需要谨慎措辞。","误解经常升级为冲突。","保持冷静的语气体现了情商。","建设性的批评比直白的诚实更好。","温和地指出问题是门艺术。","在合适的时机提出问题很重要。","过度粉饰会掩盖真正的问题。","直接解决问题能更快地解决它。"],"category":"daily","newWordsCount":15,"reviewWordsCount":75,"dialogCount":8,"totalWords":90},{"day":29,"dayTitle":"跨文化交际与礼仪","daySubtitle":"Cross-Cultural Communication & Etiquette","phase":"DAILY COMM · DAY 29","newWords":[{"word":"etiquette","translation":"礼仪 礼节"},{"word":"courtesy","translation":"礼貌 殷勤"},{"word":"gesture","translation":"手势"},{"word":"taboo","translation":"禁忌"},{"word":"respectful","translation":"尊重的"},{"word":"norm","translation":"规范 常规"},{"word":"adapt to","translation":"适应"},{"word":"observe","translation":"观察 注意"},{"word":"formal","translation":"正式的"},{"word":"informal","translation":"非正式的"},{"word":"address","translation":"称呼 称呼某人"},{"word":"hierarchy","translation":"等级制度"},{"word":"gift-giving","translation":"送礼"},{"word":"punctuality","translation":"守时"},{"word":"cultural awareness","translation":"文化意识"}],"reviewWords":[{"word":"tactful","translation":"得体的 机智的"},{"word":"diplomatic","translation":"圆滑的 外交的"},{"word":"sensitive","translation":"敏感的"},{"word":"confrontation","translation":"对抗 冲突"},{"word":"misunderstand","translation":"误解"},{"word":"escalate","translation":"升级 加剧"},{"word":"diffuse","translation":"化解 缓和"},{"word":"compromise","translation":"妥协"},{"word":"perspective","translation":"视角 观点"},{"word":"tone","translation":"语气 口吻"},{"word":"constructive","translation": // ===== Storage Layer =====
const Store = (function() {
  var idb = null;
  var idbReady = false;
  var DB_NAME = 'te_v14_db';
  var STORE_NAME = 'kv';
  var cache = {};
  var KNOWN_KEYS = ['done', 'lastStudy', 'studyLog', 'notebook', 'reviews', 'ttsSettings'];

  function initIDB() {
    return new Promise(function(resolve) {
      if (!window.indexedDB) { resolve(false); return; }
      try {
        var req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = function(e) {
          var db = e.target.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            db.createObjectStore(STORE_NAME);
          }
        };
        req.onsuccess = function(e) {
          idb = e.target.result;
          idbReady = true;
          resolve(true);
        };
        req.onerror = function() { resolve(false); };
      } catch(e) { resolve(false); }
    });
  }

  function idbGet(key) {
    return new Promise(function(resolve) {
      if (!idb) { resolve(undefined); return; }
      try {
        var tx = idb.transaction(STORE_NAME, 'readonly');
        var store = tx.objectStore(STORE_NAME);
        var req = store.get(key);
        req.onsuccess = function() { resolve(req.result); };
        req.onerror = function() { resolve(undefined); };
      } catch(e) { resolve(undefined); }
    });
  }

  function idbSet(key, val) {
    if (!idb) return;
    try {
      var tx = idb.transaction(STORE_NAME, 'readwrite');
      var store = tx.objectStore(STORE_NAME);
      store.put(val, key);
    } catch(e) {}
  }

  function lsGet(key) {
    try {
      var v = localStorage.getItem(SK + '_' + key);
      return v ? JSON.parse(v) : null;
    } catch(e) { return null; }
  }

  function lsSet(key, val) {
    try {
      localStorage.setItem(SK + '_' + key, JSON.stringify(val));
    } catch(e) {}
  }

  function init() {
    return initIDB().then(function(idbOk) {
      var promises = KNOWN_KEYS.map(function(k) {
        return idbGet(k).then(function(val) {
          if (val === undefined || val === null) {
            val = lsGet(k);
            if (val !== null && idbOk) {
              idbSet(k, val);
            }
          }
          if (val !== null && val !== undefined) {
            cache[k] = val;
          }
        });
      });
      return Promise.all(promises);
    });
  }

  function get(k, d) {
    if (k in cache) return cache[k];
    var v = lsGet(k);
    if (v !== null) {
      cache[k] = v;
      return v;
    }
    return d;
  }

  function set(k, v) {
    cache[k] = v;
    if (idbReady) idbSet(k, v);
    lsSet(k, v);
  }

  return { init: init, get: get, set: set };
})();

function startMixedReview() {
  var pool = [];
  var seen = {};
  var errorWords = getErrorPoolWords();
  errorWords.forEach(function(w) {
    if (w && w.word && !seen[w.word.toLowerCase()]) { pool.push(w); seen[w.word.toLowerCase()] = true; }
  });
  var reviewWords = getReviewWordList();
  reviewWords.forEach(function(w) {
    if (w && w.word && !seen[w.word.toLowerCase()]) { pool.push(w); seen[w.word.toLowerCase()] = true; }
  });
  var allWords = [];
  DATA.forEach(function(d) {
    if (!d) return;
    (d.newWords||[]).forEach(function(w) {
      if (w && w.word && !seen[w.word.toLowerCase()]) allWords.push(w);
    });
  });
  allWords.sort(function(){return Math.random()-0.5;});
  allWords.forEach(function(w) {
    if (pool.length < 20) { pool.push(w); seen[w.word.toLowerCase()] = true; }
  });
  if (!pool.length) { showToast("暂无可复习的词汇"); return; }
  pool.sort(function(){return Math.random()-0.5;});
  curWords = pool;
  curDay = null;
  wIdx = 0;
  wMode = "quiz";
  quizState = null;
  document.getElementById("w-title").textContent = "混合复习";
  showPage("pg-words");
  renderWords();
}

function renderPhaseCards() {
  const container = document.getElementById('home-cards');
  if (!container) return;
  const done = Store.get('done', {});
  var curData = getCurData();

  if (!curData.length) {
    container.innerHTML = '<div class="cat-empty"><div class="cat-empty-icon">📝</div><div class="cat-empty-text">内容即将上线</div><div class="cat-empty-sub">敬请期待</div></div>';
    return;
  }

  // Group by phase - normalize daily-comm phases
  const phases = {};
  curData.forEach(d => {
    if (!d) return;
    var p = d.phase || 'Phase 1';
    // V16: Normalize daily-comm phase (e.g. "DAILY COMM · DAY 1" -> "Phase 1")
    if (p.indexOf('DAILY COMM') !== -1) {
      var dayNum = d.day;
      if (dayNum <= 10) p = 'Phase 1';
      else if (dayNum <= 20) p = 'Phase 2';
      else p = 'Phase 3';
    }
    if (!phases[p]) phases[p] = [];
    phases[p].push(d);
  });

  let html = '';
  const phaseNames = {
    'Phase 1': '生存基础',
    'Phase 2': '进阶沟通',
    'Phase 3': '深度表达'
  };
  // V16: Different labels for daily category
  if (curCategory === 'daily') {
    phaseNames['Phase 1'] = '日常基础';
    phaseNames['Phase 2'] = '社交进阶';
    phaseNames['Phase 3'] = '深度表达';
  }

  const phaseOrder = Object.keys(phases);
  phaseOrder.forEach(p => {
    const days = phases[p];
    if (!days.length) return;
    const label = phaseNames[p] || p;

    html += '<div class="phase-group">';
    html += '<div class="phase-label">' + esc(p) + ' · ' + esc(label) + '</div>';
    html += '<div class="phase-card-grid">';

    days.forEach(d => {
      if (!d) return;
      const isDone = done[getDayKey(d.day)];
      const nw = (d.newWords || []).length;
      const rw = (d.reviewWords || []).length;

      html += '<div class="day-card" onclick="openDayDetail(' + d.day + ')">';
      html += '<div class="dc-num">' + d.day + '</div>';
      html += '<div class="dc-info">';
      html += '<div class="dc-title">' + esc(d.dayTitle || '') + '</div>';
      html += '<div class="dc-sub">' + esc(d.daySubtitle || '') + '</div>';
      html += '<div class="dc-tags">';
      if (nw) html += '<span class="dc-tag purp">' + nw + '词</span>';
      if (rw) html += '<span class="dc-tag cyan">' + rw + '复习</span>';
      html += '</div></div>';

      if (isDone) {
        html += '<div class="dc-done-mark"><svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg></div>';
      }
      html += '</div>';
    });

    html += '</div></div>';
  });

  container.innerHTML = html;
}

function markDayDone() {

// ===== WORDS =====
function openWords(isReview) {
  curWords = isReview ? (curDay.reviewWords||[]) : (curDay.newWords||[]);
  if (!curWords.length) { showToast('没有可学习的词汇'); return; }
  wIdx = 0;
  wMode = 'card';
  quizState = null;
  document.getElementById('w-title').textContent = isReview ? '复习词汇' : '今日新词';
  showPage('pg-words');
  renderWords();
  setupSwipe();
}

function setupSwipe() {
  const c = document.getElementById('w-content');
  if (!c) return;
  c.addEventListener('touchstart', e => {
    swipeStartX = e.touches[0].clientX;
    swipeStartY = e.touches[0].clientY;
  }, {passive: true});
  c.addEventListener('touchend', e => {
    if (wMode !== 'card') return;
    const dx = e.changedTouches[0].clientX - swipeStartX;
    const dy = e.changedTouches[0].clientY - swipeStartY;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
      if (dx < 0 && wIdx < curWords.length - 1) { wIdx++; renderWords(); }
      else if (dx > 0 && wIdx > 0) { wIdx--; renderWords(); }
    }
  }, {passive: true});
}

function setWordMode(m) {
  wMode = m;
  wIdx = 0;
  quizState = null;
  dictResults = null;
  buildState = null;
  renderWords();
}

function prevWord() {
  if (wIdx > 0) { wIdx--; renderWords(); }
}
function nextWord() {
  if (wIdx < curWords.length - 1) { wIdx++; renderWords(); }
}

function renderWords() {
  const words = curWords;
  const bar = document.getElementById('w-mode-bar');
  bar.innerHTML = '<button class="' + (wMode==='card'?'active':'') + '" data-mode="card" onclick="setWordMode(this.dataset.mode)">卡片</button><button class="' + (wMode==='dict'?'active':'') + '" data-mode="dict" onclick="setWordMode(this.dataset.mode)">听写</button><button class="' + (wMode==='quiz'?'active':'') + '" data-mode="quiz" onclick="setWordMode(this.dataset.mode)">选择</button><button class="' + (wMode==='build'?'active':'') + '" data-mode="build" onclick="setWordMode(this.dataset.mode)">造句</button>';
  document.getElementById('w-counter').textContent = (wIdx+1) + '/' + words.length;

  if (wMode === 'card') renderCard();
  else if (wMode === 'dict') renderDict();
  else if (wMode === 'build') renderBuild();
  else renderQuiz();
}

function renderCard() {
  const words = curWords;
  const c = document.getElementById('w-content');
  if (wIdx >= words.length) {
    c.innerHTML = '<div class="empty-state"><div class="es-icon">🎉</div><div class="es-title">全部学完了！</div><div class="es-desc">已掌握 ' + words.length + ' 个词汇</div></div>';
    return;
  }
  const w = words[wIdx];
  if (!w) { wIdx++; renderWords(); return; }
  const prevDisabled = wIdx <= 0;
  const nextDisabled = wIdx >= words.length - 1;

  let html = '<div class="word-nav"><button class="btn sec sm" onclick="prevWord()" ' + (prevDisabled?'disabled':'') + '>上一个</button>';
  html += '<span class="wn-progress">' + (wIdx+1) + ' / ' + words.length + '</span>';
  html += '<button class="btn primary sm" onclick="nextWord()" ' + (nextDisabled?'disabled':'') + '>下一个</button></div>';

  html += '<div class="swipe-hint"><svg viewBox="0 0 24 24"><path d="M7 16l-4-4 4-4M17 8l4 4-4 4M3 12h18"/></svg>左右滑动切换单词</div>';

  var parts = getWordParts(w.word);
  html += '<div class="flip-c" onclick="toggleFlip(this)">';
  html += '<div class="flip-i">';
  html += '<div class="flip-f">';
  html += '<div class="ff-word">' + esc(w.word) + '</div>';
  html += '<div class="ff-phonetic">点击卡片查看释义</div>';
  html += '<div class="ff-speak" onclick="event.stopPropagation();speakWord(this)" data-word="' + escAttr(w.word) + '">';
  html += '<svg viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4V5zM15.5 8.5a5 5 0 010 7M19 5a9 9 0 010 14"/></svg>';
  html += '</div>';
  if (parts.length > 1) {
    html += '<div class="ff-breakdown" onclick="event.stopPropagation()">';
    html += '<div class="ff-bd-label">单词拆解</div>';
    html += '<div class="ff-bd-parts">';
    parts.forEach(function(p, i) {
      html += '<span class="ff-bd-part" onclick="event.stopPropagation();speakTextStr(\'' + p.replace(/'/g,"\\'") + '\')">' + esc(p) + '</span>';
      if (i < parts.length - 1) html += '<span class="ff-bd-sep">+</span>';
    });
    html += '</div>';
    html += '<button class="ff-bd-speak" onclick="event.stopPropagation();speakParts(\'' + parts.join('|').replace(/'/g,"\\'") + '\')">拆解朗读</button>';
    html += '</div>';
  }
  html += '</div>';
  html += '<div class="flip-b">';
  html += '<div class="fb-trans">' + esc(w.translation||'') + '</div>';
  html += '<div class="fb-word">' + esc(w.word) + '</div>';
  html += '</div>';
  html += '</div></div>';

  if (w.exampleEn || w.exampleCn) {
    html += '<div class="wi"><div class="wi-ex" onclick="speakText(this)" data-text="' + escAttr(w.exampleEn||'') + '">';
    html += '<div class="en">' + makeClickableWords(w.exampleEn||'') + '</div><div class="cn">' + esc(w.exampleCn||'') + '</div>';
    html += '<div class="wi-ex-hint">点击句子朗读</div>';
    html += '</div></div>';
  }

  // V12: Generate additional example sentences
  var extraExamples = generateWordExamples(w.word, w.translation);
  if (extraExamples.length) {
    html += '<div class="word-extra-examples">';
    html += '<div class="word-extra-ex-title">更多例句</div>';
    extraExamples.forEach(function(ex) {
      html += '<div class="word-ex-item" onclick="speak(\'' + ex.en.replace(/'/g, "\\'") + '\')">';
      html += '<div class="en">' + makeClickableWords(ex.en) + '</div>';
      html += '<div class="cn">' + esc(ex.cn) + '</div>';

  // V10: Ebbinghaus status badge
  var ebStatus = getWordEbbinghausStatus(w.word);
  if (ebStatus === 'due') {
    html += '<div class="eb-badge due">\uD83D\uDD04 今日复习</div>';
  } else if (ebStatus === 'known') {
    html += '<div class="eb-badge known">\u2705 已掌握</div>';
  }

  // V10: Bookmark button
  var inNb = isInNotebook(w.word);
  html += '<div class="wc-actions">';
  html += '<div class="wc-action-btn bookmark ' + (inNb?'saved':'') + '" onclick="event.stopPropagation();onBookmarkClick()">';

  html += inNb ? '已收藏' : '收藏';
  html += '</div></div>';

  c.innerHTML = html;

function renderDict() {
  var words = curWords;
  var c = document.getElementById('w-content');
  if (wIdx >= words.length) {
    var correctCount = (dictResults ? dictResults.filter(function(r){return r;}).length : 0);
    c.innerHTML = '<div class="empty-state"><div class="es-icon">✍️</div><div class="es-title">听写完成！</div><div class="es-desc">正确率 ' + Math.round(correctCount/words.length*100) + '% (' + correctCount + '/' + words.length + ')</div></div>';

  }
  var w = words[wIdx];
  if (!w) { wIdx++; renderWords(); return; }
  if (!dictResults) dictResults = new Array(words.length).fill(null);
  var hint = '';
  for (var i = 0; i < w.word.length; i++) {
    hint += (i === 0) ? w.word[0] : '_';
  }

  var html = '<div class="word-nav"><span class="wn-progress">' + (wIdx+1) + ' / ' + words.length + '</span></div>';
  html += '<div class="dict-progress-dots">';
  for (var i = 0; i < words.length; i++) {
    var cls = 'dict-dot';
    if (dictResults[i] === true) cls += ' correct';
    else if (dictResults[i] === false) cls += ' wrong';
    if (i === wIdx) cls += ' current';
    html += '<div class="' + cls + '"></div>';

  html += '</div>';

  html += '<div class="dict-mode-card">';
  html += '<div class="dmc-icon">🔊</div>';

  html += '<div style="text-align:center;margin-top:12px"><button class="btn sec sm" onclick="showDictAnswer()">显示答案</button></div>';
  c.innerHTML = html;
  var inp = document.getElementById('dict-in');
  if (inp) {
    inp.addEventListener('keydown', function(e) { if (e.key === 'Enter') checkDict(); });
    inp.addEventListener('input', function() { inp.classList.remove('correct','wrong'); });
    setTimeout(function() { inp.focus(); }, 100);
  }
  // Auto-play pronunciation
  setTimeout(function() { dictPlayWord(); }, 300);
}

var dictResults = null;

function dictPlayWord() {
  var w = curWords[wIdx];
  if (!w) return;
  speak(w.word);
}

function dictPlayWordSlow() {
  var w = curWords[wIdx];
  if (!w || !window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  var u = new SpeechSynthesisUtterance(w.word);
  var tts = Store.get('ttsSettings', { rate: 0.85, voice: '' });
  u.lang = 'en-US'; u.rate = 0.5; u.pitch = 1;
  if (tts.voice) { var voices = window.speechSynthesis.getVoices(); var v = voices.find(function(vv){return vv.name===tts.voice;}); if (v) u.voice = v; }
  window.speechSynthesis.speak(u);
}

function dictShowHint() {
  var el = document.getElementById('dict-hint-display');
  if (el) el.style.display = 'block';
}

function dictShowLength() {
  var el = document.getElementById('dict-length-display');
  if (el) el.style.display = 'block';
}

function dictShowTranslation() {
  var el = document.getElementById('dict-trans-display');
  if (el) el.style.display = 'block';
}

function showDictAnswer() {
  const w = curWords[wIdx];
  if (!w) return;
  document.getElementById('dict-hint').innerHTML = '答案: <span style="color:var(--t1);font-weight:700;font-size:16px">' + esc(w.word) + '</span>';
  addToNotebook(w.word, w.translation, curDay ? curDay.day : 0);
}

function checkDict() {
  var w = curWords[wIdx];
  if (!w) return;
  var inp = document.getElementById('dict-in');
  if (!inp) return;
  var val = inp.value.trim().toLowerCase();
  var ans = w.word.toLowerCase();
  inp.classList.remove('correct','wrong');
  if (!dictResults) dictResults = new Array(curWords.length).fill(null);
  if (val === ans) {
    inp.classList.add('correct');
    document.getElementById('dict-hint').innerHTML = '<span style="color:#34D399;font-weight:700">✓ 正确！</span>';
    dictResults[wIdx] = true;
    markWordKnown(w.word);
  } else {
    inp.classList.add('wrong');
    dictResults[wIdx] = false;
    var hint = document.getElementById('dict-hint');
    if (hint.textContent === '') hint.innerHTML = '再试试，注意拼写';
    addToNotebook(w.word, w.translation, curDay ? curDay.day : 0);
    addToErrorPool(w.word, w.translation, curDay ? curDay.day : 0);
    logError(curDay ? curDay.day : 0);
  }
}

function dictNext() {
  wIdx++;
  renderWords();
}

function renderQuiz() {
  const words = curWords;
  const c = document.getElementById('w-content');
  if (!quizState || quizState.round >= 10) {
    const pool = [...words].sort(() => Math.random()-.5);
    const qLen = Math.min(10, pool.length);
    if (qLen === 0) {
      c.innerHTML = '<div class="empty-state">没有足够词汇出题</div>';
      return;
    }
    quizState = { round: 0, score: 0, total: qLen, questions: [] };
    for (let i = 0; i < qLen; i++) {
      const correct = pool[i];
      if (!correct) continue;
      const others = words.filter(w => w && w.word !== correct.word).sort(() => Math.random()-.5).slice(0,3);
      const opts = [...others, correct].sort(() => Math.random()-.5);
      const correctIdx = opts.indexOf(correct);
      quizState.questions.push({ word: correct.word, translation: correct.translation, options: opts.map(o => o.translation), correctIdx });
    }
  }
  if (quizState.round >= quizState.questions.length) {
    const pct = Math.round(quizState.score/quizState.total*100);
    let html = '<div class="empty-state"><div style="font-size:52px;font-weight:900;';
    html += 'background:var(--ga);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text">';
    html += quizState.score + '/' + quizState.total + '</div>';
    html += '<div style="color:var(--t2);margin:8px 0 4px;font-size:14px">答对 ' + quizState.score + ' 题 · 正确率 ' + pct + '%</div>';
    if (pct >= 80) html += '<div style="color:#34D399;font-size:13px;margin-bottom:16px">优秀！继续加油</div>';
    else if (pct >= 60) html += '<div style="color:#FBBF24;font-size:13px;margin-bottom:16px">不错，还可以更好</div>';
    else html += '<div style="color:#FB923C;font-size:13px;margin-bottom:16px">需要多加练习</div>';
    html += '<button class="btn primary" onclick="quizState=null;renderWords()">再来一轮</button></div>';
    c.innerHTML = html;
    return;
  }
  const q = quizState.questions[quizState.round];
  if (!q) { quizState.round++; renderWords(); return; }
  let html = '<div class="word-nav"><span class="wn-progress">第 ' + (quizState.round+1) + ' / ' + quizState.total + ' 题 · 得分 ' + quizState.score + '</span></div>';
  html += '<div class="pbar" style="margin-bottom:14px"><div class="pbar-fill" style="width:' + (quizState.round/quizState.total*100) + '%"></div></div>';
  html += '<div style="text-align:center;padding:24px 20px;';
  html += 'background:linear-gradient(135deg,rgba(139,92,246,.06) 0%,rgba(6,182,212,.03) 100%);';
  html += 'border:1px solid rgba(139,92,246,.1);border-radius:var(--r);margin-bottom:14px">';
  html += '<div style="font-size:26px;font-weight:800;color:var(--t1)">' + esc(q.word) + '</div>';
  html += '<div style="font-size:13px;color:var(--t3);margin-top:4px">选择正确的中文释义</div></div>';
  q.options.forEach((opt, i) => {
    html += '<div class="qo" data-idx="' + i + '" onclick="answerQuiz(this,' + i + ',' + q.correctIdx + ')">' + esc(opt||'') + '</div>';
  });
  c.innerHTML = html;
}

// ===== V13: Sentence Builder =====
var buildState = null;

function renderBuild() {
  var words = curWords;
  var c = document.getElementById("w-content");
  if (!buildState || buildState.round >= buildState.total) {
    var sentences = [];
    if (curDay) {
      var essay = curDay.essay || {};
      (essay.sentences || []).forEach(function(s) {
        if (s && s.en && s.en.split(" ").length >= 4 && s.en.split(" ").length <= 12) {
          sentences.push({ en: s.en, cn: s.cn || "" });
        }
      });
      (curDay.dialog || []).forEach(function(l) {
        if (l && l.textEn && l.textEn.split(" ").length >= 4 && l.textEn.split(" ").length <= 12) {
          sentences.push({ en: l.textEn, cn: l.textCn || "" });
        }
      });
    }
    if (sentences.length < 5) {
      DATA.forEach(function(d) {
        if (!d) return;
        var essay = d.essay || {};
        (essay.sentences || []).forEach(function(s) {
          if (s && s.en && s.en.split(" ").length >= 4 && s.en.split(" ").length <= 12) {
            if (!sentences.find(function(ex){return ex.en === s.en;})) {
              sentences.push({ en: s.en, cn: s.cn || "" });
            }
          }
        });
      });
    }
    if (!sentences.length) {
      c.innerHTML = '<div class="empty-state"><div class="es-icon">\uD83D\uDCDD</div><div class="es-title">暂无造句素材</div><div class="es-desc">需要至少一个含4-12个单词的句子</div></div>';
      return;
    }
    sentences.sort(function(){return Math.random()-0.5;});
    var picked = sentences.slice(0, Math.min(10, sentences.length));
    buildState = { round: 0, score: 0, total: picked.length, sentences: picked };
  }
  if (buildState.round >= buildState.total) {
    var pct = Math.round(buildState.score / buildState.total * 100);
    var html = '<div class="empty-state"><div style="font-size:52px;font-weight:900;';
    html += 'background:var(--ga);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text">';
    html += buildState.score + '/' + buildState.total + '</div>';
    html += '<div style="color:var(--t2);margin:8px 0 4px;font-size:14px">造句完成 · 正确率 ' + pct + '%</div>';
    if (pct >= 80) html += '<div style="color:#34D399;font-size:13px;margin-bottom:16px">语法掌握很好！</div>';
    else if (pct >= 60) html += '<div style="color:#FBBF24;font-size:13px;margin-bottom:16px">不错，注意语序</div>';
    else html += '<div style="color:#FB923C;font-size:13px;margin-bottom:16px">多读句子，培养语感</div>';
    html += '<button class="btn primary" onclick="buildState=null;renderWords()">再来一轮</button></div>';
    c.innerHTML = html;
    return;
  }
  var s = buildState.sentences[buildState.round];
  if (!s) { buildState.round++; renderWords(); return; }
  var originalWords = s.en.replace(/[^a-zA-Z\s']/g, "").trim().split(/\s+/).filter(function(w){return w.length>0;});
  var shuffled = originalWords.slice().sort(function(){return Math.random()-0.5;});
  var html = '<div class="sb-container">';
  html += '<div class="sb-progress">第 ' + (buildState.round+1) + ' / ' + buildState.total + ' 句 · 得分 ' + buildState.score + '</div>';
  html += '<div class="pbar" style="margin-bottom:14px"><div class="pbar-fill" style="width:' + (buildState.round/buildState.total*100) + '%"></div></div>';
  html += '<div class="sb-prompt">';
  html += '<div class="sb-prompt-cn">' + esc(s.cn || "请将打乱的单词排列成正确的句子") + '</div>';
  html += '<div class="sb-prompt-hint">点击下方单词按正确顺序排列</div>';
  html += '</div>';
  html += '<div class="sb-answer-area" id="sb-answer-area" onclick="sbUndoLast()">';
  html += '<div class="sb-answer-placeholder" id="sb-placeholder">点击单词放入此处</div>';
  html += '</div>';
  html += '<div class="sb-word-bank" id="sb-word-bank">';
  shuffled.forEach(function(w, i) {
    html += '<div class="sb-word-chip" data-word="' + escAttr(w) + '" data-idx="' + i + '" onclick="sbAddWord(this)">' + esc(w) + '</div>';
  });
  html += '</div>';
  html += '<div class="sb-actions">';
  html += '<button class="btn sec sm" onclick="sbClear()">清空</button>';
  html += '<button class="btn cyan sm" onclick="sbHint()">提示</button>';
  html += '<button class="btn primary sm" onclick="sbCheck()">检查</button>';
  html += '<button class="btn sec sm" onclick="sbSkip()">跳过</button>';
  html += '</div>';
  html += '<div id="sb-result"></div>';
  html += '</div>';
  c.innerHTML = html;
  buildState.currentSentence = s.en.replace(/[^a-zA-Z\s']/g, "").trim().toLowerCase();
  buildState.currentCn = s.cn || "";
  buildState.answerWords = [];
}

function sbAddWord(chip) {
  if (chip.classList.contains("used")) return;
  chip.classList.add("used");
  var word = chip.getAttribute("data-word");
  var idx = chip.getAttribute("data-idx");
  buildState.answerWords.push({ word: word, idx: idx });
  var area = document.getElementById("sb-answer-area");
  var placeholder = document.getElementById("sb-placeholder");
  if (placeholder) placeholder.style.display = "none";
  var chipEl = document.createElement("div");
  chipEl.className = "sb-word-chip in-answer";
  chipEl.textContent = word;
  chipEl.setAttribute("data-idx", idx);
  chipEl.onclick = function(e) { e.stopPropagation(); sbRemoveWord(idx); };
  area.appendChild(chipEl);
}

function sbRemoveWord(idx) {
  var removed = false;
  buildState.answerWords = buildState.answerWords.filter(function(a) {
    if (!removed && a.idx === idx) { removed = true; return false; }
    return true;
  });
  var bankChips = document.querySelectorAll("#sb-word-bank .sb-word-chip");
  bankChips.forEach(function(c) { if (c.getAttribute("data-idx") === idx) c.classList.remove("used"); });
  sbRebuildAnswer();
}

function sbUndoLast() {
  if (!buildState.answerWords.length) return;
  var last = buildState.answerWords.pop();
  var bankChips = document.querySelectorAll("#sb-word-bank .sb-word-chip");
  bankChips.forEach(function(c) { if (c.getAttribute("data-idx") === last.idx) c.classList.remove("used"); });
  sbRebuildAnswer();
}

function sbRebuildAnswer() {
  var area = document.getElementById("sb-answer-area");
  if (!buildState.answerWords.length) {
    area.innerHTML = '<div class="sb-answer-placeholder" id="sb-placeholder">点击单词放入此处</div>';
    return;
  }
  area.innerHTML = "";
  buildState.answerWords.forEach(function(a) {
    var chipEl = document.createElement("div");
    chipEl.className = "sb-word-chip in-answer";
    chipEl.textContent = a.word;
    chipEl.setAttribute("data-idx", a.idx);
    chipEl.onclick = function(e) { e.stopPropagation(); sbRemoveWord(a.idx); };
    area.appendChild(chipEl);
  });
}

function sbClear() {
  buildState.answerWords = [];
  var bankChips = document.querySelectorAll("#sb-word-bank .sb-word-chip");
  bankChips.forEach(function(c) { c.classList.remove("used"); });
  sbRebuildAnswer();
}

function sbCheck() {
  if (!buildState.answerWords.length) { showToast("请先排列单词"); return; }
  var userAnswer = buildState.answerWords.map(function(a){return a.word;}).join(" ").toLowerCase();
  var correct = buildState.currentSentence;
  var resultEl = document.getElementById("sb-result");
  var area = document.getElementById("sb-answer-area");
  if (userAnswer === correct) {
    buildState.score++;
    area.classList.add("correct");
    resultEl.innerHTML = '<div class="sb-result correct"><div class="sb-result-icon">\u2705</div><div class="sb-result-text">\u6B63\u786E\uFF01</div></div>';
    document.querySelectorAll("#sb-word-bank .sb-word-chip").forEach(function(c){c.style.pointerEvents="none";});
    // Correct: auto-advance after 1.5s
    setTimeout(function() { buildState.round++; renderWords(); }, 1500);
  } else {
    area.classList.add("wrong");
    // Generate detailed error feedback
    var userWords = userAnswer.split(" ");
    var correctWords = correct.split(" ");
    var detailHtml = sbGenerateErrorDetail(userWords, correctWords);
    resultEl.innerHTML = '<div class="sb-result wrong">';
    resultEl.innerHTML += '<div class="sb-result-icon">\u274C</div>';
    resultEl.innerHTML += '<div class="sb-result-text">\u8BED\u5E8F\u4E0D\u6B63\u786E</div>';
    resultEl.innerHTML += detailHtml;
    resultEl.innerHTML += '<div class="sb-result-answer">\u6B63\u786E\u7B54\u6848: ' + esc(buildState.sentences[buildState.round].en) + '</div>';
    resultEl.innerHTML += '<button class="btn primary sm" style="margin-top:10px" onclick="sbNextAfterError()">\u4E0B\u4E00\u53E5</button>';
    resultEl.innerHTML += '</div>';
    addToErrorPool(buildState.sentences[buildState.round].en, buildState.currentCn, curDay ? curDay.day : 0);
    if (curDay) logError(curDay.day);
    // Disable word bank but DON'T auto-advance - user must click "下一句"
    document.querySelectorAll("#sb-word-bank .sb-word-chip").forEach(function(c){c.style.pointerEvents="none";});
  }
}

function sbGenerateErrorDetail(userWords, correctWords) {
  var html = '<div style="text-align:left;font-size:12px;line-height:1.6;margin:8px 0;padding:10px;background:rgba(0,0,0,.2);border-radius:8px">';
  // Word-by-word comparison
  var maxLen = Math.max(userWords.length, correctWords.length);
  var correctCount = 0;
  html += '<div style="font-weight:700;color:var(--org);margin-bottom:6px">\u23F3 \u9519\u8BEF\u5206\u6790:</div>';
  for (var i = 0; i < maxLen; i++) {
    var uw = i < userWords.length ? userWords[i] : '___';
    var cw = i < correctWords.length ? correctWords[i] : '';
    if (uw === cw) {
      correctCount++;
      html += '<div style="color:#34D399">\u2713 \u4F4D\u7F6E' + (i+1) + ': ' + esc(cw) + ' \u2714</div>';
    } else if (cw) {
      html += '<div style="color:#FB923C">\u2717 \u4F4D\u7F6E' + (i+1) + ': \u4F60\u5199\u4E86 "' + esc(uw) + '"\uFF0C\u5E94\u8BE5\u662F "' + esc(cw) + '"</div>';
    }
  }
  // Grammar hint
  html += '<div style="margin-top:8px;padding-top:6px;border-top:1px solid rgba(255,255,255,.06);color:var(--cyan2)">';
  if (correctCount === 0) {
    html += '\uD83D\uDCD6 \u63D0\u793A: \u6CE8\u610F\u53E5\u5B50\u5F00\u5934\uFF0C\u82F1\u8BED\u901A\u5E38\u4EE5\u4E3B\u8BED\u5F00\u5934';
  } else if (correctCount < maxLen / 2) {
    html += '\uD83D\uDCD6 \u63D0\u793A: \u524D\u9762\u51E0\u4E2A\u8BCD\u987A\u5E8F\u6B63\u786E\uFF0C\u6CE8\u610F\u540E\u534A\u53E5\u7684\u7ED3\u6784\uFF08\u52A8\u8BCD\u4F4D\u7F6E\u3001\u4ECB\u8BCD\u77ED\u8BED\uFF09';
  } else {
    html += '\uD83D\uDCD6 \u63D0\u793A: \u5927\u90E8\u5206\u6B63\u786E\uFF01\u53EA\u6709\u5C11\u6570\u4F4D\u7F6E\u9700\u8C03\u6574\uFF0C\u518D\u8BD5\u4E00\u6B21';
  }
  html += '</div></div>';
  return html;
}

function sbNextAfterError() {
  buildState.round++;
  renderWords();
}

function sbHint() {
  var resultEl = document.getElementById("sb-result");
  if (!resultEl) return;
  var s = buildState.sentences[buildState.round];
  var words = s.en.replace(/[^a-zA-Z\s']/g, "").trim().split(/\s+/);
  var hintHtml = '<div class="sb-result" style="background:rgba(251,191,36,.06);border:1px solid rgba(251,191,36,.2)">';
  hintHtml += '<div style="font-size:14px;font-weight:700;color:var(--ylw);margin-bottom:6px">\uD83D\uDCD6 \u8BED\u5E8F\u63D0\u793A</div>';
  // Show first 2 words as hint
  hintHtml += '<div style="font-size:13px;color:var(--t2);line-height:1.6">\u53E5\u5B50\u5F00\u5934: <b style="color:var(--t1)">' + esc(words.slice(0, Math.min(2, words.length)).join(" ")) + '</b>';
  if (words.length > 2) hintHtml += ' ...';
  hintHtml += '</div>';
  // Show sentence structure
  hintHtml += '<div style="font-size:12px;color:var(--t3);margin-top:6px">\u603B\u5171 ' + words.length + ' \u4E2A\u5355\u8BCD</div>';
  hintHtml += '</div>';
  resultEl.innerHTML = hintHtml;
}

function sbSkip() {
  buildState.round++;
  renderWords();
}

function answerQuiz(el, picked, correct) {
  document.querySelectorAll('.qo').forEach(o => o.disabled = true);
  var q = quizState.questions[quizState.round];
  if (picked === correct) {
    el.classList.add('correct'); quizState.score++;
    if (q) markWordKnown(q.word);
  } else {
    el.classList.add('wrong');
    document.querySelectorAll('.qo')[correct].classList.add('correct');
    if (q) { addToNotebook(q.word, q.translation, curDay ? curDay.day : 0); addToErrorPool(q.word, q.translation, curDay ? curDay.day : 0); }
    logError(curDay ? curDay.day : 0);
  }
  setTimeout(() => { quizState.round++; renderWords(); }, 800);
}

  next();
}

// ===== ESSAY with clickable words =====
function openEssay() {
  showPage('pg-essay');
  const d = curDay;
  const essay = d.essay || {};
  const sentences = essay.sentences || [];
  
  // V16: Support daily-comm format (essayEn/essayCn arrays)
  if (!sentences.length && d.essayEn && d.essayEn.length) {
    let html = '<div class="essay-card">';
    const enArr = d.essayEn || [];
    const cnArr = d.essayCn || [];
    for (var i = 0; i < enArr.length; i++) {
      if (!enArr[i]) continue;
      html += '<div class="es-item" onclick="speakSentence(this)" data-text="' + escAttr(enArr[i]||'') + '">';
      html += '<div class="en">' + makeClickableWords(enArr[i]||'') + '</div>';

// ===== V12: Online dictionary lookup =====
function lookupOnline(word) {
  var tip = document.getElementById('wl-tip');
  if (!tip) return;

  // Show loading
  var loadingEl = tip.querySelector('.wl-tip-online');
  if (loadingEl) {
    loadingEl.innerHTML = '<div class="wl-tip-loading">\u23F3 正在查询在线词典...</div>';
  }

  // Try free dictionary API
  fetch('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(word))
    .then(function(res) {
      if (!res.ok) throw new Error('Not found');
      return res.json();
    })
    .then(function(data) {
      var html = '';
      if (data && data[0]) {
        var entry = data[0];
        // Phonetics
        if (entry.phonetic) {
          html += '<div class="wl-tip-api-def"><b>音标:</b> ' + esc(entry.phonetic) + '</div>';
        }
        // Meanings
        if (entry.meanings && entry.meanings.length) {
          entry.meanings.forEach(function(m, mi) {
            if (mi >= 2) return; // Limit to 2 parts of speech
            html += '<div class="wl-tip-api-def"><b>' + esc(m.partOfSpeech || '') + ':</b> ';
            if (m.definitions && m.definitions.length) {
              var defs = m.definitions.slice(0, 2);
              defs.forEach(function(d, di) {
                html += (di > 0 ? '; ' : '') + esc(d.definition || '');
              });
            }
            html += '</div>';
          });
        }
      }
      if (!html) {
        // Fallback: open online dictionary in new tab
        html = '<div class="wl-tip-loading">未找到在线释义</div>';
        html += '<div style="text-align:center;margin-top:6px"><button class="wl-tip-online-btn" onclick="window.open(\'https://dict.youdao.com/w/' + encodeURIComponent(word) + '\', \'_blank\')">打开有道词典</button></div>';
      } else {
        html += '<div style="text-align:center;margin-top:6px"><button class="wl-tip-online-btn" onclick="window.open(\'https://dict.youdao.com/w/' + encodeURIComponent(word) + '\', \'_blank\')">查看完整释义</button></div>';
      }
      if (loadingEl) {
        loadingEl.innerHTML = html;
      }
    })
    .catch(function(err) {
      // Fallback: open online dictionary link
      if (loadingEl) {
        loadingEl.innerHTML = '<div style="text-align:center"><button class="wl-tip-online-btn" onclick="window.open(\'https://dict.youdao.com/w/' + encodeURIComponent(word) + '\', \'_blank\')">\uD83D\uDD17 在线词典查询</button></div>';
      }
    });
}

// ===== V8: Clickable words + lookup =====
function makeClickableWords(text) {
  if (!text) return '';
  // Split into words and punctuation, wrap each English word in a clickable span
  return text.replace(/([a-zA-Z'\-]+)/g, function(match) {
    return '<span class="wl-word" onclick="event.stopPropagation();lookupWord(\'' + match.replace(/'/g, "\\'") + '\',this)">' + match + '</span>';
  });
}

function lookupWord(word, el) {
  // Remove previous highlight
  document.querySelectorAll('.wl-word.lookuped').forEach(w => w.classList.remove('lookuped'));
  el.classList.add('lookuped');

  // Search ALL days for comprehensive lookup (always)
  var allWords = [];
  DATA.forEach(function(d) {
    if (!d) return;
    (d.newWords || []).forEach(function(w) { if (w) allWords.push(w); });
    (d.reviewWords || []).forEach(function(w) { if (w) allWords.push(w); });
  });

  const found = allWords.find(w => w.word && w.word.toLowerCase() === word.toLowerCase());

  const tip = document.getElementById('wl-tip');
  let html = '<div class="wl-tip-word">' + esc(word) + '</div>';

  if (found) {
    html += '<div class="wl-tip-trans">' + esc(found.translation || '') + '</div>';
    if (found.exampleEn) {
      html += '<div class="wl-tip-example"><div class="en">' + esc(found.exampleEn) + '</div>';
      if (found.exampleCn) html += '<div class="cn">' + esc(found.exampleCn) + '</div>';
      html += '</div>';
    }
    html += '<div class="wl-tip-actions"><button class="wl-tip-btn" onclick="speakSingleWord(\'' + word.replace(/'/g, "\\'") + '\')">🔊 朗读</button><button class="wl-tip-online-btn" onclick="lookupOnline(\'' + word.replace(/'/g, "\\'") + '\')">🔗 在线查询</button></div>';
  } else {
    var basicTrans = lookupBasicWord(word);
    if (basicTrans) {
      html += '<div class="wl-tip-trans">' + esc(basicTrans) + '</div>';
    } else {
      html += '<div class="wl-tip-notfound">正在联网查询...</div>';
    }
    html += '<div class="wl-tip-actions"><button class="wl-tip-btn" onclick="speakSingleWord(\'' + word.replace(/'/g, "\\'") + '\')">🔊 朗读</button></div>';
    html += '<div class="wl-tip-online" id="wl-online-area"></div>';
  }

  tip.innerHTML = html;

  // Position near the clicked word
  const rect = el.getBoundingClientRect();
  let left = rect.left;
  let top = rect.bottom + 8;

  // Keep within viewport
  const tipW = 240;
  if (left + tipW > window.innerWidth) left = window.innerWidth - tipW - 16;
  if (left < 8) left = 8;
  if (top + 200 > window.innerHeight) top = rect.top - 8;

  tip.style.left = left + 'px';
  tip.style.top = top + 'px';
  tip.style.display = 'block';

  // Auto-trigger online lookup if word not found locally
  if (!found && !lookupBasicWord(word)) {
    setTimeout(function() { lookupOnline(word); }, 300);
  }
}

  speak(word);

function escAttr(s) { if (!s) return ''; return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function getWordParts(word) {
  if (!word) return [];
  var w = word.trim();
  if (w.indexOf(' ') > -1) return w.split(/\s+/).filter(function(p){return p.length>0;});
  if (w.indexOf('-') > -1) return w.split('-').filter(function(p){return p.length>0;});
  if (w.indexOf('/') > -1) return w.split('/').filter(function(p){return p.length>0;});
  return [w];
}

function speakParts(partsStr) {
  var parts = partsStr.split('|').filter(function(p){return p.length>0;});
  if (!parts.length || !window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  var i = 0;
  function next() {
    if (i >= parts.length) return;
    var u = new SpeechSynthesisUtterance(parts[i]);
    var _tts = Store.get('ttsSettings', { rate: 0.85, voice: '' });
    u.lang = 'en-US'; u.rate = _tts.rate || 0.85; u.pitch = 1;
    if (_tts.voice) { var _vs = window.speechSynthesis.getVoices(); var _v = _vs.find(function(vv){return vv.name===_tts.voice;}); if (_v) u.voice = _v; }
    u.onend = function() { i++; setTimeout(next, 300); };
    window.speechSynthesis.speak(u);
  }
  next();
}

function speakTextStr(text) { speak(text); }
function speakText(el) {
  if (!window.speechSynthesis) return;
  var e = window.event || {};
  if (e.target && e.target.classList && e.target.classList.contains('wl-word')) return;
